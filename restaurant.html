<title>Menu | Cabana</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --night:#140A05; --night-2:#1C0E07; --char:#291509; --ash:#361C0E;
  --cream:#FFF3E3; --cream-2:rgba(255,243,227,.66); --cream-3:rgba(255,243,227,.40);
  --ember:#FF5A1F; --saffron:#FFB020; --chilli:#E8253F; --basil:#5BD98A;
  --heat:linear-gradient(115deg,#E8253F 0%,#FF5A1F 46%,#FFB020 100%);
  --edge:rgba(255,176,32,.14); --edge-2:rgba(255,176,32,.26);
  --lift:0 28px 70px rgba(0,0,0,.62);
  --fd:'Fraunces',Georgia,serif; --fb:'Inter',system-ui,sans-serif;
  --r:18px; --rl:26px;
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
html{scroll-behavior:smooth;}
body{font-family:var(--fb);background:var(--night);color:var(--cream);-webkit-font-smoothing:antialiased;
  overflow-x:hidden;padding-bottom:104px;}
img{max-width:100%;}

/* ═══════ TOP ═══════
   Transparent over the hero photograph, solid the moment you scroll
   past it, so the restaurant's own picture is never boxed in. */
.top{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:12px 18px;transition:background .3s,backdrop-filter .3s,border-color .3s;
  border-bottom:1px solid transparent;}
.top.stuck{background:rgba(20,10,5,.86);backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);border-bottom-color:var(--edge);}
.tbtn{width:40px;height:40px;border-radius:13px;flex-shrink:0;display:grid;place-items:center;cursor:pointer;
  border:1px solid rgba(255,243,227,.16);background:rgba(20,10,5,.55);backdrop-filter:blur(10px);
  color:var(--cream);text-decoration:none;transition:.22s;}
.tbtn:hover{border-color:var(--saffron);color:var(--saffron);}
.tbtn svg{width:17px;height:17px;}
.top-mid{flex:1;min-width:0;text-align:center;opacity:0;transform:translateY(6px);transition:.3s;pointer-events:none;}
.top.stuck .top-mid{opacity:1;transform:none;}
.top-mid b{font-family:var(--fd);font-weight:600;font-size:15px;letter-spacing:-.02em;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-r{display:flex;gap:8px;flex-shrink:0;}

/* ═══════ HERO ═══════
   The restaurant's own photographs, cross-faded rather than slid,
   so the room never appears to be on rails. Each frame drifts very
   slowly while it is up — the way a camera breathes — and the next
   one is already fading in before the last has finished moving, so
   there is no moment where nothing is happening.
   ═══════════════════════════════════════════════════════════════ */
.hero{position:relative;height:clamp(360px,56vh,540px);overflow:hidden;background:var(--char);}
.hero-img{position:absolute;inset:0;}
.hero-fr{position:absolute;inset:0;opacity:0;transition:opacity 1.5s ease;will-change:opacity;}
.hero-fr.on{opacity:1;}
.hero-fr img{width:100%;height:100%;object-fit:cover;}
/* only the frame on screen spends anything on animation */
.hero-fr.on img{animation:drift 20s ease-out forwards;}
@keyframes drift{from{transform:scale(1.03);}to{transform:scale(1.13) translate(-1.4%,-1%);}}
@media(prefers-reduced-motion:reduce){
  .hero-fr.on img{animation:none;transform:scale(1.03);}
  .hero-fr{transition-duration:.01ms;}
}
.hero-none{position:absolute;inset:0;display:grid;place-items:center;font-size:76px;
  background:linear-gradient(140deg,var(--ash),var(--char));}

/* the frames, counted along the bottom edge of the photograph */
.hero-dots{position:absolute;right:22px;bottom:20px;z-index:4;display:flex;gap:7px;align-items:center;}
@media(max-width:600px){.hero-dots{right:15px;bottom:16px;}}
.hero-dot{width:7px;height:7px;border-radius:100px;cursor:pointer;padding:0;
  border:none;background:rgba(255,243,227,.34);
  transition:width .5s cubic-bezier(.22,1,.36,1),background .35s;}
.hero-dot:hover{background:rgba(255,243,227,.62);}
.hero-dot.on{width:22px;background:var(--saffron);}
.hero-count{position:absolute;left:22px;top:calc(env(safe-area-inset-top) + 64px);z-index:4;
  display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:100px;
  background:rgba(20,10,5,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,243,227,.14);
  font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--cream-2);
  font-variant-numeric:tabular-nums;}
.hero-count svg{width:12px;height:12px;}
@media(max-width:600px){.hero-count{left:15px;}}

/* ═══════ CART BUTTON ═══════ */
.cart-btn{position:relative;width:40px;height:40px;border-radius:13px;flex-shrink:0;
  display:grid;place-items:center;cursor:pointer;
  border:1px solid rgba(255,243,227,.16);background:rgba(20,10,5,.55);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--cream);transition:.22s;}
.cart-btn:hover{border-color:var(--saffron);color:var(--saffron);}
.cart-btn svg{width:17px;height:17px;}
.cart-n{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;
  border-radius:100px;place-items:center;background:var(--heat);color:#1A0A03;
  font-size:10.5px;font-weight:800;line-height:1;box-shadow:0 3px 10px rgba(255,90,31,.5);}
.hero-scrim{position:absolute;inset:0;
  background:linear-gradient(to top,var(--night) 1%,rgba(20,10,5,.86) 22%,rgba(20,10,5,.24) 62%,rgba(20,10,5,.5));}
.hero-in{position:absolute;left:0;right:0;bottom:0;padding:0 22px 22px;max-width:1120px;margin:0 auto;}
.hero-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px;}
.st{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:100px;font-size:11px;font-weight:800;
  letter-spacing:.05em;background:rgba(20,10,5,.66);backdrop-filter:blur(8px);}
.st.open{color:var(--basil);border:1px solid rgba(91,217,138,.36);}
.st.shut{color:var(--cream-3);border:1px solid var(--edge);}
.pip{width:7px;height:7px;border-radius:50%;background:var(--basil);animation:pip 2.2s ease-in-out infinite;}
@keyframes pip{0%,100%{box-shadow:0 0 0 0 rgba(91,217,138,.6);}70%{box-shadow:0 0 0 7px rgba(91,217,138,0);}}
.cui{font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--saffron);}
h1{font-family:var(--fd);font-weight:600;font-variation-settings:'SOFT' 50,'WONK' 1;
  font-size:clamp(31px,6.2vw,58px);line-height:.98;letter-spacing:-.035em;margin-bottom:9px;
  text-shadow:0 3px 30px rgba(0,0,0,.6);}
.where{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--cream-2);}
.where svg{width:13px;height:13px;flex-shrink:0;}

/* ═══════ WRAP ═══════ */
.wrap{max-width:1120px;margin:0 auto;padding:0 22px;position:relative;z-index:2;}
@media(max-width:600px){.wrap{padding:0 15px;}.hero-in{padding:0 15px 20px;}.top{padding:10px 13px;}}

/* ── fact strip ── */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin:20px 0 4px;}
.fx{padding:13px 14px;border-radius:14px;background:rgba(255,243,227,.045);border:1px solid var(--edge);}
.fx-l{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--cream-3);margin-bottom:5px;}
.fx-v{font-family:var(--fd);font-weight:600;font-size:16px;letter-spacing:-.02em;color:var(--cream);}
.fx-v small{font-family:var(--fb);font-weight:600;font-size:12px;color:var(--cream-2);}

.tell{font-size:14.5px;line-height:1.75;color:var(--cream-2);margin:20px 0 0;max-width:70ch;}
.serves{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.sv{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:100px;font-size:12.5px;font-weight:600;
  background:rgba(91,217,138,.1);border:1px solid rgba(91,217,138,.26);color:var(--basil);}
.sv svg{width:12px;height:12px;}
.sv.no{background:rgba(255,243,227,.03);border-color:var(--edge);color:var(--cream-3);}

/* ═══════ PROMOS ═══════ */
.promos{display:flex;gap:12px;overflow-x:auto;margin:26px 0 0;padding-bottom:8px;scrollbar-width:none;}
.promos::-webkit-scrollbar{display:none;}
.pm{flex-shrink:0;width:min(84vw,340px);border-radius:var(--rl);padding:20px 22px;color:#1A0A03;background:var(--heat);
  position:relative;overflow:hidden;box-shadow:0 14px 38px rgba(255,90,31,.26);}
.pm::after{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.16);}
.pm-k{font-size:9.5px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;opacity:.74;margin-bottom:8px;position:relative;}
.pm-t{font-family:var(--fd);font-weight:700;font-size:21px;letter-spacing:-.03em;line-height:1.12;margin-bottom:6px;position:relative;}
.pm-d{font-size:13px;font-weight:500;opacity:.84;line-height:1.5;position:relative;}
.pm-c{display:inline-block;margin-top:12px;padding:6px 13px;border-radius:8px;background:rgba(26,10,3,.18);
  font-size:12px;font-weight:800;letter-spacing:.06em;position:relative;}

/* ═══════ SECTION NAV ═══════ */
.snav{position:sticky;top:64px;z-index:90;margin:34px 0 4px;padding:11px 0;
  background:rgba(20,10,5,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);}
.snav-in{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:1120px;margin:0 auto;padding:0 22px;}
.snav-in::-webkit-scrollbar{display:none;}
@media(max-width:600px){.snav-in{padding:0 15px;}}
.sn{flex-shrink:0;padding:9px 16px;border-radius:100px;cursor:pointer;white-space:nowrap;
  border:1px solid var(--edge);background:rgba(255,243,227,.04);color:var(--cream-2);
  font-family:var(--fb);font-size:12.5px;font-weight:600;transition:.22s;}
.sn:hover{border-color:var(--saffron);color:var(--saffron);}
.sn.on{background:var(--heat);border-color:transparent;color:#1A0A03;font-weight:800;}

/* ═══════ MENU ═══════ */
.msec{padding-top:36px;scroll-margin-top:126px;}
.mhead{margin-bottom:18px;}
.mhead h2{font-family:var(--fd);font-weight:500;font-variation-settings:'SOFT' 50;
  font-size:clamp(23px,3.6vw,33px);letter-spacing:-.03em;line-height:1.1;}
.mhead p{font-size:13.5px;color:var(--cream-3);margin-top:6px;line-height:1.6;max-width:60ch;}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;}
@media(max-width:640px){.mlist{grid-template-columns:1fr;}}

.it{position:relative;display:flex;gap:14px;padding:14px;border-radius:var(--r);cursor:pointer;text-align:left;width:100%;scroll-margin-top:150px;
  background:var(--night-2);border:1px solid var(--edge);font-family:var(--fb);color:inherit;
  transition:transform .34s cubic-bezier(.22,1,.36,1),border-color .3s,box-shadow .34s,background .3s;}
/* the whole card, as one target, under everything else on it */
.it-hit{position:absolute;inset:0;z-index:1;border:none;background:none;cursor:pointer;
  padding:0;border-radius:inherit;font:inherit;color:inherit;}
.it-hit:focus-visible{outline:2px solid var(--saffron);outline-offset:2px;}
.it:hover{transform:translateY(-4px);border-color:var(--edge-2);box-shadow:var(--lift);background:var(--char);}
.it-p{width:104px;height:104px;flex-shrink:0;border-radius:13px;overflow:hidden;position:relative;background:var(--char);}
.it-p img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.22,1,.36,1);}
.it:hover .it-p img{transform:scale(1.08);}
.it-none{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;
  background:linear-gradient(140deg,var(--ash),var(--char));}
.it-b{display:flex;flex-direction:column;min-width:0;flex:1;}
.it-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px;}
.bg{display:inline-block;padding:3px 9px;border-radius:100px;font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;}
.b-fav{background:rgba(255,176,32,.95);color:#20100A;}
.b-new{background:rgba(91,217,138,.95);color:#0A2213;}
.b-chef{background:rgba(255,243,227,.95);color:#20100A;}
.b-spicy{background:rgba(232,37,63,.95);color:#FFF3E3;}
.b-vegan{background:rgba(91,217,138,.86);color:#0A2213;}
.b-healthy{background:rgba(120,200,255,.9);color:#04202E;}
.b-deal{background:var(--heat);color:#1A0A03;}
.it-n{font-family:var(--fd);font-weight:600;font-size:17px;letter-spacing:-.025em;line-height:1.2;margin-bottom:5px;}
.it-d{font-size:12.5px;line-height:1.55;color:var(--cream-3);margin-bottom:9px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.it-f{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:auto;}
.it-pr{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:-.03em;color:var(--saffron);white-space:nowrap;}
.it-pr s{color:var(--cream-3);font-size:12.5px;font-weight:400;margin-right:6px;}
.it-add{width:33px;height:33px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;padding:0;
  cursor:pointer;font-family:inherit;
  background:rgba(255,176,32,.12);border:1px solid var(--edge-2);color:var(--saffron);transition:.26s;}
.it:hover .it-add{background:var(--heat);color:#1A0A03;border-color:transparent;transform:scale(1.12);}
.it-add:hover{background:var(--heat)!important;color:#1A0A03!important;border-color:transparent!important;
  transform:scale(1.22)!important;}
.it-add:focus-visible{outline:2px solid var(--saffron);outline-offset:2px;}
.it-add svg{width:15px;height:15px;}
.it-qty{position:absolute;top:-6px;right:-6px;min-width:21px;height:21px;border-radius:100px;padding:0 6px;
  display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--heat);color:#1A0A03;
  box-shadow:0 3px 10px rgba(255,90,31,.5);}
.it-addwrap{position:relative;z-index:2;flex-shrink:0;}

/* ═══════ GALLERY ═══════
   The room again at the foot of the menu, after the food rather
   than before it, because by now you have decided what to eat and
   the only question left is what the place is like. It carries
   itself along slowly and stops the moment a finger touches it.
   ═══════════════════════════════════════════════════════════════ */
.gal-wrap{position:relative;}
.gal{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
.gal::-webkit-scrollbar{display:none;}
.gal img{flex-shrink:0;width:min(70vw,300px);aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);
  border:1px solid var(--edge);cursor:pointer;scroll-snap-align:center;
  transition:transform .5s cubic-bezier(.22,1,.36,1),border-color .35s;}
.gal img:hover{transform:scale(1.02);border-color:var(--edge-2);}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:38px;height:38px;
  border-radius:50%;display:none;place-items:center;cursor:pointer;
  border:1px solid var(--edge-2);background:rgba(20,10,5,.82);backdrop-filter:blur(10px);
  color:var(--cream);transition:.22s;}
.gal-nav:hover{border-color:var(--saffron);color:var(--saffron);}
.gal-nav svg{width:16px;height:16px;}
.gal-nav.prev{left:-6px;}
.gal-nav.next{right:-6px;}
@media(hover:hover) and (min-width:760px){.gal-wrap:hover .gal-nav{display:grid;}}
.gal-rule{display:flex;align-items:center;gap:12px;margin-top:12px;}
.gal-bar{flex:1;height:2px;border-radius:100px;background:rgba(255,243,227,.09);overflow:hidden;}
.gal-bar i{display:block;height:100%;width:0;border-radius:100px;background:var(--heat);
  transition:width .45s cubic-bezier(.22,1,.36,1);}
.gal-c{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--cream-3);
  font-variant-numeric:tabular-nums;flex-shrink:0;}

/* ═══════ INFO ═══════ */
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:18px;}
.ic{padding:17px 18px;border-radius:var(--r);background:rgba(255,243,227,.04);border:1px solid var(--edge);}
.ic-l{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-3);margin-bottom:8px;}
.ic-v{font-size:14px;line-height:1.65;color:var(--cream);}
.ic-v a{color:var(--saffron);text-decoration:none;}
.ic-v a:hover{text-decoration:underline;}
.days{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;}
.dy{width:32px;height:29px;border-radius:8px;display:grid;place-items:center;font-size:10.5px;font-weight:700;
  text-transform:capitalize;background:rgba(255,243,227,.04);border:1px solid var(--edge);color:var(--cream-3);}
.dy.on{background:rgba(91,217,138,.14);border-color:rgba(91,217,138,.3);color:var(--basil);}

/* ═══════ ORDER TRAY ═══════ */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:300;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(20,10,5,.94);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-top:1px solid var(--edge-2);transform:translateY(120%);transition:transform .44s cubic-bezier(.22,1,.36,1);}
.tray.up{transform:none;}
.tray-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.tray-sum{flex:1;min-width:0;}
.tray-n{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-3);margin-bottom:2px;}
.tray-v{font-family:var(--fd);font-weight:700;font-size:21px;letter-spacing:-.03em;color:var(--cream);}
/* When there is food from somewhere else in the order too, the tray
   says so rather than letting it be discovered at the checkout. */
.tray-else{display:block;font-size:11px;font-weight:600;color:var(--saffron);margin-top:3px;
  letter-spacing:0;text-transform:none;}
.tray-else a{color:inherit;text-decoration:underline;text-underline-offset:2px;}
.tray-b{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:100px;border:none;cursor:pointer;
  background:var(--heat);color:#1A0A03;font-family:var(--fb);font-weight:800;font-size:14.5px;flex-shrink:0;
  box-shadow:0 8px 26px rgba(255,90,31,.4);transition:transform .22s,box-shadow .22s;}
.tray-b:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(255,90,31,.56);}
.tray-b svg{width:16px;height:16px;}
.tray-x{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--edge-2);background:transparent;color:var(--cream-3);transition:.22s;}
.tray-x:hover{color:var(--chilli);border-color:var(--chilli);}
.tray-x svg{width:15px;height:15px;}

/* ═══════ SHEET ═══════ */
.ov{position:fixed;inset:0;z-index:500;background:rgba(8,4,2,.78);backdrop-filter:blur(7px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:.34s;padding:0;}
@media(min-width:680px){.ov{align-items:center;padding:26px;}}
.ov.on{opacity:1;visibility:visible;}
.sh{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--night-2);

<script>
/* ═══════════════════════════════════════════════════════════════
   CABANA · ONE RESTAURANT
   The menu, exactly as the kitchen typed it.

   The order lives above this page, in CabanaCart, so a diner can
   take this kitchen's biryani and somebody else's cake without
   choosing between them or losing one on the way. This page shows
   its own kitchen's part of that order in the tray, and says
   plainly when there is food from elsewhere in it too.

   What the order is not is a payment. Cabana never sits between
   the diner and the counter, never marks a price up and never
   takes a cut, so nothing here charges anybody: the checkout's job
   is to hand each kitchen a complete ticket the diner sends
   themselves.
   ═══════════════════════════════════════════════════════════════ */
'use strict';

var SB = supabase.createClient(
  'https://gfwgbgdvxtocwhilrtdw.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdmd2diZ2R2eHRvY3doaWxydGR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MTE2NjMsImV4cCI6MjA5NzA4NzY2M30.U8JClv06YsNAwq9qsPb3lQ4SIPeRPjKMzsYxVfcmujw'
);

var ID = new URLSearchParams(location.search).get('id') || '';
var R = null, P = {}, SECS = [], ITEMS = [], PROMOS = [];
var SHOTS = [];                      // every photograph of this restaurant
var ORDER = {};                      // item id -> qty, mirrored from the basket
var CUR = 'KES';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){ return CUR+' '+Number(n||0).toLocaleString(); }
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('up');
  clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove('up');},2600);}
function js(v){ return "'"+String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'"; }
function priceOf(it){ return Number(it.promo_price!=null?it.promo_price:it.price)||0; }

var BADGE={favourite:['b-fav',"People's favourite"],'new':['b-new','New'],chef:['b-chef',"Chef's pick"],
  spicy:['b-spicy','Hot'],vegan:['b-vegan','Vegan'],healthy:['b-healthy','Light']};
var DAYS=['mon','tue','wed','thu','fri','sat','sun'];
var DAYIDX={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};

function mins(t){ if(!t)return null; var m=/^(\d{1,2}):(\d{2})/.exec(t); return m?(+m[1])*60+(+m[2]):null; }
function cooking(){
  var o=mins(P.opens_at), c=mins(P.closes_at), now=new Date();
  var days=P.open_days&&P.open_days.length?P.open_days:DAYS;
  var today=Object.keys(DAYIDX).filter(function(d){return DAYIDX[d]===now.getDay();})[0];
  if(days.indexOf(today)===-1) return false;
  if(o==null||c==null) return null;
  var nm=now.getHours()*60+now.getMinutes();
  return c>o ? (nm>=o&&nm<c) : (nm>=o||nm<c);
}
function pretty(t){
  var m=mins(t); if(m==null)return t||'';
  var h=Math.floor(m/60), mm=m%60, ap=h>=12?'pm':'am', hh=h%12||12;
  return hh+(mm?':'+String(mm).padStart(2,'0'):'')+ap;
}

/* ═══════ LOAD ═══════ */
if(!ID){ fail('No restaurant was named in the link.','Go back to the food page and pick a kitchen.'); }
else {
  SB.from('listings').select('*').eq('id',ID).maybeSingle().then(function(r){
    if(r.error||!r.data){ fail('That kitchen is not here.','It may have been paused or taken down. Every other kitchen is still on the food page.'); return; }
    R=r.data;
    if((R.service||R.type)!=='food'){ location.replace('food.html'); return; }
    return Promise.all([
      SB.from('restaurant_profiles').select('*').eq('listing_id',ID).maybeSingle(),
      SB.from('menu_sections').select('*').eq('listing_id',ID).eq('is_active',true).order('sort_order'),
      SB.from('menu_items').select('*').eq('listing_id',ID).order('sort_order'),
      SB.from('restaurant_promos').select('*').eq('listing_id',ID).eq('is_active',true).order('sort_order')
    ]).then(function(res){
      P=res[0].data||{}; SECS=res[1].data||[]; ITEMS=res[2].data||[];
      var now=Date.now();
      PROMOS=(res[3].data||[]).filter(function(p){
        if(p.starts_at&&new Date(p.starts_at).getTime()>now) return false;
        if(p.ends_at&&new Date(p.ends_at).getTime()<now) return false;
        return true;
      });
      ITEMS=ITEMS.filter(function(i){
        if(i.is_available===false) return false;
        if(i.sold_out_until&&new Date(i.sold_out_until).getTime()>now) return false;
        return true;
      });
      CUR=P.currency||R.currency||'KES';
      restoreOrder();
      render();
    });
  }).catch(function(e){
    console.warn('[restaurant]',e);
    fail('We could not reach the kitchen.','Check your connection and try again.');
  });
}

function fail(t,s){
  document.getElementById('app').innerHTML='<div class="wrap" style="padding-top:100px"><div class="void">'
    +'<div class="void-i">🍽️</div><div class="void-t">'+esc(t)+'</div>'
    +'<div class="void-s">'+esc(s)+'</div>'
    +'<a class="void-b" href="food.html">See every kitchen '
    +'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div></div>';
}

/* The link people paste into a group chat should say which kitchen it is
   and what it costs, not "Menu | Cabana" for every restaurant on Cabana. */
function head(){
  var where=[R.area,R.city].filter(Boolean).join(', ')||R.location||'Kenya';
  var cuis=(P.cuisines||[]).filter(Boolean).join(', ');
  var from=ITEMS.length?Math.min.apply(null,ITEMS.map(priceOf)):null;
  var desc=[P.tagline||R.description||'',
            (cuis?cuis+' in '+where:where)+'.',
            from!=null?'Dishes from '+money(from)+'.':'',
            'Order straight from the kitchen, no commission added.'
           ].filter(Boolean).join(' ').slice(0,300);
  var url='https://cabana.africa/restaurant?id='+encodeURIComponent(ID);
  var img=P.hero_photo||(R.photos&&R.photos[0])||'https://cabana.africa/og-food.jpg';
  function meta(sel,attr,val){
    var el=document.head.querySelector(sel);
    if(!el){ el=document.createElement('meta');
      var m=/\[(\w+)="([^"]+)"\]/.exec(sel); if(m)el.setAttribute(m[1],m[2]);
      document.head.appendChild(el); }
    el.setAttribute(attr,val);
  }
  meta('meta[name="description"]','content',desc);
  meta('meta[property="og:title"]','content',(R.title||'Menu')+' | Cabana');
  meta('meta[property="og:description"]','content',desc);
  meta('meta[property="og:image"]','content',img);
  meta('meta[property="og:url"]','content',url);
  meta('meta[name="twitter:card"]','content','summary_large_image');
  meta('meta[name="twitter:title"]','content',(R.title||'Menu')+' | Cabana');
  meta('meta[name="twitter:description"]','content',desc);
  meta('meta[name="twitter:image"]','content',img);
  var link=document.head.querySelector('link[rel="canonical"]');
  if(!link){ link=document.createElement('link'); link.rel='canonical'; document.head.appendChild(link); }
  link.href=url;

  /* Structured data for the menu, so a search result can show the dishes
     and the prices the kitchen actually set. */
  var ld={'@context':'https://schema.org','@type':'Restaurant',name:R.title||'Restaurant',
    url:url,image:img,
    address:{'@type':'PostalAddress',streetAddress:R.street||undefined,
      addressLocality:R.city||undefined,addressRegion:R.area||undefined,
      addressCountry:R.country||'KE'},
    priceRange:from!=null?money(from)+'+':undefined,
    telephone:P.order_phone||R.contact_phone||undefined,
    servesCuisine:(P.cuisines||[]).filter(Boolean)};
  if(ITEMS.length){
    ld.hasMenu={'@type':'Menu',name:'Menu',hasMenuSection:SECS.map(function(sec){
      var its=ITEMS.filter(function(i){return i.section_id===sec.id;});
      if(!its.length) return null;
      return {'@type':'MenuSection',name:sec.name,hasMenuItem:its.map(function(i){
        return {'@type':'MenuItem',name:i.name,description:i.description||undefined,
          offers:{'@type':'Offer',price:String(priceOf(i)),priceCurrency:CUR}};
      })};
    }).filter(Boolean)};
  }
  var tag=document.getElementById('ldjson');
  if(!tag){ tag=document.createElement('script'); tag.type='application/ld+json'; tag.id='ldjson'; document.head.appendChild(tag); }
  tag.textContent=JSON.stringify(ld);
}

/* ═══════ RENDER ═══════ */
function render(){
  document.title=(R.title||'Menu')+' | Cabana';
  document.getElementById('topName').textContent=R.title||'';
  head();
  var back=new URLSearchParams(location.search).get('from');
  if(back==='dash') document.getElementById('backBtn').href='partner-listings.html';

  var open=cooking();
  /* Every photograph the restaurant has, hero first, then the room,
     then whatever a dish was shot against if the room was never
     photographed. Deduplicated, because a hero that is also the
     first gallery shot would otherwise fade to itself. */
  SHOTS=[];
  [P.hero_photo].concat(R.photos||[]).forEach(function(u){
    if(u&&SHOTS.indexOf(u)===-1) SHOTS.push(u);
  });
  if(SHOTS.length<2){
    ITEMS.forEach(function(i){ if(i.photo&&SHOTS.indexOf(i.photo)===-1&&SHOTS.length<6) SHOTS.push(i.photo); });
  }
  var cuis=(P.cuisines||[]).filter(Boolean).join(' · ');
  var where=[R.area,R.city].filter(Boolean).join(', ')||R.location||'Kenya';

  /* buckets: every section the kitchen made, then anything it never
     filed, so a dish can never fall off the page because nobody
     remembered to give it a home. */
  var buckets=SECS.map(function(s){
    return {s:s,items:ITEMS.filter(function(i){return i.section_id===s.id;})};
  }).filter(function(b){return b.items.length;});
  var loose=ITEMS.filter(function(i){
    return !i.section_id || !SECS.some(function(s){return s.id===i.section_id;}); });
  if(loose.length) buckets.push({s:{id:'_loose',name:buckets.length?'Also on the menu':'The menu'},items:loose});

  var from=ITEMS.length?Math.min.apply(null,ITEMS.map(priceOf)):null;

  var html='';
  /* hero */
  html+='<section class="hero"><div class="hero-img" id="heroImg">'
    +(SHOTS.length
      ? SHOTS.map(function(u,i){
          return '<div class="hero-fr'+(i?'':' on')+'" data-fr="'+i+'">'
            +'<img src="'+esc(u)+'" alt="'+esc(R.title)+(i?' ':' ')+'" '
            +(i?'loading="lazy"':'fetchpriority="high"')+' decoding="async" '
            +'onerror="dropFrame(this)"/></div>';
        }).join('')
      : '<div class="hero-none">🍽️</div>')
    +'</div><div class="hero-scrim"></div>'
    +(SHOTS.length>1
      ? '<div class="hero-count">'
        +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.6" y="5.4" width="18.8" height="14.2" rx="2.4"/><circle cx="12" cy="12.5" r="3.4"/><path d="M8.4 5.4 9.8 2.9h4.4l1.4 2.5"/></svg>'
        +'<span id="heroC">1 / '+SHOTS.length+'</span></div>'
        +'<div class="hero-dots" id="heroDots">'+SHOTS.map(function(u,i){
          return '<button class="hero-dot'+(i?'':' on')+'" type="button" data-go="'+i+'" '
            +'aria-label="Photograph '+(i+1)+' of '+SHOTS.length+'"></button>';
        }).join('')+'</div>'
      : '')
    +'<div class="hero-in">'
    +'<div class="hero-line">'
    +(open===true?'<span class="st open"><span class="pip"></span>Cooking now</span>'
      :open===false?'<span class="st shut">Closed right now</span>':'')
    +(cuis?'<span class="cui">'+esc(cuis)+'</span>':'')
    +'</div><h1>'+esc(R.title||'Kitchen')+'</h1>'
    +'<div class="where"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>'
    +esc(where)+'</div></div></section>';

  /* facts */
  var fx=[];
  if(from!=null) fx.push(['Dishes from','<span class="fx-v">'+money(from)+'</span>']);
  if(ITEMS.length) fx.push(['On the menu','<span class="fx-v">'+ITEMS.length+' <small>dish'+(ITEMS.length===1?'':'es')+'</small></span>']);
  if(P.delivery_mins) fx.push(['Delivery','<span class="fx-v">'+P.delivery_mins+' <small>min</small></span>']);
  else if(P.prep_mins) fx.push(['Ready in','<span class="fx-v">'+P.prep_mins+' <small>min</small></span>']);
  if(P.delivery_fee!=null) fx.push(['Delivery fee','<span class="fx-v">'+(Number(P.delivery_fee)===0?'Free':money(P.delivery_fee))+'</span>']);
  if(P.min_order) fx.push(['Minimum order','<span class="fx-v">'+money(P.min_order)+'</span>']);
  if(P.opens_at&&P.closes_at) fx.push(['Hours','<span class="fx-v" style="font-size:14px">'+esc(pretty(P.opens_at))+' to '+esc(pretty(P.closes_at))+'</span>']);

  html+='<div class="wrap">';
  if(fx.length) html+='<div class="facts">'+fx.map(function(f){
    return '<div class="fx"><div class="fx-l">'+f[0]+'</div>'+f[1]+'</div>'; }).join('')+'</div>';

  var tell=P.tagline||R.description||'';
  if(tell) html+='<p class="tell">'+esc(tell)+'</p>';
  if(P.signature_dish) html+='<p class="tell" style="margin-top:10px"><strong style="color:var(--saffron)">Ask for the '+esc(P.signature_dish)+'.</strong></p>';

  var sv=[];
  sv.push(['Delivery',P.serves_delivery!==false]);
  sv.push(['Collection',P.serves_pickup!==false]);
  sv.push(['Eat in',P.serves_dine_in!==false]);
  if(P.halal) sv.push(['Halal',true]);
  if(P.serves_alcohol) sv.push(['Bar',true]);
  html+='<div class="serves">'+sv.map(function(s){
    return '<span class="sv'+(s[1]?'':' no')+'">'
      +(s[1]?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
            :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>')
      +esc(s[1]?s[0]:'No '+s[0].toLowerCase())+'</span>'; }).join('')+'</div>';

  if(PROMOS.length){
    var KIND={offer:'Offer',happy_hour:'Happy hour',combo:'Combo',free_delivery:'Free delivery'};
    html+='<div class="promos">'+PROMOS.map(function(p){
      var end=p.ends_at?new Date(p.ends_at):null;
      var left=end?Math.round((end-Date.now())/3600000):null;
      return '<div class="pm"><div class="pm-k">'+esc(KIND[p.kind]||'Offer')
        +(p.discount_pct?' · '+p.discount_pct+'% off':'')
        +(left!=null&&left>0&&left<72?' · '+left+'h left':'')+'</div>'
        +'<div class="pm-t">'+esc(p.title)+'</div>'
        +(p.detail?'<div class="pm-d">'+esc(p.detail)+'</div>':'')
        +(p.code?'<div class="pm-c">Say "'+esc(p.code)+'" when you order</div>':'')+'</div>';
    }).join('')+'</div>';
  }
  html+='</div>';

  /* section nav */
  if(buckets.length>1){
    html+='<nav class="snav"><div class="snav-in" id="snavIn">'+buckets.map(function(b,i){
      return '<button class="sn'+(i?'':' on')+'" data-sec="'+esc(b.s.id)+'" onclick="jump('+js(b.s.id)+')">'
        +esc(b.s.name)+'</button>'; }).join('')+'</div></nav>';
  }

  /* menu */
  html+='<div class="wrap">';
  if(!ITEMS.length){
    html+='<div class="void"><div class="void-i">📝</div>'
      +'<div class="void-t">The menu is not up yet</div>'
      +'<div class="void-s">'+esc(R.title||'This kitchen')+' is on Cabana but has not typed its dishes in. '
      +'Nothing here is invented to fill the gap, so the page waits. '
      +(P.order_whatsapp||R.contact_whatsapp?'You can still message the kitchen directly.':'')
      +'</div>'
      +(P.order_whatsapp||R.contact_whatsapp
        ?'<a class="void-b" href="https://wa.me/'+esc(String(P.order_whatsapp||R.contact_whatsapp).replace(/\D/g,''))
          +'" target="_blank" rel="noopener">Message the kitchen</a>':'')
      +'</div>';
  } else {
    buckets.forEach(function(b){
      html+='<section class="msec" id="sec-'+esc(b.s.id)+'"><div class="mhead"><h2>'+esc(b.s.name)+'</h2>'
        +(b.s.note?'<p>'+esc(b.s.note)+'</p>':'')+'</div><div class="mlist">'
        +b.items.map(itemCard).join('')+'</div></section>';
    });
  }

  /* ── the room, at the foot of the menu ──────────────────────────
        Everything the restaurant has photographed, including the
        plates, so a kitchen that only ever shot its food still has
        something to show. It carries itself along on its own and
        stops the moment anybody touches it. */
  var shots=[];
  (R.photos||[]).forEach(function(u){ if(u&&shots.indexOf(u)===-1) shots.push(u); });
  if(P.hero_photo&&shots.indexOf(P.hero_photo)===-1) shots.unshift(P.hero_photo);
  ITEMS.forEach(function(i){ if(i.photo&&shots.indexOf(i.photo)===-1) shots.push(i.photo); });

  if(shots.length>1){
    html+='<section class="msec"><div class="mhead"><h2>Inside '+esc(R.title||'the place')+'</h2>'
      +'<p>'+shots.length+' photographs, all taken by the restaurant itself.</p></div>'
      +'<div class="gal-wrap">'
      +'<button class="gal-nav prev" type="button" onclick="galNudge(-1)" aria-label="Previous photograph">'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5.6 8.4 12l6.6 6.4"/></svg></button>'
      +'<div class="gal" id="gal">'
      +shots.map(function(u){return '<img src="'+esc(u)+'" alt="'+esc(R.title)+'" loading="lazy" decoding="async" onclick="zoom('+js(u)+')" onerror="this.remove()"/>';}).join('')
      +'</div>'
      +'<button class="gal-nav next" type="button" onclick="galNudge(1)" aria-label="Next photograph">'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.6 15.6 12 9 18.4"/></svg></button>'
      +'<div class="gal-rule"><div class="gal-bar"><i id="galBar"></i></div>'
      +'<span class="gal-c" id="galC">1 / '+shots.length+'</span></div>'
      +'</div></section>';
  }

  /* info */
  html+='<section class="msec"><div class="mhead"><h2>Finding it</h2></div><div class="info">';
  html+='<div class="ic"><div class="ic-l">Where</div><div class="ic-v">'+esc([R.street,R.area,R.city,R.country].filter(Boolean).join(', ')||where)+'</div></div>';
  if(P.opens_at&&P.closes_at){
    var days=P.open_days&&P.open_days.length?P.open_days:DAYS;
    html+='<div class="ic"><div class="ic-l">Open</div><div class="ic-v">'+esc(pretty(P.opens_at))+' to '+esc(pretty(P.closes_at))
      +'</div><div class="days">'+DAYS.map(function(d){
        return '<span class="dy'+(days.indexOf(d)>-1?' on':'')+'">'+d.charAt(0).toUpperCase()+d.slice(1,3)+'</span>'; }).join('')+'</div></div>';
  }
  var wa=P.order_whatsapp||R.contact_whatsapp, ph=P.order_phone||R.contact_phone;
  if(wa||ph){
    html+='<div class="ic"><div class="ic-l">Ordering</div><div class="ic-v">'
      +(wa?'<a href="https://wa.me/'+esc(String(wa).replace(/\D/g,''))+'" target="_blank" rel="noopener">WhatsApp the kitchen</a><br/>':'')
      +(ph?'<a href="tel:'+esc(ph)+'">'+esc(ph)+'</a>':'')+'</div></div>';
  }
  html+='<div class="ic"><div class="ic-l">What you pay</div><div class="ic-v">The prices on this page are the kitchen\'s own. Cabana adds nothing and takes nothing.</div></div>';
  html+='</div></section>';

  if(R.held_for_name){
    html+='<div class="wrap"><div class="note" style="margin-top:26px">This page was published for '
      +esc(R.held_for_name)+' and is waiting for them to claim it. Everything on it is theirs the moment they sign in.</div></div>';
  }

  html+='<div class="pad"></div></div>';
  document.getElementById('app').innerHTML=html;
  wireScroll();
  initHero();
  initGallery();
  paintOrder();
}

/* ═══════ THE HERO SLIDESHOW ═══════
   Cross-faded, never slid. It pauses while the tab is in the
   background so a page left open all afternoon is not still
   quietly cycling photographs, and it steps aside entirely for
   anyone who has asked for less motion. ═══════════════════════ */
var _hero={i:0,t:null,frames:[],dots:[]};
function initHero(){
  clearInterval(_hero.t);
  var box=document.getElementById('heroImg');
  if(!box) return;
  _hero.frames=[].slice.call(box.querySelectorAll('.hero-fr'));
  _hero.dots=[].slice.call(document.querySelectorAll('.hero-dot'));
  _hero.i=0;
  if(_hero.frames.length<2) return;

  _hero.dots.forEach(function(d){
    d.addEventListener('click',function(){ goHero(Number(d.dataset.go),true); });
  });

  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce) runHero();

  /* a hidden tab is not being watched */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden) clearInterval(_hero.t);
    else if(!reduce) runHero();
  });
}
function runHero(){
  clearInterval(_hero.t);
  _hero.t=setInterval(function(){ goHero(_hero.i+1); },5200);
}
function goHero(n,manual){
  var f=_hero.frames; if(f.length<2) return;
  n=((n%f.length)+f.length)%f.length;
  f.forEach(function(el,i){ el.classList.toggle('on',i===n); });
  _hero.dots.forEach(function(d,i){ d.classList.toggle('on',i===n); });
  var c=document.getElementById('heroC');
  if(c) c.textContent=(n+1)+' / '+f.length;
  _hero.i=n;
  if(manual) runHero();     /* a tap restarts the clock rather than fighting it */
}
/* a photograph that will not load leaves the slideshow rather than
   sitting in it as a blank frame */
function dropFrame(img){
  var fr=img.closest('.hero-fr'); if(!fr) return;
  var was=fr.classList.contains('on');
  fr.remove();
  _hero.frames=[].slice.call(document.querySelectorAll('.hero-fr'));
  var dot=document.querySelector('.hero-dot:last-child');
  if(dot) dot.remove();
  _hero.dots=[].slice.call(document.querySelectorAll('.hero-dot'));
  if(!_hero.frames.length){
    var box=document.getElementById('heroImg');
    if(box) box.innerHTML='<div class="hero-none">🍽️</div>';
    clearInterval(_hero.t);
    return;
  }
  if(was) goHero(0);
  if(_hero.frames.length<2){
    clearInterval(_hero.t);
    var c=document.querySelector('.hero-count'), d=document.getElementById('heroDots');
    if(c) c.remove(); if(d) d.remove();
  }
}

/* ═══════ THE GALLERY ═══════ */
var _gal={t:null};
function initGallery(){
  clearInterval(_gal.t);
  var el=document.getElementById('gal');
  if(!el) return;

  function paint(){
    var max=el.scrollWidth-el.clientWidth;
    var p=max>0?el.scrollLeft/max:0;
    var bar=document.getElementById('galBar');
    if(bar) bar.style.width=Math.max(6,p*100)+'%';
    var n=el.children.length;
    var w=el.children[0]?el.children[0].getBoundingClientRect().width+10:1;
    var at=Math.min(n,Math.round(el.scrollLeft/w)+1);
    var c=document.getElementById('galC');
    if(c) c.textContent=at+' / '+n;
  }
  el.addEventListener('scroll',function(){
    clearTimeout(el._p); el._p=setTimeout(paint,60);
  },{passive:true});
  paint();

  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return;

  function run(){
    clearInterval(_gal.t);
    _gal.t=setInterval(function(){
      if(document.hidden) return;
      var max=el.scrollWidth-el.clientWidth;
      if(max<=0) return;
      /* at the end it walks back to the start rather than jumping */
      if(el.scrollLeft>=max-4) el.scrollTo({left:0,behavior:'smooth'});
      else galNudge(1);
    },4200);
  }
  ['pointerenter','touchstart','focusin'].forEach(function(ev){
    el.addEventListener(ev,function(){ clearInterval(_gal.t); },{passive:true});
  });
  ['pointerleave','touchend','focusout'].forEach(function(ev){
    el.addEventListener(ev,run,{passive:true});
  });
  run();
}
function galNudge(dir){
  var el=document.getElementById('gal'); if(!el) return;
  var w=el.children[0]?el.children[0].getBoundingClientRect().width+10:280;
  el.scrollBy({left:dir*w,behavior:'smooth'});
}

/* The card opens the dish; the button on it adds one straight to
   the order without opening anything. Two intentions, two targets,
   so nobody has to open a sheet to buy a second chapati. */
function itemCard(it){
  var deal=it.promo_price!=null;
  var badges=[];
  if(deal) badges.push(['b-deal','Offer']);
  if(it.badge&&BADGE[it.badge]) badges.push(BADGE[it.badge]);
  var q=ORDER[it.id]||0;
  /* The card is a plain container with a button laid over it, rather
     than a button with another button inside it. Tapping the card
     opens the dish; tapping the plus adds one and stops there. */
  return '<div class="it" id="dish-'+esc(it.id)+'">'
    +'<button class="it-hit" type="button" onclick="openDish('+js(it.id)+')" '
    +'aria-label="'+esc(it.name)+', '+esc(deal?money(it.promo_price):money(it.price))
    +'. See this dish"></button>'
    +'<span class="it-p">'
    +(it.photo?'<img src="'+esc(it.photo)+'" alt="'+esc(it.name)+'" loading="lazy" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'it-none\',textContent:\'🍲\'}))"/>'
              :'<span class="it-none">🍲</span>')
    +'</span><span class="it-b">'
    +(badges.length?'<span class="it-badges">'+badges.map(function(b){return '<span class="bg '+b[0]+'">'+b[1]+'</span>';}).join('')+'</span>':'')
    +'<span class="it-n">'+esc(it.name)+'</span>'
    +(it.description?'<span class="it-d">'+esc(it.description)+'</span>':'')
    +'<span class="it-f"><span class="it-pr">'
    +(deal?'<s>'+money(it.price)+'</s>'+money(it.promo_price):money(it.price))
    +'</span><span class="it-addwrap">'
    +'<button class="it-add" type="button" onclick="quickAdd(event,'+js(it.id)+')" '
    +'aria-label="Add one '+esc(it.name)+' to your order">'
    +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
    +'</button>'+(q?'<span class="it-qty">'+q+'</span>':'')+'</span></span></span></div>';
}
/* one more of this, right now, without leaving the menu */
function quickAdd(e,id){
  e.preventDefault(); e.stopPropagation();
  var it=ITEMS.filter(function(i){return String(i.id)===String(id);})[0];
  if(!it) return;
  window.CabanaCartUI.add(kitchenCard(),itemCardData(it),1);
}

/* ═══════ SECTION NAV ═══════ */
function jump(id){
  var el=document.getElementById('sec-'+id); if(!el)return;
  el.scrollIntoView({behavior:'smooth',block:'start'});
}
function wireScroll(){
  var top=document.getElementById('top');
  var secs=[].slice.call(document.querySelectorAll('.msec[id]'));
  var btns=[].slice.call(document.querySelectorAll('.sn'));
  function on(){
    top.classList.toggle('stuck',window.scrollY>160);
    if(!btns.length)return;
    /* offsetTop is measured against .wrap, not the document, so it put the
       highlight several sections ahead. Measure against the viewport. */
    var cur=secs[0];
    secs.forEach(function(s){ if(s.getBoundingClientRect().top<=180) cur=s; });
    btns.forEach(function(b){ b.classList.toggle('on','sec-'+b.dataset.sec===cur.id); });
  }
  window.addEventListener('scroll',on,{passive:true}); on();
}

/* ═══════ THE ORDER ═══════
   ORDER is a mirror of this kitchen's slice of the global basket,
   kept only so the existing rendering code can stay simple. The
   basket itself is the single source of truth. ═════════════════ */
var CART=window.CabanaCart;

/* everything the basket needs to describe this kitchen on a page
   that has never queried it */
function kitchenCard(){
  return {
    id:ID, name:R&&R.title, currency:CUR,
    wa:P.order_whatsapp||(R&&R.contact_whatsapp),
    ph:P.order_phone||(R&&R.contact_phone),
    photo:P.hero_photo||(R&&R.photos&&R.photos[0])||'',
    where:[R&&R.area,R&&R.city].filter(Boolean).join(', ')||(R&&R.location)||'',
    delivery_fee:P.delivery_fee, min_order:P.min_order,
    delivery_mins:P.delivery_mins, prep_mins:P.prep_mins,
    serves_delivery:P.serves_delivery, serves_pickup:P.serves_pickup,
    serves_dine_in:P.serves_dine_in,
    opens_at:P.opens_at, closes_at:P.closes_at, open_days:P.open_days
  };
}
function itemCardData(it){
  return { id:it.id, name:it.name, price:it.price, promo_price:it.promo_price,
           photo:it.photo, section:sectionName(it.section_id) };
}
function sectionName(sid){
  for(var i=0;i<SECS.length;i++){ if(String(SECS[i].id)===String(sid)) return SECS[i].name||''; }
  return '';
}

/* pull this kitchen's lines out of the basket into ORDER */
function restoreOrder(){
  ORDER={};
  var g=CART.group(ID);
  if(!g) return;
  g.items.forEach(function(i){ ORDER[i.id]=i.qty; });
  /* a line adopted from the old per-restaurant basket has no name
     or price on it. Now that the menu is loaded, repair it. */
  g.items.forEach(function(i){
    if(!i.thin) return;
    var it=ITEMS.filter(function(m){return String(m.id)===String(i.id);})[0];
    if(it) CART.add(kitchenCard(),itemCardData(it),0);
  });
}
function setQty(id,q){
  var it=ITEMS.filter(function(i){return String(i.id)===String(id);})[0];
  if(!it) return;
  if(q<=0){ CART.remove(ID,id); }
  else if(CART.qty(ID,id)){ CART.setQty(ID,id,q); }
  else { CART.add(kitchenCard(),itemCardData(it),q); }
  /* CART.onChange repaints the tray and the cards */
}
function repaintCard(id){
  var it=ITEMS.filter(function(i){return String(i.id)===String(id);})[0]; if(!it)return;
  var el=document.getElementById('dish-'+id); if(!el)return;
  var tmp=document.createElement('div'); tmp.innerHTML=itemCard(it);
  el.replaceWith(tmp.firstChild);
}
function totals(){
  var g=CART.group(ID);
  return g?{n:g.count,v:g.subtotal}:{n:0,v:0};
}
function paintOrder(){
  var t=totals(), tray=document.getElementById('tray');
  tray.classList.toggle('up',t.n>0);
  document.getElementById('trayN').textContent=t.n+(t.n===1?' item':' items');
  document.getElementById('trayV').textContent=money(t.v);

  /* food from other kitchens is never a surprise at the checkout */
  var all=CART.totals(), other=all.count-t.n, el=document.getElementById('trayElse');
  if(other>0){
    el.hidden=false;
    el.innerHTML='+ '+other+(other===1?' item':' items')+' from '+(all.kitchens-1)
      +(all.kitchens-1===1?' other kitchen':' other kitchens')
      +' · <a href="/checkout?from='+encodeURIComponent(ID)+'">see all</a>';
  } else el.hidden=true;
}
function emptyOrder(){
  if(!totals().n) return;
  CART.clearKitchen(ID);
  toast('Cleared what you had from this kitchen');
}

/* one subscription keeps the tray, the cards and the badge honest,
   including when another tab changes the order */
CART.onChange(function(){
  if(!ITEMS.length) return;
  var was=ORDER; ORDER={};
  var g=CART.group(ID);
  if(g) g.items.forEach(function(i){ ORDER[i.id]=i.qty; });
  paintOrder();
  /* repaint only the cards whose quantity actually moved */
  var seen={};
  Object.keys(ORDER).forEach(function(id){ if(was[id]!==ORDER[id]) seen[id]=1; });
  Object.keys(was).forEach(function(id){ if(ORDER[id]==null) seen[id]=1; });
  Object.keys(seen).forEach(repaintCard);
});

/* ═══════ SHEETS ═══════ */
function closeSheet(){ document.getElementById('ov').classList.remove('on'); document.body.style.overflow=''; }
function openSheet(html){
  document.getElementById('toast').classList.remove('up');  // it sat over the buttons
  document.getElementById('sh').innerHTML=html;
  document.getElementById('ov').classList.add('on');
  document.body.style.overflow='hidden';
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape')closeSheet(); });

var _dishId=null,_dishQ=1;
function openDish(id){
  var it=ITEMS.filter(function(i){return String(i.id)===String(id);})[0]; if(!it)return;
  _dishId=id; _dishQ=ORDER[id]||1;
  var deal=it.promo_price!=null;
  var badges=[]; if(deal)badges.push(['b-deal','Offer']);
  if(it.badge&&BADGE[it.badge])badges.push(BADGE[it.badge]);
  var meta=[];
  if(it.serves) meta.push(it.serves);
  if(it.prep_mins) meta.push(it.prep_mins+' min to cook');
  if(it.calories) meta.push(it.calories+' kcal');
  (it.tags||[]).forEach(function(t){ meta.push(t); });

  openSheet('<div class="sh-p">'
    +(it.photo?'<img src="'+esc(it.photo)+'" alt="'+esc(it.name)+'" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'sh-none\',textContent:\'🍲\'}))" loading="lazy" decoding="async"/>'
              :'<div class="sh-none">🍲</div>')
    +'<button class="sh-x" onclick="closeSheet()" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'
    +'<div class="sh-b">'
    +(badges.length?'<div class="sh-badges">'+badges.map(function(b){return '<span class="bg '+b[0]+'">'+b[1]+'</span>';}).join('')+'</div>':'')
    +'<div class="sh-n">'+esc(it.name)+'</div>'
    +(it.description?'<div class="sh-d">'+esc(it.description)+'</div>':'')
    +(meta.length?'<div class="sh-meta">'+meta.map(function(m){return '<span class="sh-m">'+esc(m)+'</span>';}).join('')+'</div>':'')
    +'<div class="sh-pr">'+(deal?'<s>'+money(it.price)+'</s>'+money(it.promo_price):money(it.price))+'</div>'
    +'<div class="step"><button onclick="bump(-1)" aria-label="One fewer">&minus;</button>'
    +'<span id="dq">'+_dishQ+'</span>'
    +'<button onclick="bump(1)" aria-label="One more">+</button></div>'
    +'<button class="sh-add" onclick="addDish()">Add to my order</button></div>');
}
function bump(d){ _dishQ=Math.max(1,Math.min(50,_dishQ+d)); document.getElementById('dq').textContent=_dishQ; }
function addDish(){
  var it=ITEMS.filter(function(i){return String(i.id)===String(_dishId);})[0];
  setQty(_dishId,_dishQ);
  closeSheet();
  if(it) window.CabanaCartUI.toast(itemCardData(it),_dishQ);
}

function openOrder(){
  var t=totals(); if(!t.n)return;
  var rows=Object.keys(ORDER).map(function(id){
    var it=ITEMS.filter(function(i){return String(i.id)===String(id);})[0]; if(!it)return '';
    return '<div class="ol"><span class="ol-n">'+esc(it.name)
      +'<small>'+money(priceOf(it))+' each</small></span>'
      +'<span class="ol-q"><button onclick="nudge('+js(id)+',-1)" aria-label="One fewer">&minus;</button>'
      +'<b>'+ORDER[id]+'</b>'
      +'<button onclick="nudge('+js(id)+',1)" aria-label="One more">+</button></span>'
      +'<span class="ol-p">'+money(priceOf(it)*ORDER[id])+'</span></div>';
  }).join('');

  var under = P.min_order && t.v < Number(P.min_order);
  var wa=P.order_whatsapp||R.contact_whatsapp, ph=P.order_phone||R.contact_phone;
  var open=cooking();
  var all=CART.totals(), other=all.count-t.n;

  openSheet('<div class="ord">'
    +'<h3>Your order</h3>'
    +'<p class="sub">From '+esc(R.title)+'. Send it to the kitchen and they will confirm the price and the time with you.</p>'
    +rows
    +'<div class="tot"><span class="tot-l">Food total</span><span class="tot-v">'+money(t.v)+'</span></div>'
    +(P.delivery_fee>0?'<div class="tot" style="padding-top:0"><span class="tot-l">Delivery, if you want it brought</span><span class="tot-l">'+money(P.delivery_fee)+'</span></div>':'')
    +'<div class="note">'
    +(open===false?'This kitchen is closed right now, so nobody may reply until it opens. '
      :open===true?'The kitchen is cooking right now. ':'')
    +(under?'Their minimum order is '+money(P.min_order)+', so add '+money(Number(P.min_order)-t.v)+' more before you send this. ':'')
    +'You pay the kitchen directly. Cabana takes no commission and adds nothing to these prices.</div>'
    /* ordering from more than one kitchen is normal, and the way
       through it is a checkout that knows about all of them */
    +(other>0
      ?'<div class="note" style="background:rgba(255,90,31,.08);border-color:var(--edge-2)">'
       +'You also have <b>'+other+(other===1?' item':' items')+'</b> from '
       +(all.kitchens-1)+(all.kitchens-1===1?' other kitchen':' other kitchens')
       +'. The checkout keeps them separate and gives each kitchen its own ticket.</div>'
      :'')
    +'<div class="ord-acts">'
    +(other>0
      ?'<a class="oa" style="background:var(--heat);color:#1A0A03" href="/checkout?from='+encodeURIComponent(ID)+'">'
       +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 7.8h14.8l-1.2 12.2a1.2 1.2 0 0 1-1.2 1H7a1.2 1.2 0 0 1-1.2-1Z"/><path d="M8.8 7.8V6a3.2 3.2 0 0 1 6.4 0v1.8"/></svg>'
       +'Go to checkout · all '+all.count+' items</a>'
      :'')
    +(wa?'<a class="oa oa-wa" href="'+waLink(wa,t)+'" target="_blank" rel="noopener" onclick="setTimeout(closeSheet,300)">'
      +'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.4.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5s-.7-1.6-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3M12 21.8h-.1c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.9 9.9 0 0 1 2.2 12C2.2 6.6 6.6 2.1 12 2.1c2.6 0 5.1 1 7 2.9a9.8 9.8 0 0 1 2.9 7c0 5.5-4.4 9.9-9.9 9.9m8.4-18.3A11.8 11.8 0 0 0 12 0C5.5 0 .2 5.3.2 11.9c0 2.1.5 4.1 1.6 5.9L0 24l6.3-1.7c1.8 1 3.7 1.4 5.7 1.4 6.6 0 11.9-5.3 11.9-11.9 0-3.2-1.2-6.2-3.5-8.4z"/></svg>'
      +'Send this to the kitchen on WhatsApp</a>':'')
    +(ph?'<a class="oa oa-call" href="tel:'+esc(ph)+'">'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1A19.5 19.5 0 0 1 4.7 12 19.8 19.8 0 0 1 1.6 3.4 2 2 0 0 1 3.6 1.2h3a2 2 0 0 1 2 1.7 12.8 12.8 0 0 0 .7 2.8 2 2 0 0 1-.5 2.1L7.9 8.4a16 16 0 0 0 7.7 7.7l1.7-.9a2 2 0 0 1 2.1.5 12.8 12.8 0 0 0 2.8.7 2 2 0 0 1 1.8 2"/></svg>'
      +'Call '+esc(ph)+'</a>':'')
    +(!wa&&!ph?'<div class="note">This kitchen has not left a number yet. Try again shortly.</div>':'')
    +(other>0?'':'<a class="oa oa-call" href="/checkout?from='+encodeURIComponent(ID)+'">'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 12h14.8M13 5.6 19.4 12 13 18.4"/></svg>'
      +'Checkout with your details</a>')
    +'<button class="oa oa-call" onclick="closeSheet()">Keep looking at the menu</button>'
    +'</div></div>');
}
function nudge(id,d){ setQty(id,(ORDER[id]||0)+d); if(totals().n) openOrder(); else closeSheet(); }

/* The ticket is built by the basket, so the message this kitchen
   gets is word for word the one the checkout would send it. */
function waLink(num,t){
  var link=CART.waLink(ID,{url:location.origin+'/restaurant?id='+ID});
  if(link) return link;
  /* the basket has no number for this kitchen but the page does */
  return 'https://wa.me/'+String(num).replace(/\D/g,'')+'?text='
    +encodeURIComponent(CART.ticket(ID,{url:location.origin+'/restaurant?id='+ID}));
}

function zoom(url){
  openSheet('<div class="sh-p" style="aspect-ratio:auto"><img src="'+esc(url)+'" alt="" style="max-height:80vh" loading="lazy" decoding="async"/>'
    +'<button class="sh-x" onclick="closeSheet()" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>');
}
function share(){
  var d={title:(R&&R.title)||'Cabana',text:R?('The menu at '+R.title):'',url:location.href};
  if(navigator.share) navigator.share(d).catch(function(){});
  else if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){toast('Link copied');});
}
