<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>APATMENTO Partner — My Listings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d1117;--sidebar:#111820;--card:#161e28;--card2:#1c2636;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.10);
  --text:#e8edf5;--text2:#8b93a6;--text3:#4a5568;
  --gold:#C8970A;--gold2:#E8A800;--goldbright:#FCC444;
  --emerald:#0D9467;--emerald2:#059652;
  --em-bg:rgba(13,148,103,0.10);--em-bd:rgba(13,148,103,0.25);
  --shadow:0 4px 24px rgba(0,0,0,0.3);
}
html,body{min-height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
.layout{display:flex;min-height:100vh;}

/* ── SIDEBAR ── */
.sidebar{
  width:240px;flex-shrink:0;background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:0;
  position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:50;
}
.sb-logo{
  padding:22px 20px 18px;
  font-family:'Playfair Display',serif;font-size:14px;font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  border-bottom:1px solid var(--border);
}
.sb-user{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.sb-avatar{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--emerald),var(--emerald2));
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;color:white;
}
.sb-name{font-size:13px;font-weight:600;color:var(--text);}
.sb-role{font-size:10px;font-weight:600;color:var(--emerald);letter-spacing:.06em;text-transform:uppercase;}
.sb-section{padding:14px 12px 4px;}
.sb-section-label{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);padding:0 8px;margin-bottom:4px;}
.sb-link{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
  font-size:13px;font-weight:500;color:var(--text2);text-decoration:none;cursor:pointer;
  transition:background .15s,color .15s;margin-bottom:1px;
}
.sb-link:hover{background:rgba(255,255,255,.04);color:var(--text);}
.sb-link.active{background:var(--em-bg);color:var(--emerald);border:1px solid var(--em-bd);font-weight:600;}
.sb-link svg{flex-shrink:0;opacity:.7;}
.sb-link.active svg{opacity:1;}
.sb-bottom{margin-top:auto;padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;}
.sb-btn{
  padding:8px 12px;border-radius:8px;border:1px solid var(--border2);background:transparent;
  font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--text2);
  cursor:pointer;text-align:left;transition:background .15s;
}
.sb-btn:hover{background:rgba(255,255,255,.04);}

/* ── MAIN ── */
.main{margin-left:240px;flex:1;min-height:100vh;}
.topbar{
  position:sticky;top:0;z-index:40;height:56px;
  background:rgba(13,17,23,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;
}
.topbar-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--text);}
.topbar-right{display:flex;align-items:center;gap:12px;}
.page-content{padding:28px;max-width:1200px;}

/* ── CARDS ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;
}
.stat-val{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:var(--text);margin-bottom:4px;}
.stat-lbl{font-size:12px;color:var(--text2);}
.stat-sub{font-size:11px;color:var(--emerald);font-weight:500;margin-top:6px;}
.stat-sub.neg{color:#f87171;}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.section-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--text);letter-spacing:.03em;}
.section-sub{font-size:12px;color:var(--text2);margin-top:2px;}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px;}
.card:hover{border-color:var(--border2);}

/* ── BUTTONS ── */
.btn{
  padding:9px 18px;border-radius:9px;border:none;cursor:pointer;
  font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;
  transition:filter .2s,transform .2s;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn-primary{background:linear-gradient(135deg,var(--emerald),var(--emerald2));color:white;}
.btn-gold{background:linear-gradient(135deg,var(--goldbright),var(--gold2));color:#0a1a0a;}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--text2);border:1px solid var(--border2);}
.btn-danger{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2);}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:7px;}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:100px;font-size:10px;font-weight:700;letter-spacing:.04em;}
.badge-green{background:var(--em-bg);color:var(--emerald);border:1px solid var(--em-bd);}
.badge-gold{background:rgba(252,196,68,.1);color:var(--goldbright);border:1px solid rgba(252,196,68,.2);}
.badge-red{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.2);}
.badge-grey{background:rgba(255,255,255,.06);color:var(--text2);border:1px solid var(--border2);}

/* ── TABLES ── */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);}
td{padding:13px 14px;font-size:13px;color:var(--text);border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:56px 24px;}
.empty-ico{font-size:40px;margin-bottom:14px;opacity:.4;}
.empty-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:var(--text2);margin-bottom:6px;}
.empty-sub{font-size:13px;color:var(--text3);}

/* ── FORM ── */
.form-group{margin-bottom:16px;}
.form-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:6px;display:block;}
.form-input,.form-select,.form-textarea{
  width:100%;padding:11px 14px;border-radius:9px;border:1px solid var(--border2);
  background:rgba(255,255,255,.04);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;
  outline:none;transition:border-color .2s;-webkit-appearance:none;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--emerald);}
.form-textarea{resize:vertical;min-height:80px;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--card2);color:var(--text);padding:11px 20px;border-radius:10px;
  font-size:13px;box-shadow:var(--shadow);border:1px solid var(--border2);
  z-index:999;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;
}
.toast.show{opacity:1;}

/* MOBILE */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);transition:transform .3s;}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .page-content{padding:16px;}
  .stat-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>

<div class="section-header">

  </div>

<!-- Filter chips -->
<div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;">
  <button class="btn btn-ghost btn-sm active-filter" onclick="filterListings('all',this)">All</button>

<div id="listings-container">

<!-- Edit Modal -->
<div id="edit-modal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:20px;">
  <div style="background:var(--card2);border:1px solid var(--border2);border-radius:16px;padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <div class="section-title">Edit Listing</div>
      <button onclick="closeEditModal()" style="background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Listing Name</label>
      <input class="form-input" id="edit-name" type="text"/>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="form-group">
        <label class="form-label">Price per night (KES)</label>
        <input class="form-input" id="edit-price" type="number"/>
      </div>
      <div class="form-group">
        <label class="form-label">Max Guests</label>
        <input class="form-input" id="edit-guests" type="number" min="1" max="20"/>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-textarea" id="edit-desc"></textarea>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-ghost" onclick="closeEditModal()">Cancel</button>
      <button class="btn btn-primary" style="flex:1;" onclick="saveEditListing()">Save Changes</button>
    </div>
  </div>
</div>

<script>
let allListings = [];
let editingId = null;
let activeFilter = 'all';

async function onPageReady() {
  await loadListings();
}

async function loadListings() {
  const { data, error } = await sb.from('listings')
    .select('*')
    .eq('partner_id', CURRENT_USER.id)
    .order('created_at', { ascending: false });

  if (error) { showToast('Error loading listings: ' + error.message); return; }
  allListings = data || [];
  renderListings();
}

function renderListings() {
  const container = document.getElementById('listings-container');
  let filtered = activeFilter === 'all' ? allListings
    : allListings.filter(l => activeFilter === 'active' ? l.is_active : !l.is_active);

  if (!filtered.length) {
    container.innerHTML = `<div class="empty">
      <div class="empty-ico">🏠</div>
      <div class="empty-title">${activeFilter === 'all' ? 'No listings yet' : 'No ' + activeFilter + ' listings'}</div>
      <div class="empty-sub">${activeFilter === 'all' ? 'Add your first property to start earning' : 'Toggle status on your listings below'}</div>
      ${activeFilter === 'all' ? '<button class="btn btn-primary" style="margin-top:16px;" onclick="window.location.href=\'add-listing.html\'">+ Add Your First Listing</button>' : ''}
    </div>`;
    return;
  }

  container.innerHTML = filtered.map(l => `
    <div class="card" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
      <div style="width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#0a1628,#1a4060);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;">🏠</div>
      <div style="flex:1;min-width:160px;">
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--text);margin-bottom:4px;">${l.title || l.name || 'Unnamed Listing'}</div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:8px;">${l.location || '—'} · ${l.bedrooms || 0} bed · ${l.property_type || 'Apartment'}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <span class="badge ${l.is_active ? 'badge-green' : 'badge-grey'}">${l.is_active ? 'Active' : 'Inactive'}</span>
          <span style="font-size:12px;color:var(--text2);">KES ${Number(l.price_per_night || 0).toLocaleString()}/night</span>
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div style="font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--goldbright);margin-bottom:4px;">KES ${Number(l.price_per_night || 0).toLocaleString()}</div>
        <div style="font-size:11px;color:var(--text2);margin-bottom:10px;">per night</div>
        <div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" onclick="openEditModal('${l.id}')">Edit</button>
          <button class="btn btn-sm ${l.is_active ? 'btn-danger' : 'btn-primary'}" onclick="toggleActive('${l.id}',${l.is_active})">${l.is_active ? 'Deactivate' : 'Activate'}</button>
          <button class="btn btn-danger btn-sm" onclick="deleteListing('${l.id}')">Delete</button>
        </div>
      </div>
    </div>
  `).join('');
}

function filterListings(filter, el) {
  activeFilter = filter;
  document.querySelectorAll('.active-filter').forEach(b => b.classList.remove('active-filter'));
  el.classList.add('active-filter');
  renderListings();
}

function openEditModal(id) {
  const l = allListings.find(x => x.id === id);
  if (!l) return;
  editingId = id;
  document.getElementById('edit-name').value = l.title || l.name || '';
  document.getElementById('edit-price').value = l.price_per_night || '';
  document.getElementById('edit-guests').value = l.max_guests || '';
  document.getElementById('edit-desc').value = l.description || '';
  document.getElementById('edit-modal').style.display = 'flex';
}

function closeEditModal() {
  document.getElementById('edit-modal').style.display = 'none';
  editingId = null;
}

async function saveEditListing() {
  if (!editingId) return;
  const updates = {
    title: document.getElementById('edit-name').value,
    price_per_night: parseFloat(document.getElementById('edit-price').value),
    max_guests: parseInt(document.getElementById('edit-guests').value),
    description: document.getElementById('edit-desc').value,
  };
  const { error } = await sb.from('listings').update(updates).eq('id', editingId);
  if (error) { showToast('Error: ' + error.message); return; }
  showToast('✅ Listing updated');
  closeEditModal();
  await loadListings();
}

async function toggleActive(id, current) {
  const { error } = await sb.from('listings').update({ is_active: !current }).eq('id', id);
  if (error) { showToast('Error: ' + error.message); return; }
  showToast(current ? '⏸ Listing deactivated' : '✅ Listing activated');
  await loadListings();
}

async function deleteListing(id) {
  if (!confirm('Delete this listing? This cannot be undone.')) return;
  const { error } = await sb.from('listings').delete().eq('id', id);
  if (error) { showToast('Error: ' + error.message); return; }
  showToast('🗑️ Listing deleted');
  await loadListings();
}
</script>
