<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --glass:#FCFCFD;--glass-2:#F4F5FB;--glass-3:#EBEDF7;
  --ink:#0A0A14;--ink-soft:#4A4C66;--ink-faint:#8E90AD;
  --lilac:#B8A4F4;--lilac-deep:#8B6FE8;--mint:#5EEAD4;--mint-deep:#2DD4BF;
  --peach:#FFB59E;--electric:#4361FF;--violet:#7B2FF7;--ember:#FF6B2C;
  --line:rgba(10,10,20,0.07);--line-2:rgba(10,10,20,0.13);
  --theme:var(--lilac-deep);--theme-grad:linear-gradient(135deg,#B8A4F4,#7B2FF7);
  --font-display:'Geist','Inter',sans-serif;--font-body:'Inter',system-ui,sans-serif;
  --font-data:'Geist',monospace;
  --shadow-glass:0 8px 32px rgba(123,47,247,0.07);
  --shadow-lift:0 24px 64px rgba(123,47,247,0.14);
  --radius:20px;--ok:#2DD4BF;--err:#FF4D6D;
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
html,body{min-height:100%;font-family:var(--font-body);background:var(--glass-2);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;}

/* aurora */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.ab{position:absolute;border-radius:50%;filter:blur(90px);opacity:.32;mix-blend-mode:multiply;animation:drift 28s ease-in-out infinite;}
.ab-1{width:520px;height:520px;background:radial-gradient(circle,var(--lilac),transparent 70%);top:-12%;left:-8%;}
.ab-2{width:420px;height:420px;background:radial-gradient(circle,var(--mint),transparent 72%);bottom:-10%;right:-6%;animation-delay:-11s;opacity:.22;}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(36px,-26px) scale(1.08);}}

/* topbar */
.topbar{position:sticky;top:0;z-index:100;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(252,252,253,.76);backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid var(--line);}
.tb-left{display:flex;align-items:center;gap:12px;}
.tb-back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);transition:all .22s;text-decoration:none;}
.tb-back:hover{border-color:var(--theme);color:var(--theme);transform:translateX(-2px);}
.tb-logo{height:32px;}
.tb-brand{font-family:var(--font-display);font-weight:500;font-size:18px;}
.tb-brand em{font-style:italic;background:var(--theme-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}

/* page */
.page{position:relative;z-index:2;max-width:780px;margin:0 auto;padding:32px 22px 80px;}
.page-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--theme);margin-bottom:12px;padding:5px 13px;border-radius:100px;background:rgba(139,111,232,.09);border:1px solid rgba(139,111,232,.18);}
.page-title{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,3.6vw,34px);letter-spacing:-.02em;margin-bottom:6px;}
.page-title em{font-style:italic;font-weight:500;background:var(--theme-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.page-sub{font-size:14px;color:var(--ink-soft);margin-bottom:28px;}

/* tabs */
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.6);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:5px;margin-bottom:24px;}
.tab{flex:1;padding:10px;border:none;background:transparent;border-radius:11px;font-family:var(--font-body);font-weight:600;font-size:13px;color:var(--ink-faint);cursor:pointer;transition:all .25s;}
.tab.active{background:var(--glass);color:var(--ink);box-shadow:0 2px 8px rgba(10,10,20,.06);}

/* booking card */
.booking-card{background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;transition:box-shadow .3s;animation:cardIn .5s cubic-bezier(.22,1,.36,1) both;}
.booking-card:hover{box-shadow:var(--shadow-lift);}
@keyframes cardIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

/* card header strip */
.bk-header{padding:18px 20px;display:flex;align-items:center;gap:14px;}
.bk-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;}
.bk-icon.stays{background:linear-gradient(135deg,#B8A4F4,#7B2FF7);}
.bk-icon.tours{background:linear-gradient(135deg,#2DD4BF,#5EEAD4);}
.bk-icon.events{background:linear-gradient(135deg,#7B2FF7,#B8A4F4);}
.bk-icon svg{width:24px;height:24px;}
.bk-info{flex:1;min-width:0;}
.bk-name{font-family:var(--font-display);font-weight:500;font-size:17px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bk-meta{font-size:12px;color:var(--ink-faint);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.bk-meta svg{width:11px;height:11px;}
.bk-status{flex-shrink:0;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:5px 12px;border-radius:100px;}
.badge-pending{background:rgba(255,181,158,.15);color:var(--ember);}
.badge-checkedin{background:rgba(45,212,191,.1);color:var(--ok);}
.badge-failed{background:rgba(255,77,109,.1);color:var(--err);}
.badge-awaiting{background:var(--glass-3);color:var(--ink-faint);}

/* card body */
.bk-body{padding:0 20px 20px;}
.bk-divider{height:1px;background:var(--line);margin-bottom:16px;}
.bk-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;}
.bk-row .lbl{color:var(--ink-faint);}
.bk-row .val{color:var(--ink);font-weight:500;text-align:right;}

/* check-in section */
.ci-section{background:rgba(139,111,232,.05);border:1px solid rgba(139,111,232,.18);border-radius:16px;padding:18px;margin-top:4px;}
.ci-title{font-family:var(--font-display);font-weight:500;font-size:15px;margin-bottom:4px;}
.ci-sub{font-size:12px;color:var(--ink-soft);margin-bottom:14px;line-height:1.5;}

/* guest code display */
.ci-your-code{background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.2);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
.ci-code-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mint-deep);margin-bottom:6px;}
.ci-code-val{font-family:var(--font-data);font-size:26px;font-weight:700;color:var(--ink);letter-spacing:.12em;}
.ci-code-hint{font-size:11px;color:var(--ink-faint);margin-top:4px;}

/* host code entry */
.ci-enter{display:flex;gap:8px;align-items:stretch;}
.ci-input{flex:1;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--glass);font-family:var(--font-data);font-size:15px;font-weight:600;color:var(--ink);outline:none;letter-spacing:.1em;text-transform:uppercase;transition:border-color .22s;}
.ci-input:focus{border-color:var(--theme);box-shadow:0 0 0 3px rgba(139,111,232,.1);}
.ci-input::placeholder{font-size:13px;font-weight:400;letter-spacing:.04em;text-transform:none;color:var(--ink-faint);}
.ci-submit{padding:12px 18px;border-radius:12px;border:none;background:var(--theme-grad);color:#fff;font-family:var(--font-body);font-weight:600;font-size:13px;cursor:pointer;transition:all .25s;white-space:nowrap;}
.ci-submit:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(123,47,247,.3);}
.ci-submit.loading{opacity:.7;pointer-events:none;}

/* success check-in */
.ci-confirmed{background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.2);border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px;}
.ci-confirmed svg{width:28px;height:28px;color:var(--ok);flex-shrink:0;}
.ci-confirmed-title{font-weight:600;font-size:14px;color:var(--ink);}
.ci-confirmed-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}

/* empty state */
.empty{text-align:center;padding:60px 20px;}
.empty svg{width:56px;height:56px;color:var(--ink-faint);opacity:.3;margin:0 auto 18px;display:block;}
.empty-title{font-family:var(--font-display);font-size:20px;margin-bottom:8px;}
.empty-sub{font-size:13px;color:var(--ink-soft);margin-bottom:22px;line-height:1.6;}
.btn-primary{display:inline-flex;align-items:center;gap:7px;padding:12px 22px;border-radius:12px;border:none;background:var(--theme-grad);color:#fff;font-family:var(--font-body);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;transition:all .25s;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(123,47,247,.3);}

/* loading skeleton */
.skeleton{background:linear-gradient(90deg,var(--glass-2) 25%,var(--glass-3) 50%,var(--glass-2) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:10px;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(16px);z-index:9999;padding:13px 22px;border-radius:100px;background:var(--ink);color:#fff;font-size:13px;font-weight:500;box-shadow:var(--shadow-lift);opacity:0;transition:all .35s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:600px){.page{padding:20px 14px 70px;}.ci-enter{flex-direction:column;}.ci-submit{width:100%;}}
</style>

    <button class="tab active" id="tab-all"    onclick="setTab('all',this)">All</button>

<script>
let sb=null;
try{const{createClient}=supabase;sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);}catch(e){}

let CURRENT_USER = null;
let allBookings  = [];
let currentTab   = 'all';

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'auth.html'; return; }
  CURRENT_USER = session.user;
  await loadAllBookings();
})();

let PENDING_OFFERS = {};   // booking_id → offer
let REVIEWED = new Set();  // booking_ids this user has already reviewed

async function loadAllBookings() {
  const uid = CURRENT_USER.id;
  await loadTrustState(uid);
  const [aptRes, tourRes, evRes] = await Promise.all([
    sb.from('apartment_bookings').select('*').eq('guest_id', uid).order('created_at',{ascending:false}),
    sb.from('tour_bookings').select('*').eq('guest_id', uid).order('created_at',{ascending:false}),
    sb.from('event_tickets').select('*').eq('guest_id', uid).order('created_at',{ascending:false}),
  ]);

  const apts  = (aptRes.data||[]).map(b=>({...b,_type:'apartment',_table:'apartment_bookings',_name:b.apartment_name,_detail:`${b.checkin_date} → ${b.checkout_date} · ${b.nights} night${b.nights!==1?'s':''}`,_icon:'🏠',_iconBg:'linear-gradient(135deg,#0a1628,#1a3a5a)'}));
  const tours = (tourRes.data||[]).map(b=>({...b,_type:'tour',_table:'tour_bookings',_name:b.tour_name,_detail:`${b.tour_date} · ${b.num_people} person${b.num_people!==1?'s':''}`,_icon:'🗺️',_iconBg:'linear-gradient(135deg,#1a1206,#3d2810)'}));
  const evs   = (evRes.data||[]).map(b=>({...b,_type:'event',_table:'event_tickets',_name:b.event_name,_detail:`${b.tier_name} · ${b.quantity} ticket${b.quantity!==1?'s':''}`,_icon:'🎟️',_iconBg:'linear-gradient(135deg,#0d0618,#241040)'}));

  allBookings = [...apts,...tours,...evs].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  renderBookings();
}

function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderBookings();
}

function renderBookings() {
  const now = new Date();
  let list = allBookings;
  if (currentTab === 'pending_checkin') list = allBookings.filter(b=>b.status==='paid_pending_checkin');
  else if (currentTab === 'checked_in')  list = allBookings.filter(b=>b.status==='checked_in');
  else if (currentTab === 'past') list = allBookings.filter(b=>{
    if (!['checked_in','paid_pending_checkin'].includes(b.status)) return false;
    const endDate = b.checkout_date || b.tour_date;
    return endDate && new Date(endDate) < now;
  });

  const container = document.getElementById('bookings-container');
  if (!list.length) {
    container.innerHTML = `<div class="empty">
      <div class="empty-ico">${currentTab==='pending_checkin'?'⏳':currentTab==='checked_in'?'✅':'📋'}</div>
      <div class="empty-title">${currentTab==='all'?'No bookings yet':'No bookings here'}</div>
      <div class="empty-sub">${currentTab==='all'?'When you book apartments, tours or events they\'ll all appear here.':'Check a different tab to find your bookings.'}</div>
    </div>`;
    return;
  }
  container.innerHTML = list.map(b => buildBookingCard(b)).join('');
}

/* ── Partner contact — revealed only after payment ───────────────── */
function buildPartnerContact(b) {
  // Only show for paid / checked-in bookings
  const paidStatuses = ['paid_pending_checkin','deposit_paid','checked_in','completed'];
  if (!paidStatuses.includes(b.status)) return '';

  const wa    = b.contact_whatsapp || b.host_whatsapp || '';
  const phone = b.contact_phone    || b.host_phone    || wa;
  const email = b.contact_email    || b.host_email    || '';

  // Nothing to show
  if (!wa && !phone && !email) return `

       style="display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:100px;background:rgba(8,8,15,.06);color:var(--ink);border:1px solid var(--line);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;">

function buildBookingCard(b) {
  const statusBadge = {
    paid_pending_checkin: '<span class="badge badge-pending">Pending check-in</span>',
    checked_in:           '<span class="badge badge-checkedin">✓ Checked in</span>',
    failed:               '<span class="badge badge-failed">Payment failed</span>',
    pending_payment:      '<span class="badge badge-awaiting">Awaiting payment</span>',
  }[b.status] || `<span class="badge badge-awaiting">${b.status}</span>`;

  const typeIcon = {
    apartment: `<div class="bk-icon stays"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5M5 9.5V20h14V9.5M9 20v-5a3 3 0 0 1 6 0v5"/></svg></div>`,
    tour:      `<div class="bk-icon tours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5.5-6-2-6 2.5v13l6-2.5 6 2 6-2.5v-13zM9 3.5v13M15 7.5v13"/></svg></div>`,
    event:     `<div class="bk-icon events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a2 2 0 0 0 0 6v2a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-2a2 2 0 0 0 0-6V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"/><path d="M14 6v12" stroke-dasharray="2 2.5"/></svg></div>`,
  }[b._type] || `<div class="bk-icon stays"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10.5 12 4l9 6.5M5 9.5V20h14V9.5"/></svg></div>`;

  /* ── Check-in panel ────────────────────────────────────────────
     Three states, in strict order of precedence:
       1. A match offer is waiting        → nothing else matters
       2. A balance is outstanding        → the code is inert
       3. Settled                         → exchange codes
     Below all of them, always, sits the escape hatch.            */
  let ciSection = '';
  const gate = (b._type === 'apartment' && window.ApaTrust)
    ? ApaTrust.deposit.canCheckIn(b) : { ok: true };

  if (b._type === 'apartment' && PENDING_OFFERS[b.id]) {
    ciSection = buildMatchPanel(b, PENDING_OFFERS[b.id]);

  } else if (!gate.ok && gate.reason === 'balance_due') {
    ciSection = `
    <div class="bal-gate">
      <div class="bal-gate-t">🔒 Balance outstanding</div>
      <div class="bal-gate-s">You secured this stay with a deposit. Settle the remainder to unlock check-in — your host's code won't work until you do.</div>
      <div class="bal-gate-row"><span>Deposit paid</span><b>KES ${Number(b.deposit_amount||0).toLocaleString()}</b></div>
      <div class="bal-gate-row"><span>Balance due</span><b>KES ${Number(b.balance_amount||0).toLocaleString()}</b></div>
      <button class="bal-gate-btn" onclick="payBalance('${b.id}')">Pay KES ${Number(b.balance_amount||0).toLocaleString()} now</button>
    </div>
    <div class="ci-section ci-locked">
      <div class="ci-title">Check-in codes</div>
      <div class="ci-sub">Unlocks once the balance is settled.</div>
      <div class="ci-your-code">
        <div class="ci-code-label">Your code — show to host</div>
        <div class="ci-code-val">${b.guest_code || '••••••'}</div>
      </div>
    </div>`;

  } else if (['paid_pending_checkin','deposit_paid'].includes(b.status) && b.guest_code) {
    ciSection = `
    <div class="ci-section">
      <div class="ci-title">Check-in codes</div>
      <div class="ci-sub">At check-in: show your code to the host, then enter theirs below. Once both codes are exchanged your stay is confirmed.</div>

      <div class="ci-your-code">
        <div class="ci-code-label">Your code — show to host</div>
        <div class="ci-code-val">${b.guest_code}</div>
        <div class="ci-code-hint">Share this code with your host when you arrive</div>
      </div>

      <div style="font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;">Enter host's code</div>
      <div class="ci-enter">
        <input class="ci-input" id="host-code-${b.id}" placeholder="HOST-XXXXXX" maxlength="12"/>
        <button class="ci-submit" onclick="verifyHostCode('${b._table}','${b.payment_reference}','${b.id}')">Confirm check-in</button>
      </div>
    </div>`;

  } else if (b.status === 'checked_in') {
    ciSection = `
    <div class="ci-confirmed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <div>
        <div class="ci-confirmed-title">Check-in confirmed</div>
        <div class="ci-confirmed-sub">Stay completed · Payout released to host${b.checked_in_at ? ' on ' + new Date(b.checked_in_at).toLocaleDateString('en-GB') : ''}</div>
      </div>
    </div>`;
  }

  /* The escape hatch. Available from booking to checkout — the wording
     and the consequences change with the clock, not the button.      */
  if (b._type === 'apartment' && !b.cancelled_at &&
      ['paid_pending_checkin','deposit_paid','checked_in'].includes(b.status)) {
    const h = ApaTrust ? ApaTrust.hoursTo(b.checkin_date) : null;
    const label = h == null ? "Report a problem"
      : h >= 24 ? "Cancel this stay"
      : h >= 2  ? "Can't stay here?"
      : "Can't stay here — there's an issue";
    ciSection += `<button class="issue-btn" onclick="openIssue('${b.id}')">${label}</button>`;
  }

  /* Review prompt: once checked in, and only until they've written one. */
  if (b._type === 'apartment' && b.status === 'checked_in' && !REVIEWED.has(b.id)) {
    ciSection += buildReviewPanel(b);
  }

  const nights = b.nights ? `${b.nights} night${b.nights!==1?'s':''}` : '';
  const dateStr = b.checkin_date ? `${b.checkin_date}${b.checkout_date?' → '+b.checkout_date:''}` : '';

  return `
  <div class="booking-card" id="card-${b.id}">
    <div class="bk-header">
      ${typeIcon}
      <div class="bk-info">
        <div class="bk-name">${b.listing_name || b.event_name || b.tour_name || 'Booking'}</div>
        <div class="bk-meta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          ${b.location || b.venue || ''}
          ${dateStr ? `<span>· ${dateStr}</span>` : ''}
          ${nights ? `<span>· ${nights}</span>` : ''}
        </div>
      </div>
      <div class="bk-status">${statusBadge}</div>
    </div>
    <div class="bk-body">
      <div class="bk-divider"></div>
      <div class="bk-row"><span class="lbl">Reference</span><span class="val" style="font-family:var(--font-data);font-size:12px;">${b.payment_reference || '—'}</span></div>
      <div class="bk-row"><span class="lbl">Amount paid</span><span class="val">KES ${Number(b.grand_total||0).toLocaleString()}</span></div>
      <div class="bk-row"><span class="lbl">Guests</span><span class="val">${b.num_guests || b.tickets || 1}</span></div>
      ${buildPartnerContact(b)}
      ${ciSection}
    </div>
  </div>`;
}




/* ═══════════════════════════════════════════════════════════════
   TRUST STATE
   Two extra reads, both cheap, both cached for the render pass.
   RLS means an offer we can see is an offer meant for us.
   ═══════════════════════════════════════════════════════════════ */
async function loadTrustState(uid) {
  PENDING_OFFERS = {}; REVIEWED = new Set();
  try {
    const [offers, reviews] = await Promise.all([
      sb.from('match_offers').select('*')
        .eq('guest_id', uid).eq('status','offered')
        .gt('expires_at', new Date().toISOString()),
      sb.from('private_reviews').select('booking_id').eq('author_id', uid),
    ]);
    (offers.data || []).forEach(o => { PENDING_OFFERS[o.booking_id] = o; });
    (reviews.data || []).forEach(r => REVIEWED.add(r.booking_id));
  } catch (e) { console.warn('[trust state]', e.message); }
}

/* ═══════════════════════════════════════════════════════════════
   MATCH OFFER PANEL
   The host couldn't host. We don't ask the guest to hunt for a
   replacement — we hand them a ranked shortlist and a refund button
   of equal weight. Declining costs them nothing.
   ═══════════════════════════════════════════════════════════════ */
function buildMatchPanel(b, offer) {
  const cands = offer.candidates || [];
  return `
  <div class="match-card" id="match-${b.id}">
    <div class="match-t">Your host can't host — we found ${cands.length} alternative${cands.length===1?'':'s'}</div>
    <div class="match-s">Same dates, same price to you. We've ranked these by how closely they match what you booked. Choose one, or take a full refund — no penalty either way.</div>
    ${cands.map(c => `
      <div class="match-opt" data-listing="${c.listing_id}" onclick="pickMatch('${b.id}','${c.listing_id}')">
        <img class="match-thumb" src="${(Array.isArray(c.photos)?c.photos[0]:'')||'/cabana-emblem.png'}" alt=""/>
        <div class="match-info">
          <div class="match-name">${c.title || 'Listing'}</div>
          <div class="match-meta">${c.location||''}${c.distance_km!=null?` · ${c.distance_km} km away`:''} · ${c.beds||'?'} bed${c.beds===1?'':'s'} · KES ${Number(c.price_night||0).toLocaleString()}/night</div>
        </div>
        <span class="match-score">${Math.round(c.score||0)}%</span>
      </div>`).join('')}
    <div class="match-acts">
      <button class="match-decline" onclick="declineMatch('${offer.id}')">Refund me instead</button>
      <button class="match-accept" id="accept-${b.id}" disabled onclick="acceptMatch('${offer.id}','${b.id}')">Accept</button>
    </div>
  </div>`;
}

let MATCH_PICK = {};
function pickMatch(bookingId, listingId) {
  MATCH_PICK[bookingId] = listingId;
  document.querySelectorAll(`#match-${bookingId} .match-opt`).forEach(el => {
    el.classList.toggle('on', el.dataset.listing === listingId);
  });
  document.getElementById(`accept-${bookingId}`).disabled = false;
}

async function acceptMatch(offerId, bookingId) {
  const listingId = MATCH_PICK[bookingId];
  if (!listingId) return showToast('Pick a stay first');
  const btn = document.getElementById(`accept-${bookingId}`);
  btn.disabled = true; btn.textContent = 'Moving you…';
  try {
    const r = await ApaTrust.match.accept(offerId, listingId);
    showToast(r.refund_due
      ? `You're moved. KES ${Number(r.refund_due).toLocaleString()} is coming back to you.`
      : "You're moved. Same dates, same price.");
    await loadAllBookings();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Accept';
    showToast(e.message === 'listing_unavailable'
      ? 'That one just got booked. Pick another.' : 'Something went wrong. Try again.');
  }
}

async function declineMatch(offerId) {
  try {
    const r = await ApaTrust.match.decline(offerId);
    showToast(`Refunded KES ${Number(r.refund_amount).toLocaleString()} in full.`);
    await loadAllBookings();
  } catch (e) { showToast('Could not process the refund. We\'ve flagged it.'); }
}

/* ═══════════════════════════════════════════════════════════════
   ISSUE
   ═══════════════════════════════════════════════════════════════ */
async function openIssue(bookingId) {
  const b = allBookings.find(x => x.id === bookingId);
  if (!b) return;
  await ApaTrust.issue.open(b, async (result) => {
    if (result.redirect && result.refuge) {
      setTimeout(() => showToast(`Moved to ${result.refuge.title}. Your ride is booked.`), 900);
    }
    await loadAllBookings();
  });
}

/* ═══════════════════════════════════════════════════════════════
   BALANCE
   ═══════════════════════════════════════════════════════════════ */
function payBalance(bookingId) {
  const b = allBookings.find(x => x.id === bookingId);
  if (!b) return;
  ApaTrust.deposit.payBalance(b, () => loadAllBookings());
}

/* ═══════════════════════════════════════════════════════════════
   PRIVATE REVIEW
   Never published. The host sees it only once they've written
   theirs — so neither is writing a reply. It still moves the
   listing up or down.
   ═══════════════════════════════════════════════════════════════ */
function buildReviewPanel(b) {
  return `
  <div class="rev-prompt" id="rev-${b.id}">
    <div class="rev-t">How was ${b.apartment_name || 'your stay'}?</div>
    <div class="rev-s">This stays between you, your host and us. It is never shown publicly — but it does decide where this listing ranks.</div>
    <div class="rev-stars" id="stars-${b.id}">
      ${[1,2,3,4,5].map(n => `<span class="rev-star" data-n="${n}" onclick="setStars('${b.id}',${n})">★</span>`).join('')}
    </div>
    <textarea class="rev-body" id="revbody-${b.id}" rows="3" placeholder="What should the next guest know? What should the host know?"></textarea>
    <button class="rev-send" id="revsend-${b.id}" disabled onclick="sendReview('${b.id}')">Submit privately</button>
    <div class="rev-priv">🔒 Private · only revealed to each other once you have both submitted your reviews</div>
  </div>`;
}

let REV_RATING = {};
function setStars(id, n) {
  REV_RATING[id] = n;
  document.querySelectorAll(`#stars-${id} .rev-star`).forEach(s => {
    s.classList.toggle('on', Number(s.dataset.n) <= n);
  });
  document.getElementById(`revsend-${id}`).disabled = false;
}

async function sendReview(bookingId) {
  const b = allBookings.find(x => x.id === bookingId);
  const btn = document.getElementById(`revsend-${bookingId}`);
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    await ApaTrust.review.submit(b, 'guest_to_host', {
      rating: REV_RATING[bookingId],
      body: document.getElementById(`revbody-${bookingId}`).value.trim(),
    });
    document.getElementById(`rev-${bookingId}`).innerHTML =
      '<div class="rev-t">Thank you</div><div class="rev-s">Your host will see it once they\'ve written theirs.</div>';
    REVIEWED.add(bookingId);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Submit privately';
    showToast('Could not send. Try again.');
  }
}

/* Every write to the server carries the caller's token. The body
   is a claim; the header is the identity. */
async function authFetch(url, body) {
  const { data } = await sb.auth.getSession();
  return fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: 'Bearer ' + (data.session?.access_token || ''),
    },
    body: JSON.stringify(body),
  });
}

async function verifyHostCode(table, reference, bookingId) {
  const input = document.getElementById(`host-code-${bookingId}`);
  const btn   = document.querySelector(`#card-${bookingId} .ci-submit`);
  const code  = input?.value?.trim().toUpperCase();

  if (!code || !code.startsWith('HOST')) {
    showToast('Enter the HOST-XXXXXX code your host gives you'); return;
  }
  if (btn) { btn.classList.add('loading'); btn.textContent = 'Verifying…'; }

  try {
    const res  = await authFetch('/api/verify-checkin', { table, reference, role:'guest', code });
    const data = await res.json();
    if (btn) { btn.classList.remove('loading'); btn.textContent = 'Confirm check-in'; }

    /* 402 — the code was right. The money wasn't. Say so plainly;
       a guest at a door does not need to guess why nothing happened. */
    if (res.status === 402 && data.error === 'balance_due') {
      showToast(`Correct code — but KES ${Number(data.balance_amount).toLocaleString()} is still outstanding.`, 5000);
      await loadAllBookings();
      setTimeout(() => payBalance(bookingId), 700);
      return;
    }

    if (res.status === 401 && data.error === 'code_mismatch') {
      showToast('That code doesn\'t match. Check with your host.', 4000); return;
    }
    if (!res.ok) {
      showToast('❌ ' + (data.message || data.error || 'Could not verify — try again'), 4000); return;
    }

    showToast(data.already ? 'Already checked in.' : '🎉 Check-in confirmed. Enjoy your stay.', 5000);
    await loadAllBookings();
  } catch(err) {
    if (btn) { btn.classList.remove('loading'); btn.textContent = 'Confirm check-in'; }
    showToast('Network error — please try again');
  }
}

function showToast(msg, dur=3200) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}
