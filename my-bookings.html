<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --glass:#FCFCFD;--glass-2:#F4F5FB;--glass-3:#EBEDF7;
  --ink:#0A0A14;--ink-soft:#4A4C66;--ink-faint:#8E90AD;
  --lilac:#B8A4F4;--lilac-deep:#8B6FE8;--mint:#5EEAD4;--mint-deep:#2DD4BF;
  --peach:#FFB59E;--electric:#4361FF;--violet:#7B2FF7;--ember:#FF6B2C;
  --line:rgba(10,10,20,0.07);--line-2:rgba(10,10,20,0.13);
  --theme:var(--lilac-deep);--theme-grad:linear-gradient(135deg,#B8A4F4,#7B2FF7);
  --font-display:'Geist','Inter',sans-serif;--font-body:'Inter',system-ui,sans-serif;
  --font-data:'Geist',monospace;
  --shadow-glass:0 8px 32px rgba(123,47,247,0.07);
  --shadow-lift:0 24px 64px rgba(123,47,247,0.14);
  --radius:20px;--ok:#2DD4BF;--err:#FF4D6D;
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
html,body{min-height:100%;font-family:var(--font-body);background:var(--glass-2);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;}

/* aurora */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.ab{position:absolute;border-radius:50%;filter:blur(90px);opacity:.32;mix-blend-mode:multiply;animation:drift 28s ease-in-out infinite;}
.ab-1{width:520px;height:520px;background:radial-gradient(circle,var(--lilac),transparent 70%);top:-12%;left:-8%;}
.ab-2{width:420px;height:420px;background:radial-gradient(circle,var(--mint),transparent 72%);bottom:-10%;right:-6%;animation-delay:-11s;opacity:.22;}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(36px,-26px) scale(1.08);}}

/* topbar */
.topbar{position:sticky;top:0;z-index:100;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(252,252,253,.76);backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid var(--line);}
.tb-left{display:flex;align-items:center;gap:12px;}
.tb-back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);transition:all .22s;text-decoration:none;}
.tb-back:hover{border-color:var(--theme);color:var(--theme);transform:translateX(-2px);}
.tb-logo{height:32px;}
.tb-brand{font-family:var(--font-display);font-weight:500;font-size:18px;}
.tb-brand em{font-style:italic;background:var(--theme-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}

/* page */
.page{position:relative;z-index:2;max-width:780px;margin:0 auto;padding:32px 22px 80px;}
.page-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--theme);margin-bottom:12px;padding:5px 13px;border-radius:100px;background:rgba(139,111,232,.09);border:1px solid rgba(139,111,232,.18);}
.page-title{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,3.6vw,34px);letter-spacing:-.02em;margin-bottom:6px;}
.page-title em{font-style:italic;font-weight:500;background:var(--theme-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.page-sub{font-size:14px;color:var(--ink-soft);margin-bottom:28px;}

/* tabs */
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.6);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:5px;margin-bottom:24px;}
.tab{flex:1;padding:10px;border:none;background:transparent;border-radius:11px;font-family:var(--font-body);font-weight:600;font-size:13px;color:var(--ink-faint);cursor:pointer;transition:all .25s;}
.tab.active{background:var(--glass);color:var(--ink);box-shadow:0 2px 8px rgba(10,10,20,.06);}

/* booking card */
.booking-card{background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;transition:box-shadow .3s;animation:cardIn .5s cubic-bezier(.22,1,.36,1) both;}
.booking-card:hover{box-shadow:var(--shadow-lift);}
@keyframes cardIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

/* card header strip */
.bk-header{padding:18px 20px;display:flex;align-items:center;gap:14px;}
.bk-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;}
.bk-icon.stays{background:linear-gradient(135deg,#B8A4F4,#7B2FF7);}
.bk-icon.tours{background:linear-gradient(135deg,#2DD4BF,#5EEAD4);}
.bk-icon.events{background:linear-gradient(135deg,#7B2FF7,#B8A4F4);}
.bk-icon svg{width:24px;height:24px;}
.bk-info{flex:1;min-width:0;}
.bk-name{font-family:var(--font-display);font-weight:500;font-size:17px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bk-meta{font-size:12px;color:var(--ink-faint);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.bk-meta svg{width:11px;height:11px;}
.bk-status{flex-shrink:0;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:5px 12px;border-radius:100px;}
.badge-pending{background:rgba(255,181,158,.15);color:var(--ember);}
.badge-checkedin{background:rgba(45,212,191,.1);color:var(--ok);}
.badge-failed{background:rgba(255,77,109,.1);color:var(--err);}
.badge-awaiting{background:var(--glass-3);color:var(--ink-faint);}

/* card body */
.bk-body{padding:0 20px 20px;}
.bk-divider{height:1px;background:var(--line);margin-bottom:16px;}
.bk-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;}
.bk-row .lbl{color:var(--ink-faint);}
.bk-row .val{color:var(--ink);font-weight:500;text-align:right;}

/* check-in section */
.ci-section{background:rgba(139,111,232,.05);border:1px solid rgba(139,111,232,.18);border-radius:16px;padding:18px;margin-top:4px;}
.ci-title{font-family:var(--font-display);font-weight:500;font-size:15px;margin-bottom:4px;}
.ci-sub{font-size:12px;color:var(--ink-soft);margin-bottom:14px;line-height:1.5;}

/* guest code display */
.ci-your-code{background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.2);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
.ci-code-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mint-deep);margin-bottom:6px;}
.ci-code-val{font-family:var(--font-data);font-size:26px;font-weight:700;color:var(--ink);letter-spacing:.12em;}
.ci-code-hint{font-size:11px;color:var(--ink-faint);margin-top:4px;}

/* host code entry */
.ci-enter{display:flex;gap:8px;align-items:stretch;}
.ci-input{flex:1;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--glass);font-family:var(--font-data);font-size:15px;font-weight:600;color:var(--ink);outline:none;letter-spacing:.1em;text-transform:uppercase;transition:border-color .22s;}
.ci-input:focus{border-color:var(--theme);box-shadow:0 0 0 3px rgba(139,111,232,.1);}
.ci-input::placeholder{font-size:13px;font-weight:400;letter-spacing:.04em;text-transform:none;color:var(--ink-faint);}
.ci-submit{padding:12px 18px;border-radius:12px;border:none;background:var(--theme-grad);color:#fff;font-family:var(--font-body);font-weight:600;font-size:13px;cursor:pointer;transition:all .25s;white-space:nowrap;}
.ci-submit:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(123,47,247,.3);}
.ci-submit.loading{opacity:.7;pointer-events:none;}

/* success check-in */
.ci-confirmed{background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.2);border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px;}
.ci-confirmed svg{width:28px;height:28px;color:var(--ok);flex-shrink:0;}
.ci-confirmed-title{font-weight:600;font-size:14px;color:var(--ink);}
.ci-confirmed-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}

/* empty state */
.empty{text-align:center;padding:60px 20px;}
.empty svg{width:56px;height:56px;color:var(--ink-faint);opacity:.3;margin:0 auto 18px;display:block;}
.empty-title{font-family:var(--font-display);font-size:20px;margin-bottom:8px;}
.empty-sub{font-size:13px;color:var(--ink-soft);margin-bottom:22px;line-height:1.6;}
.btn-primary{display:inline-flex;align-items:center;gap:7px;padding:12px 22px;border-radius:12px;border:none;background:var(--theme-grad);color:#fff;font-family:var(--font-body);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;transition:all .25s;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(123,47,247,.3);}

/* loading skeleton */
.skeleton{background:linear-gradient(90deg,var(--glass-2) 25%,var(--glass-3) 50%,var(--glass-2) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:10px;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(16px);z-index:9999;padding:13px 22px;border-radius:100px;background:var(--ink);color:#fff;font-size:13px;font-weight:500;box-shadow:var(--shadow-lift);opacity:0;transition:all .35s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:600px){.page{padding:20px 14px 70px;}.ci-enter{flex-direction:column;}.ci-submit{width:100%;}}
</style>

<style>
.bal-gate{margin-top:14px;padding:16px;border-radius:16px;background:linear-gradient(180deg,#fff8ec,#fffdf8);border:1.5px solid #f0d9a8;}
.bal-gate-t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:#7a4e12;margin-bottom:6px;}
.bal-gate-s{font-size:13px;line-height:1.55;color:#8a6432;margin-bottom:13px;}
.bal-gate-row{display:flex;justify-content:space-between;font-size:13px;color:#6b5225;padding:3px 0;}
.bal-gate-row b{color:#4a3510;}
.bal-gate-btn{width:100%;margin-top:12px;padding:13px;border:none;border-radius:12px;background:#0f1117;color:#fff;font-family:var(--font-body);font-weight:650;font-size:14px;cursor:pointer;}
.ci-locked{opacity:.45;pointer-events:none;filter:grayscale(1);}
.issue-btn{width:100%;margin-top:10px;padding:12px;border:1.5px solid #eadfe0;border-radius:12px;background:#fff;color:#a03a30;font-family:var(--font-body);font-weight:600;font-size:13.5px;cursor:pointer;transition:.16s;}
.issue-btn:hover{border-color:#e0473c;background:#fff8f7;}
.match-card{margin-top:14px;padding:18px;border-radius:16px;background:linear-gradient(180deg,#f4f9ff,#fbfdff);border:1.5px solid #cfe0f5;}
.match-t{font-weight:700;font-size:14.5px;color:#123a63;margin-bottom:5px;}
.match-s{font-size:13px;line-height:1.55;color:#41607f;margin-bottom:14px;}
.match-opt{display:flex;gap:12px;align-items:center;padding:11px;border-radius:12px;background:#fff;border:1.5px solid #e3ebf3;margin-bottom:8px;cursor:pointer;transition:.15s;}
.match-opt:hover{border-color:#5b8fc7;}
.match-opt.on{border-color:#1f6feb;background:#f5faff;}
.match-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:#e8eef4;}
.match-info{flex:1;min-width:0;}
.match-name{font-weight:650;font-size:13.5px;color:#12212e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.match-meta{font-size:12px;color:#66798c;margin-top:2px;}
.match-score{font-size:11px;font-weight:700;color:#1f6feb;background:#e8f1fd;padding:3px 7px;border-radius:6px;}
.match-acts{display:flex;gap:9px;margin-top:12px;}
.match-acts button{flex:1;padding:12px;border-radius:11px;font-family:var(--font-body);font-weight:650;font-size:13.5px;cursor:pointer;border:none;}
.match-accept{background:#1f6feb;color:#fff;}.match-accept:disabled{background:#cfd8e2;color:#96a1ac;cursor:not-allowed;}
.match-decline{background:#fff;border:1.5px solid #dde3ea !important;color:#57616b;}

/* ── REHOME ──────────────────────────────────────────────────────────
   The button a guest presses when the place they booked has fallen
   through. It sits above "report a problem", not beside it, because
   it is the thing most people actually want: not to complain, but to
   have somewhere to sleep.

   It is deliberately the most expensive-looking element on the card.
   A guest reaching for it is having the worst moment we can give them,
   and a thin grey outline at that moment reads as a company hoping you
   will not press it. */
.rehome-btn{position:relative;overflow:hidden;width:100%;margin-top:12px;padding:15px 18px;
  border:none;border-radius:15px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:10px;font-family:var(--font-body);font-weight:650;font-size:14.5px;
  color:#fff;background:linear-gradient(122deg,#5B3FD9,#7B2FF7 46%,#2DD4BF 140%);
  box-shadow:0 12px 30px rgba(123,47,247,.26),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s,filter .2s;}
.rehome-btn::after{content:'';position:absolute;top:0;left:-60%;width:38%;height:100%;
  transform:skewX(-18deg);pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);
  animation:rhShine 4.6s ease-in-out 1.4s infinite;}
@keyframes rhShine{0%{left:-60%;}52%,100%{left:140%;}}
.rehome-btn:hover{transform:translateY(-1px);filter:brightness(1.05);
  box-shadow:0 18px 40px rgba(123,47,247,.34),inset 0 1px 0 rgba(255,255,255,.28);}
.rehome-btn:active{transform:translateY(0);filter:brightness(.97);}
.rehome-btn:disabled{background:#cfd8e2;color:#8a94a0;box-shadow:none;cursor:progress;}
.rehome-btn:disabled::after{display:none;}
.rehome-btn svg{flex:none;width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;}
.rehome-sub{margin-top:7px;font-size:11.5px;line-height:1.5;color:var(--ink-faint);text-align:center;}

/* The sheet. One question, four honest answers, and a way out. */
.rh-veil{position:fixed;inset:0;z-index:2147481000;display:flex;align-items:flex-end;
  justify-content:center;padding:0;opacity:0;transition:opacity .28s ease;
  background:radial-gradient(120% 100% at 50% 40%,rgba(12,8,30,.5),rgba(6,5,16,.76));
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.rh-veil.on{opacity:1;}
.rh-sheet{width:100%;max-width:520px;background:var(--glass);border-radius:26px 26px 0 0;
  padding:26px 24px calc(24px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -20px 70px rgba(10,10,20,.3);transform:translateY(30px);opacity:0;
  transition:transform .42s cubic-bezier(.16,1,.3,1),opacity .3s ease;
  max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.rh-veil.on .rh-sheet{transform:none;opacity:1;}
@media(min-width:560px){.rh-veil{align-items:center;padding:22px;}
  .rh-sheet{border-radius:24px;box-shadow:0 40px 100px rgba(10,10,20,.34);}}
.rh-grip{width:38px;height:4px;border-radius:99px;background:var(--line-2);margin:0 auto 18px;}
.rh-t{font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:-.02em;
  margin-bottom:7px;}
.rh-s{font-size:13.5px;line-height:1.6;color:var(--ink-soft);margin-bottom:18px;}
.rh-reasons{display:grid;gap:9px;margin-bottom:16px;}
.rh-r{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:14px;
  border:1.5px solid var(--line-2);background:rgba(255,255,255,.6);cursor:pointer;
  transition:border-color .18s,background .18s,transform .18s;text-align:left;width:100%;
  font-family:var(--font-body);}
.rh-r:hover{border-color:var(--lilac-deep);background:#fff;transform:translateX(2px);}
.rh-r.on{border-color:var(--violet);background:linear-gradient(120deg,#faf7ff,#f4fffd);
  box-shadow:0 6px 20px rgba(123,47,247,.1);}
.rh-r-dot{flex:none;width:19px;height:19px;margin-top:1px;border-radius:50%;
  border:2px solid var(--line-2);position:relative;transition:.18s;}
.rh-r.on .rh-r-dot{border-color:var(--violet);}
.rh-r.on .rh-r-dot::after{content:'';position:absolute;inset:3px;border-radius:50%;
  background:var(--violet);}
/* These are spans inside a <button>, so they need saying out loud: a
   button's children are inline by default and the heading ran straight
   into its own description on one line. */
.rh-r-txt{flex:1;min-width:0;display:block;}
.rh-r-h{display:block;font-weight:650;font-size:14px;line-height:1.35;color:var(--ink);
  margin-bottom:3px;}
.rh-r-p{display:block;font-size:12px;line-height:1.5;color:var(--ink-faint);}
.rh-note{width:100%;padding:12px 13px;border-radius:13px;border:1.5px solid var(--line-2);
  background:rgba(255,255,255,.6);font-family:var(--font-body);font-size:13.5px;color:var(--ink);
  resize:vertical;min-height:66px;margin-bottom:14px;}
.rh-note:focus{outline:none;border-color:var(--lilac-deep);background:#fff;}
.rh-terms{padding:13px 14px;border-radius:13px;margin-bottom:16px;font-size:12.5px;line-height:1.6;
  background:linear-gradient(120deg,rgba(184,164,244,.1),rgba(94,234,212,.08));
  border:1px solid rgba(184,164,244,.28);color:var(--ink-soft);}
.rh-terms b{color:var(--ink);font-weight:650;}
.rh-acts{display:flex;gap:10px;}
.rh-acts button{flex:1;padding:14px;border-radius:13px;font-family:var(--font-body);
  font-weight:650;font-size:14px;cursor:pointer;border:none;transition:.18s;}
.rh-go{color:#fff;background:linear-gradient(122deg,#5B3FD9,#7B2FF7 52%,#2DD4BF 150%);
  box-shadow:0 10px 26px rgba(123,47,247,.26);}
.rh-go:hover{filter:brightness(1.05);}
.rh-go:disabled{background:#cfd8e2;color:#8a94a0;box-shadow:none;cursor:not-allowed;filter:none;}
.rh-cancel{background:#fff;border:1.5px solid var(--line-2) !important;color:var(--ink-soft);}
.rh-cancel:hover{border-color:var(--ink-faint) !important;color:var(--ink);}
.rh-searching{display:flex;align-items:center;gap:12px;padding:16px 0;font-size:13.5px;
  color:var(--ink-soft);}
.rh-spin{flex:none;width:20px;height:20px;border-radius:50%;border:2.4px solid rgba(123,47,247,.18);
  border-top-color:var(--violet);animation:spin .78s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* The shortlist, when it is the guest who asked. Same bones as the
   host-initiated panel, warmer skin, and a price delta on every row —
   because a guest who asked to move is comparing, not just accepting. */
.match-card.is-guest{background:linear-gradient(180deg,#faf7ff,#f6fffd);border-color:#dcd0f7;}
.match-card.is-guest .match-t{color:#3b2170;}
.match-card.is-guest .match-opt.on{border-color:var(--violet);background:#faf7ff;}
.match-card.is-guest .match-score{color:var(--violet);background:#f0e9ff;}
.match-card.is-guest .match-accept{background:linear-gradient(122deg,#5B3FD9,#7B2FF7 60%,#2DD4BF 160%);}
.match-delta{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap;}
.match-delta.down{color:#0d7a63;background:#e2fbf5;}
.match-delta.same{color:#57616b;background:#eef1f4;}
.match-delta.up{color:#8a5a00;background:#fff3dc;}
/* Stacked, not strung out. Side by side these two chips ate half the row
   and squeezed the listing's own name and address into three wrapped
   lines — the guest is here to compare places, and the place has to be
   the widest thing on the line. */
.match-tags{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex:none;}
.rev-prompt{margin-top:14px;padding:16px;border-radius:16px;background:#fafbfc;border:1.5px solid #e8eaee;}
.rev-t{font-weight:700;font-size:14px;color:#0f1117;margin-bottom:4px;}
.rev-s{font-size:12.5px;line-height:1.55;color:#767d88;margin-bottom:12px;}
.rev-stars{display:flex;gap:6px;margin-bottom:12px;}
.rev-star{font-size:26px;line-height:1;color:#dfe2e8;cursor:pointer;transition:.12s;}
.rev-star.on{color:#f5a623;}
.rev-body{width:100%;border:1.5px solid #e5e7ec;border-radius:11px;padding:10px 12px;font-family:var(--font-body);font-size:13.5px;resize:vertical;outline:none;}
.rev-send{width:100%;margin-top:10px;padding:12px;border:none;border-radius:11px;background:#0f1117;color:#fff;font-weight:650;font-size:13.5px;cursor:pointer;}
.rev-send:disabled{background:#dfe2e8;color:#a3a8b2;cursor:not-allowed;}
.rev-priv{font-size:11.5px;color:#9aa0ab;margin-top:9px;text-align:center;}
.card-warn{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#b3541e;background:#fdf3e8;padding:4px 8px;border-radius:6px;margin-left:6px;}

/* ── tab counts ─────────────────────────────────────────────── */
.tab-n{display:inline-block;min-width:18px;margin-left:5px;padding:1px 6px;border-radius:100px;
  font-size:10.5px;font-weight:700;background:var(--glass-3);color:var(--ink-faint);}
.tab.active .tab-n{background:rgba(139,111,232,.14);color:var(--theme);}
.tab-n:empty{display:none;}

/* ── type chips ─────────────────────────────────────────────── */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:-10px 0 22px;}
.chip{padding:7px 14px;border-radius:100px;border:1px solid var(--line);background:rgba(255,255,255,.55);
  font-family:var(--font-body);font-size:12.5px;font-weight:600;color:var(--ink-faint);cursor:pointer;
  transition:color .2s,border-color .2s,background .2s;}
.chip:hover{color:var(--ink-soft);border-color:var(--line-2);}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}

/* ── settlement meter ────────────────────────────────────────
   A booking part-way paid is the one state the old page could not
   describe at all. It gets a number, a bar and the exact shortfall. */
.pay-panel{margin-top:4px;padding:16px 17px;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,181,158,.10),rgba(255,181,158,.04));
  border:1px solid rgba(255,149,0,.22);}
.pay-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px;}
.pay-title{font-family:var(--font-display);font-weight:500;font-size:14.5px;color:var(--ink);}
.pay-pct{font-family:var(--font-data);font-size:12px;font-weight:700;color:var(--ember);}
.meter{height:6px;border-radius:100px;background:rgba(10,10,20,.07);overflow:hidden;margin-bottom:10px;}
.meter-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,#FFB59E,#FF6B2C);
  width:0;transition:width .9s cubic-bezier(.16,1,.3,1);}
.pay-note{font-size:12.5px;line-height:1.55;color:var(--ink-soft);margin-bottom:12px;}
.pay-note b{color:var(--ink);font-weight:650;}
.pay-btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--ink);color:#fff;
  font-family:var(--font-body);font-weight:650;font-size:14px;cursor:pointer;transition:transform .2s,box-shadow .2s;}
.pay-btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(10,10,20,.18);}
.pay-btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none;}

/* ── closed bookings ─────────────────────────────────────────
   Past bookings are history, not offers. They read quieter, and
   they carry no live code. */
.booking-card.is-past{background:rgba(255,255,255,.42);box-shadow:none;}
.booking-card.is-past .bk-icon{filter:grayscale(.85);opacity:.6;}
.booking-card.is-past:hover{box-shadow:0 8px 24px rgba(10,10,20,.05);}
.badge-done{background:rgba(45,212,191,.10);color:var(--mint-deep);}
.badge-closed{background:var(--glass-3);color:var(--ink-faint);}
.badge-live{background:linear-gradient(135deg,#B8A4F4,#7B2FF7);color:#fff;}
.badge-live .live-dot{width:5px;height:5px;border-radius:50%;background:#fff;
  animation:livePulse 1.9s ease-in-out infinite;}
@keyframes livePulse{0%,100%{opacity:1;}50%{opacity:.35;}}

.bk-sub{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}

/* ── empty state icon ────────────────────────────────────────── */
.empty-ico{font-size:40px;line-height:1;margin-bottom:14px;opacity:.5;}

/* Stagger the cards in. Enough to feel composed, not enough to wait for. */
.booking-card{animation-delay:calc(var(--i,0) * 55ms);}
</style>

<body>
<div class="aurora"><div class="ab ab-1"></div><div class="ab ab-2"></div></div>

<div class="page">

  <h1 class="page-title">My <em>bookings</em></h1>
  <p class="page-sub">Your reservations, tickets and trips, all in one place.</p>

  <!-- When: the only split that matters. A booking is either still
       ahead of you or behind you. -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-when="upcoming" type="button">Upcoming <span class="tab-n" id="n-upcoming"></span></button>
    <button class="tab"        data-when="past"     type="button">Past <span class="tab-n" id="n-past"></span></button>
  </div>

  <!-- What: shown only once a guest actually has more than one kind. -->
  <div class="chips" id="chips" hidden></div>

  <!-- loading skeleton -->
  <div id="loading-state">
    <div style="height:120px;border-radius:var(--radius);margin-bottom:16px;" class="skeleton"></div>
    <div style="height:120px;border-radius:var(--radius);margin-bottom:16px;" class="skeleton"></div>
    <div style="height:120px;border-radius:var(--radius);" class="skeleton"></div>
  </div>

  <div id="bookings-container" hidden></div>
</div>

<div style="max-width:780px;margin:0 auto;padding:0 22px 40px;">

<div style="max-width:780px;margin:0 auto;padding:0 22px 40px;"><div data-showcase="video"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   MY BOOKINGS
   ──────────────────────────────────────────────────────────────
   WHY THIS WAS REWRITTEN

   1. The page never displayed. Bookings were rendered into
      #bookings-container, which ships with `hidden`, and nothing
      ever unhid it or removed the three loading skeletons above it.
      The data loaded, the cards were built, and the guest saw
      shimmering grey boxes forever.

   2. The tabs did nothing. The buttons emitted 'stays' / 'tours' /
      'events'; the filter compared against 'pending_checkin' /
      'checked_in' / 'past'. No tab ever matched, so every tab showed
      everything.

   3. Every stay was called "Booking". The card read b.listing_name,
      a column that is almost always null on apartment_bookings; the
      name lives in apartment_name.

   4. "Amount paid" showed grand_total, the amount OWED, on a booking
      where KES 10 of KES 2,300 had actually arrived.

   5. Nothing ever ended. A stay whose dates had passed still offered
      a live check-in code.

   The page now derives everything from CabanaBooking, so it and the
   trip strip cannot disagree, and the server enforces the same rules
   again at /api/verify-checkin.
══════════════════════════════════════════════════════════════ */

/* If cabana-booking-state.js failed to arrive, say so instead of
   throwing on every helper and leaving the skeletons up, which is
   exactly the failure mode this rewrite exists to remove. */
const CB = window.CabanaBooking;
if (!CB) {
  const l = document.getElementById('loading-state'); if (l) l.remove();
  const c = document.getElementById('bookings-container');
  if (c) {
    c.hidden = false;
    c.innerHTML = '<div class="empty"><div class="empty-ico">⚠️</div>'
      + '<div class="empty-title">Something didn\'t load</div>'
      + '<div class="empty-sub">Part of the page failed to download. '
      + 'Your bookings are safe.</div>'
      + '<button class="btn-primary" onclick="location.reload()">Reload</button></div>';
  }
  throw new Error('CabanaBooking unavailable');
}

/* One client for the tab. apa-session.js memoises createClient, so
   this returns the same instance the rest of the app uses instead of
   starting a competitor on the same storage key. */
const SUPABASE_URL      = 'https://gfwgbgdvxtocwhilrtdw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdmd2diZ2R2eHRvY3doaWxydGR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MTE2NjMsImV4cCI6MjA5NzA4NzY2M30.U8JClv06YsNAwq9qsPb3lQ4SIPeRPjKMzsYxVfcmujw';

let sb = null;
try {
  sb = (window.ApaSession && ApaSession.client())
    || supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) {
  console.error('[my-bookings] Supabase client failed to initialise:', e);
}

let CURRENT_USER  = null;
let allBookings   = [];
let currentWhen   = 'upcoming';
let currentType   = 'all';
let PENDING_OFFERS = {};
let REVIEWED       = new Set();

const $ = id => document.getElementById(id);
const esc = s => CB.esc(s);

/* ═══════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════ */
(async function boot() {
  try {
    if (!sb) throw new Error('Supabase client unavailable');

    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      try { sessionStorage.setItem('auth_next', location.pathname + location.search); } catch (_) {}
      window.location.href = 'auth.html?next=' + encodeURIComponent(location.pathname);
      return;
    }
    CURRENT_USER = session.user;
    await loadAllBookings();
  } catch (e) {
    console.error('[my-bookings] init failed:', e);
    showError(e);
  }
})();

/* Whatever happens, the skeletons come down. They are a promise that
   something is coming; leaving them up is a lie. */
function reveal() {
  const l = $('loading-state');
  if (l) l.remove();
  const c = $('bookings-container');
  if (c) c.hidden = false;
}

function showError(e) {
  reveal();
  const c = $('bookings-container');
  if (!c) return;
  c.innerHTML =
    '<div class="empty"><div class="empty-ico">⚠️</div>'
    + '<div class="empty-title">Could not load your bookings</div>'
    + '<div class="empty-sub">' + esc(e && e.message || e) + '</div>'
    + '<button class="btn-primary" onclick="location.reload()">Try again</button></div>';
}

/* ═══════════════════════════════════════════════════════════════
   LOAD
   ═══════════════════════════════════════════════════════════════ */
async function loadAllBookings() {
  const uid = CURRENT_USER.id;

  const [aptRes, tourRes, evRes] = await Promise.all([
    sb.from('apartment_bookings').select('*').eq('guest_id', uid).order('created_at', { ascending: false }),
    sb.from('tour_bookings').select('*').eq('guest_id', uid).order('created_at', { ascending: false }),
    sb.from('event_tickets').select('*').eq('guest_id', uid).order('created_at', { ascending: false }),
  ]);

  /* One table failing must not blank the other two. */
  const failed = [];
  [['stays', aptRes], ['tours', tourRes], ['events', evRes]].forEach(([n, r]) => {
    if (r && r.error) { console.error('[my-bookings] ' + n + ':', r.error.message); failed.push(n); }
  });
  if (failed.length === 3) throw new Error('Could not reach the booking service.');

  const tag = (rows, type, table) => (rows || []).map(b => ({
    ...b, _type: type, _table: table,
  }));

  allBookings = [
    ...tag(aptRes.data,  'apartment', 'apartment_bookings'),
    ...tag(tourRes.data, 'tour',      'tour_bookings'),
    ...tag(evRes.data,   'event',     'event_tickets'),
  ];

  /* Sort by when the trip happens, not when the row was written. A
     guest opening this page wants the next thing they are doing. */
  allBookings.forEach(b => { b._lc = CB.lifecycle(b); b._start = CB.startDay(b); });
  allBookings.sort((a, b) => {
    if (a._lc.bucket !== b._lc.bucket) return a._lc.bucket === 'upcoming' ? -1 : 1;
    const dir = a._lc.bucket === 'upcoming' ? 1 : -1;   /* soonest first, then most recent first */
    if (a._start != null && b._start != null && a._start !== b._start) return (a._start - b._start) * dir;
    return new Date(b.created_at) - new Date(a.created_at);
  });

  await loadTrustState(uid);
  renderBookings();
}

/* ═══════════════════════════════════════════════════════════════
   FILTERS
   ═══════════════════════════════════════════════════════════════ */
const TYPE_LABEL = { apartment: 'Stays', tour: 'Tours', event: 'Events' };

function visible() {
  return allBookings.filter(b =>
    b._lc.bucket === currentWhen &&
    (currentType === 'all' || b._type === currentType));
}

function bindTabs() {
  document.querySelectorAll('#tabs .tab').forEach(t => {
    t.onclick = () => {
      currentWhen = t.dataset.when;
      document.querySelectorAll('#tabs .tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      renderBookings();
    };
  });
}

function renderChips() {
  const box = $('chips');
  if (!box) return;

  /* Only the types this guest actually has, and only when there is a
     genuine choice to make. A filter with one option is furniture. */
  const inBucket = allBookings.filter(b => b._lc.bucket === currentWhen);
  const types = [...new Set(inBucket.map(b => b._type))];

  if (types.length < 2) {
    box.hidden = true;
    if (currentType !== 'all' && !types.includes(currentType)) currentType = 'all';
    return;
  }

  box.hidden = false;
  box.innerHTML = ['all', ...types].map(t =>
    '<button type="button" class="chip' + (currentType === t ? ' on' : '') + '" data-type="' + t + '">'
    + (t === 'all' ? 'All' : TYPE_LABEL[t] || t) + '</button>').join('');

  box.querySelectorAll('.chip').forEach(c => {
    c.onclick = () => { currentType = c.dataset.type; renderBookings(); };
  });
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════ */
function renderBookings() {
  reveal();

  const upcoming = allBookings.filter(b => b._lc.bucket === 'upcoming').length;
  const past     = allBookings.length - upcoming;
  if ($('n-upcoming')) $('n-upcoming').textContent = upcoming || '';
  if ($('n-past'))     $('n-past').textContent     = past || '';

  renderChips();

  const list = visible();
  const c = $('bookings-container');
  if (!c) return;

  if (!list.length) { c.innerHTML = emptyState(); return; }

  c.innerHTML = list.map((b, i) => buildBookingCard(b, i)).join('');

  /* Animate the meters after paint so they sweep rather than appear.
     Wrapped, because a decoration must never be able to take the page
     down with it: this threw once and the whole render unwound into
     the error state, cards and all. */
  try {
    const sweep = () => document.querySelectorAll('.meter-fill').forEach(el => {
      el.style.width = (el.dataset.pct || 0) + '%';
    });
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(sweep);
    else sweep();
  } catch (e) { /* the bar just starts full-width; the number is still right */ }
}

function emptyState() {
  if (currentWhen === 'past') {
    return '<div class="empty"><div class="empty-ico">🧾</div>'
      + '<div class="empty-title">Nothing behind you yet</div>'
      + '<div class="empty-sub">Completed stays, tours and tickets are kept here '
      + 'so you always have the receipt.</div></div>';
  }
  const filtered = currentType !== 'all';
  return '<div class="empty"><div class="empty-ico">🌍</div>'
    + '<div class="empty-title">' + (filtered ? 'Nothing here' : 'No trips booked') + '</div>'
    + '<div class="empty-sub">' + (filtered
        ? 'Try another filter, or check the Past tab.'
        : 'Your next stay, tour or ticket will appear here the moment it is booked.')
    + '</div>'
    + (filtered ? '' : '<a class="btn-primary" href="apartments.html">Find a place to stay →</a>')
    + '</div>';
}

/* ── the card ──────────────────────────────────────────────────── */
const TYPE_ICON = {
  apartment: '<div class="bk-icon stays"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5M5 9.5V20h14V9.5M9 20v-5a3 3 0 0 1 6 0v5"/></svg></div>',
  tour:      '<div class="bk-icon tours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5.5-6-2-6 2.5v13l6-2.5 6 2 6-2.5v-13zM9 3.5v13M15 7.5v13"/></svg></div>',
  event:     '<div class="bk-icon events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a2 2 0 0 0 0 6v2a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-2a2 2 0 0 0 0-6V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"/><path d="M14 6v12" stroke-dasharray="2 2.5"/></svg></div>',
};

const TONE_CLASS = { good:'badge-done', live:'badge-live', warn:'badge-pending',
                     bad:'badge-failed', muted:'badge-closed' };

function whenLine(b) {
  if (b._type === 'apartment') {
    const r = CB.fmtRange(b.checkin_date, b.checkout_date);
    const n = b.nights ? b.nights + (b.nights !== 1 ? ' nights' : ' night') : '';
    return [r, n].filter(Boolean).join(' · ');
  }
  if (b._type === 'tour') {
    const p = b.num_people ? b.num_people + (b.num_people !== 1 ? ' people' : ' person') : '';
    return [CB.fmtDay(b.tour_date), p].filter(Boolean).join(' · ');
  }
  const q = b.quantity ? b.quantity + (b.quantity !== 1 ? ' tickets' : ' ticket') : '';
  return [b.tier_name, q].filter(Boolean).join(' · ');
}

function buildBookingCard(b, i) {
  const lc   = b._lc;
  const s    = lc.settlement;
  const past = lc.bucket === 'past';

  const badge = '<span class="badge ' + (TONE_CLASS[lc.tone] || 'badge-awaiting') + '">'
    + (lc.tone === 'live' ? '<span class="live-dot"></span>' : '')
    + esc(lc.label) + '</span>';

  const place = b.location || b.venue || b.operator_name || '';
  const when  = whenLine(b);

  /* Sections, in the order a guest needs them. */
  let body = '';

  if (!past && !s.settled && lc.key !== 'failed' && lc.key !== 'cancelled') {
    body += buildPayPanel(b, s, lc);
  }

  body += buildPartnerContact(b);

  if (b._type === 'apartment' && PENDING_OFFERS[b.id]) {
    body += buildMatchPanel(b, PENDING_OFFERS[b.id]);
  } else {
    body += buildCheckinPanel(b, lc);
  }

  /* ── The two escape hatches, in the order a guest needs them ──────
     "Find me another home" first, and loud, because it is what almost
     everyone in trouble actually wants: not to open a dispute, but to
     have somewhere to sleep tonight. The quieter link underneath is for
     the cases where a move is not the answer — cancelling well ahead of
     time, or an arrival problem that needs adjudicating.

     Both are drawn only while there is something to escape: a live,
     paid, apartment booking that has not already been rehomed. */
  if (b._type === 'apartment' && !b.cancelled_at && !past && s.paid > 0
      && b.status !== 'rehomed' && b.status !== 'checked_in'
      && !PENDING_OFFERS[b.id]) {
    body += '<button class="rehome-btn" id="rehome-btn-' + b.id + '" '
      + 'onclick="openRehome(\'' + b.id + '\')">'
      + '<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/>'
      +   '<path d="M5 9.5V20h5v-6h4v6h5V9.5"/><path d="M16.5 5.5h5m0 0-2-2m2 2-2 2"/></svg>'
      + 'Find me another home</button>'
      + '<div class="rehome-sub">Same dates. We sweep every listing that matches yours '
      +   'and put the shortlist in front of you.</div>';
  }

  /* The escape hatch, only while there is still something to escape. */
  if (b._type === 'apartment' && !b.cancelled_at && !past && s.paid > 0) {
    const h = (window.ApaTrust && ApaTrust.hoursTo) ? ApaTrust.hoursTo(b.checkin_date) : null;
    const label = h == null ? 'Report a problem'
      : h >= 24 ? 'Cancel this stay'
      : h >= 2  ? "Can't stay here?"
      : "Can't stay here. There's an issue";
    body += '<button class="issue-btn" onclick="openIssue(\'' + b.id + '\')">' + label + '</button>';
  }

  if (b._type === 'apartment' && b.status === 'checked_in' && !REVIEWED.has(b.id)) {
    body += buildReviewPanel(b);
  }

  return '<div class="booking-card' + (past ? ' is-past' : '') + '" id="card-' + b.id + '" style="--i:' + i + '">'
    + '<div class="bk-header">'
    +   (TYPE_ICON[b._type] || TYPE_ICON.apartment)
    +   '<div class="bk-info">'
    +     '<div class="bk-name">' + esc(CB.title(b)) + '</div>'
    +     '<div class="bk-meta">'
    +       (place ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>' + esc(place) : '')
    +       (when ? '<span>' + (place ? '· ' : '') + esc(when) + '</span>' : '')
    +     '</div>'
    +   '</div>'
    +   '<div class="bk-status">' + badge + '</div>'
    + '</div>'
    + '<div class="bk-body">'
    +   '<div class="bk-divider"></div>'
    +   (lc.note ? '<div class="bk-sub">' + esc(lc.note) + '</div>' : '')
    +   '<div class="bk-row" style="margin-top:12px"><span class="lbl">Reference</span>'
    +     '<span class="val" style="font-family:var(--font-data);font-size:12px;">'
    +     esc(b.payment_reference || '—') + '</span></div>'
    /* Paid, then owed. Showing grand_total under the label "Amount
       paid" was the single most misleading line on the old page. */
    +   '<div class="bk-row"><span class="lbl">Paid</span><span class="val">' + CB.money(s.paid)
    +     (s.settled ? '' : ' <span style="color:var(--ink-faint);font-weight:400">of '
        + CB.money(s.total) + '</span>') + '</span></div>'
    +   body
    + '</div>'
    + '</div>';
}

/* ── outstanding balance ───────────────────────────────────────── */
function buildPayPanel(b, s, lc) {
  if (s.total <= 0) return '';

  const toConfirm = Math.max(0, s.deposit - s.paid);
  const note = !s.confirmed
    ? 'These dates are <b>not held yet</b>. ' + CB.money(toConfirm)
      + ' more confirms the booking, and ' + CB.money(s.outstanding)
      + ' in total unlocks your check-in code.'
    : 'Your dates are held. <b>' + CB.money(s.outstanding)
      + '</b> remains before your check-in code unlocks.';

  return '<div class="pay-panel">'
    + '<div class="pay-head"><span class="pay-title">'
    +   (s.paid > 0 ? 'Balance outstanding' : 'Payment due') + '</span>'
    +   '<span class="pay-pct">' + s.pct + '% paid</span></div>'
    + '<div class="meter"><div class="meter-fill" data-pct="' + s.pct + '"></div></div>'
    + '<div class="pay-note">' + note + '</div>'
    + '<button class="pay-btn" onclick="payRest(\'' + b.id + '\')">Pay '
    +   CB.money(s.outstanding) + ' now</button>'
    + '</div>';
}

/* ── check-in ──────────────────────────────────────────────────── */
function buildCheckinPanel(b, lc) {
  const cs = CB.codeState(b);

  if (b.status === 'checked_in' || lc.key === 'completed') {
    return '<div class="ci-confirmed">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
      + '<div><div class="ci-confirmed-title">Check-in confirmed</div>'
      + '<div class="ci-confirmed-sub">Payout released to host'
      + (b.checked_in_at ? ' on ' + new Date(b.checked_in_at).toLocaleDateString('en-GB') : '')
      + '</div></div></div>';
  }

  /* The code is shown only when the stay is paid for in full and the
     dates have not passed. Every other case says why, plainly, rather
     than showing a code that would be refused at the door. */
  if (!cs.show) {
    if (cs.reason === 'balance_due' || cs.reason === 'unpaid') {
      return '<div class="ci-section ci-locked">'
        + '<div class="ci-title">Check-in code</div>'
        + '<div class="ci-sub">Unlocks the moment this booking is paid in full.</div>'
        + '<div class="ci-your-code"><div class="ci-code-label">Your code · show to host</div>'
        + '<div class="ci-code-val">••••••</div></div></div>';
    }
    return '';
  }

  return '<div class="ci-section">'
    + '<div class="ci-title">Check-in codes</div>'
    + '<div class="ci-sub">At check-in: show your code to the host, then enter theirs below. '
    +   'Once both are exchanged your stay is confirmed and the host is paid.</div>'
    + '<div class="ci-your-code">'
    +   '<div class="ci-code-label">Your code · show to host</div>'
    +   '<div class="ci-code-val">' + esc(cs.code) + '</div>'
    +   '<div class="ci-code-hint">Share this with your host when you arrive</div>'
    + '</div>'
    + '<div style="font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;">Enter host\'s code</div>'
    + '<div class="ci-enter">'
    +   '<input class="ci-input" id="host-code-' + b.id + '" placeholder="HOST-XXXXXX" maxlength="12"/>'
    +   '<button class="ci-submit" onclick="verifyHostCode(\'' + b._table + '\',\''
    +     esc(b.payment_reference) + '\',\'' + b.id + '\')">Confirm check-in</button>'
    + '</div></div>';
}

/* ═══════════════════════════════════════════════════════════════
   PAY THE REMAINDER

   Routed through the ordinary instalment flow: same reference, same
   /api/stk-push validation, same ledger. The old path minted a BAL-
   reference that api/stk-push rejects outright ("Unrecognised payment
   reference"), so settling a balance from this page could not work.
   ═══════════════════════════════════════════════════════════════ */
async function payRest(bookingId) {
  const b = allBookings.find(x => x.id === bookingId);
  if (!b) return;

  const s = CB.settlement(b);
  if (s.outstanding <= 0) return showToast('This booking is already paid in full.');

  const Pay = window.CabanaPay || window.CabanaPay;
  if (!Pay) return showToast('Payment is unavailable right now. Please refresh.');

  const btn = document.querySelector('#card-' + bookingId + ' .pay-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Opening M-Pesa…'; }

  /* The guest's own number, never contact_phone: that column holds
     the HOST's details, and pushing an M-Pesa prompt to the host to
     settle the guest's balance would be a memorable kind of wrong. */
  let phone = b.guest_phone || CURRENT_USER?.phone
    || CURRENT_USER?.user_metadata?.phone || '';
  if (!/^(?:\+?254|0)\d{9}$/.test(String(phone).replace(/[\s-]/g, ''))) {
    phone = prompt('Which M-Pesa number should we send the prompt to?', phone || '07');
    if (!phone) { if (btn) { btn.disabled = false; btn.textContent = 'Pay ' + CB.money(s.outstanding) + ' now'; } return; }
  }

  Pay.start({
    amount:      s.outstanding,
    phone:       phone,
    reference:   b.payment_reference,
    table:       b._table,
    description: 'Balance · ' + CB.title(b),
    onSuccess: async () => { showToast('Payment received. Updating your booking…'); await refresh(); },
    onFailure: async () => {
      if (btn) { btn.disabled = false; btn.textContent = 'Pay ' + CB.money(s.outstanding) + ' now'; }
      showToast('That payment did not complete. Nothing was charged.');
      await refresh();
    },
  });
}

async function refresh() {
  try { await loadAllBookings(); }
  catch (e) { console.error('[my-bookings] refresh:', e); }
}

/* ═══════════════════════════════════════════════════════════════
   TRUST STATE
   RLS means an offer we can see is an offer meant for us.
   ═══════════════════════════════════════════════════════════════ */
async function loadTrustState(uid) {
  PENDING_OFFERS = {}; REVIEWED = new Set();
  try {
    const [offers, reviews] = await Promise.all([
      sb.from('match_offers').select('*')
        .eq('guest_id', uid).eq('status', 'offered')
        .gt('expires_at', new Date().toISOString()),
      sb.from('private_reviews').select('booking_id').eq('author_id', uid),
    ]);
    (offers.data  || []).forEach(o => { PENDING_OFFERS[o.booking_id] = o; });
    (reviews.data || []).forEach(r => REVIEWED.add(r.booking_id));
  } catch (e) { console.warn('[trust state]', e.message); }
}

/* ═══════════════════════════════════════════════════════════════
   MATCH OFFER PANEL
   The host couldn't host. We hand the guest a ranked shortlist and a
   refund button of equal weight. Declining costs them nothing.
   ═══════════════════════════════════════════════════════════════ */
function buildMatchPanel(b, offer) {
  const cands = offer.candidates || [];
  /* Who opened this door changes what the panel is allowed to say and
     what "no thanks" does. A host-initiated offer means the stay is
     over either way, so declining is a refund. A guest-initiated one is
     a shortlist they asked to see, and declining changes nothing. */
  const byGuest = (offer.initiated_by || 'host') === 'guest';
  const expires = offer.expires_at ? new Date(offer.expires_at) : null;
  const hoursLeft = expires ? Math.max(0, Math.round((expires - Date.now()) / 3600000)) : null;

  const title = byGuest
    ? 'We found ' + cands.length + ' ' + (cands.length === 1 ? 'home' : 'homes') + ' for your dates'
    : 'Your host can\'t host. We found ' + cands.length
      + ' alternative' + (cands.length === 1 ? '' : 's');

  const sub = byGuest
    ? 'Ranked against the one you booked — price, area, size and how each place has actually been '
      + 'reviewed. Every host here has been told you\'re looking. Choose one, or keep the booking '
      + 'you have; nothing changes until you decide.'
    : 'Same dates, same price to you. Ranked by how closely they match what you booked. '
      + 'Choose one, or take a full refund. No penalty either way.';

  /* The price difference, on every row, stated as a number rather than
     implied by two prices the guest has to subtract in their head. */
  const delta = (c) => {
    const d = Math.round(Number(c.price_delta || 0));
    if (!d) return '<span class="match-delta same">Same price</span>';
    /* A signed number, not a sentence. "KES 400 less/night" reads as
       prose and wraps; "−KES 400 /night" is the same fact in a chip
       that fits beside the listing rather than instead of it. */
    return d < 0
      ? '<span class="match-delta down">−' + CB.money(Math.abs(d)) + '/night</span>'
      : '<span class="match-delta up">+' + CB.money(d) + '/night</span>';
  };

  return '<div class="match-card' + (byGuest ? ' is-guest' : '') + '" id="match-' + b.id + '">'
    + '<div class="match-t">' + title + '</div>'
    + '<div class="match-s">' + sub
    +   (hoursLeft != null
          ? ' <b>This shortlist holds for about ' + hoursLeft + ' more hour'
            + (hoursLeft === 1 ? '' : 's') + '.</b>'
          : '') + '</div>'
    + cands.map(c =>
        '<div class="match-opt" data-listing="' + esc(c.listing_id) + '" '
        + 'onclick="pickMatch(\'' + b.id + '\',\'' + esc(c.listing_id) + '\')">'
        + '<img class="match-thumb" src="' + esc((Array.isArray(c.photos) ? c.photos[0] : '') || '/cabana-emblem.png')
        +   '" alt="" loading="lazy" decoding="async"/>'
        + '<div class="match-info"><div class="match-name">' + esc(c.title || 'Listing') + '</div>'
        + '<div class="match-meta">' + esc(c.location || '')
        +   (c.distance_km != null ? ' · ' + c.distance_km + ' km away' : '')
        +   ' · ' + esc(c.beds || '?') + ' bed' + (String(c.beds) === '1' ? '' : 's')
        +   ' · ' + CB.money(c.price_night) + '/night</div></div>'
        + '<span class="match-tags">' + delta(c)
        +   '<span class="match-score">' + Math.round(c.score || 0) + '%</span></span></div>').join('')
    + '<div class="match-acts">'
    +   '<button class="match-decline" onclick="declineMatch(\'' + offer.id + '\')">'
    +     (byGuest ? 'Keep my booking' : 'Refund me instead') + '</button>'
    +   '<button class="match-accept" id="accept-' + b.id + '" disabled '
    +     'onclick="acceptMatch(\'' + offer.id + '\',\'' + b.id + '\')">'
    +     (byGuest ? 'Move me here' : 'Accept') + '</button>'
    + '</div>'
    + (byGuest
        ? '<div class="rehome-sub" style="margin-top:10px">You pay no more than you already have. '
          + 'Anything cheaper comes back to you.</div>'
        : '')
    + '</div>';
}

let MATCH_PICK = {};
function pickMatch(bookingId, listingId) {
  MATCH_PICK[bookingId] = listingId;
  document.querySelectorAll('#match-' + bookingId + ' .match-opt').forEach(el => {
    el.classList.toggle('on', el.dataset.listing === listingId);
  });
  const btn = $('accept-' + bookingId);
  if (btn) btn.disabled = false;
}

async function acceptMatch(offerId, bookingId) {
  const listingId = MATCH_PICK[bookingId];
  if (!listingId) return showToast('Pick a stay first');
  const btn = $('accept-' + bookingId);
  if (btn) { btn.disabled = true; btn.textContent = 'Moving you…'; }
  try {
    const r = await ApaTrust.match.accept(offerId, listingId);
    showToast(r.refund_due
      ? 'You\'re moved. ' + CB.money(r.refund_due) + ' is coming back to you.'
      : 'You\'re moved. Same dates, same price.', 5500);
    await refresh();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Accept'; }
    const said = {
      listing_unavailable:        'That one just got booked. Pick another.',
      listing_no_longer_available:'That one just got booked. Pick another.',
      offer_expired:              'This shortlist has expired. Ask again and we\'ll sweep afresh.',
      booking_already_resolved:   'This booking has already been settled. Refresh to see where you stand.',
      costs_more_than_original:   'That home costs more than the one you booked. We can only move you '
                                  + 'to somewhere at or below what you have already paid.',
      same_host_not_allowed:      'That belongs to the same host. We won\'t send you back there.',
    }[e.message];
    showToast(said || 'Something went wrong. Nothing has changed — try again.', 5500);
  }
}

async function declineMatch(offerId) {
  try {
    const r = await ApaTrust.match.decline(offerId);
    /* Two different "no thanks". The server tells us which one this
       was, so the toast never announces a refund on a booking that is
       still standing — or stay silent about one that has been cancelled. */
    showToast(r.booking_unchanged
      ? (r.message || 'Closed. Your original booking is exactly as it was.')
      : 'Refunded ' + CB.money(r.refund_amount) + ' in full.', 5000);
    await refresh();
  } catch (e) { showToast('Could not close that. Nothing has changed — we\'ve flagged it.'); }
}


/* ═══════════════════════════════════════════════════════════════
   REHOME · "Find me another home"
   ───────────────────────────────────────────────────────────────
   The guest's own door into the matching system. The host already
   has one ("I can't host this booking", on their side) — but the
   hosts who strand people are precisely the hosts who never press
   it, so a guest who cannot rely on that has to be able to start
   the same machinery themselves.

   WHAT PRESSING IT ACTUALLY DOES
     1. We ask the server whether this booking can be moved at all,
        and on what terms. Nothing about that decision happens here.
     2. We sweep every active listing for their dates, starting at
        ±10% of what they paid a night and widening only if that
        comes back empty, and rank by how closely each one matches
        what they originally chose.
     3. Every host on the shortlist is told a matched guest is
        looking at their place, so the room is not given away while
        the guest reads, and a message from them gets answered.
     4. The guest picks one through the ordinary flow, or closes the
        list and keeps the booking they have.

   WHAT THE GUEST TYPES DOES NOT DECIDE THE MONEY
     The reason box is recorded and read by a person. Fault comes
     from the record — a host cancellation, a suspension, an
     adjudicated check-in issue, a listing taken down — and only
     fault sets the terms. A text field that changes a refund is a
     text field that will be filled in to change a refund.

   TERMS, SHOWN BEFORE THEY COMMIT
     Not their fault    → same dates, SAME PRICE. A rise is ours; a
                          fall comes back to them.
     Their own choice   → only homes at or below what they already
                          paid, and the difference comes back. Twice
                          per booking, and not inside 24 hours of
                          check-in, where an arrival problem is the
                          right door and this one is not.
   ═══════════════════════════════════════════════════════════════ */

const REHOME_REASONS = [
  { key: 'host_cancelled',   h: 'My host cancelled or can\'t host me',
    p: 'They told me directly, or the booking was called off.' },
  { key: 'host_unreachable', h: 'I can\'t reach my host',
    p: 'No answer to calls or messages, and check-in is coming.' },
  { key: 'place_problem',    h: 'Something is wrong with the place',
    p: 'It isn\'t as listed, or it isn\'t usable.' },
  { key: 'changed_plans',    h: 'I\'d rather stay somewhere else',
    p: 'Nothing has gone wrong. I\'ve just changed my mind.' },
];

let REHOME_STATE = { bookingId: null, reason: null, veil: null };

function rhClose() {
  const v = REHOME_STATE.veil;
  if (!v) return;
  v.classList.remove('on');
  document.body.style.overflow = '';
  setTimeout(() => { if (v.parentNode) v.parentNode.removeChild(v); }, 300);
  REHOME_STATE = { bookingId: null, reason: null, veil: null };
}

function rhPickReason(key) {
  REHOME_STATE.reason = key;
  document.querySelectorAll('#rh-reasons .rh-r').forEach(el => {
    el.classList.toggle('on', el.dataset.key === key);
  });
  const go = document.getElementById('rh-go');
  if (go) go.disabled = false;
}

/* The terms, in the guest's own words, before they press anything.
   `blameless` comes from the server — the page never guesses it. */
function rhTerms(blameless) {
  return blameless
    ? '<b>Same dates, same price.</b> If the new place costs more, that is ours to cover. '
    + 'If it costs less, the difference comes back to you. There is no fee and no penalty, '
    + 'and you can keep your booking if you don\'t like the shortlist.'
    : '<b>We\'ll show you homes at or below what you\'ve already paid</b>, and refund you any '
    + 'difference. You can do this twice on a booking, and not inside 24 hours of check-in — '
    + 'if something has gone wrong at the door, use "There\'s an issue" instead and we\'ll '
    + 'deal with it straight away.';
}

async function openRehome(bookingId) {
  const b = allBookings.find(x => x.id === bookingId);
  if (!b) return;

  const btn = document.getElementById('rehome-btn-' + bookingId);
  if (btn) { btn.disabled = true; btn.textContent = 'Checking…'; }

  /* Ask first. A button that opens a sheet and then says "actually,
     no" has wasted the one thing a stressed guest has least of. */
  let elig = null;
  try {
    const res = await authFetch('/api/match-guest', { action: 'eligibility', booking_id: bookingId });
    elig = await res.json().catch(() => null);
  } catch (e) { /* fall through to the generic sheet */ }

  if (btn) {
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/>'
      + '<path d="M5 9.5V20h5v-6h4v6h5V9.5"/><path d="M16.5 5.5h5m0 0-2-2m2 2-2 2"/></svg>'
      + 'Find me another home';
  }

  if (elig && elig.can_request === false) {
    return showToast(RH_BLOCKED[elig.reason] || 'We can\'t move this booking right now. Talk to us and we\'ll sort it.', 6000);
  }

  const blameless = !!(elig && elig.blameless);

  const veil = document.createElement('div');
  veil.className = 'rh-veil';
  veil.innerHTML =
    '<div class="rh-sheet" role="dialog" aria-modal="true" aria-label="Find me another home">'
    + '<div class="rh-grip"></div>'
    + '<div class="rh-t">Let\'s find you somewhere else</div>'
    + '<div class="rh-s">We\'ll sweep every home available for your dates and rank them against '
    +   'the one you booked. Nothing changes until you choose one.</div>'
    + '<div class="rh-reasons" id="rh-reasons">'
    + REHOME_REASONS.map(r =>
        '<button type="button" class="rh-r" data-key="' + r.key + '" '
        + 'onclick="rhPickReason(\'' + r.key + '\')">'
        + '<span class="rh-r-dot"></span>'
        + '<span class="rh-r-txt"><span class="rh-r-h">' + esc(r.h) + '</span>'
        + '<span class="rh-r-p">' + esc(r.p) + '</span></span></button>').join('')
    + '</div>'
    + '<textarea class="rh-note" id="rh-note" rows="3" maxlength="500" '
    +   'placeholder="Anything we should know? A person reads this."></textarea>'
    + '<div class="rh-terms">' + rhTerms(blameless) + '</div>'
    + '<div class="rh-acts">'
    +   '<button class="rh-cancel" onclick="rhClose()">Not now</button>'
    +   '<button class="rh-go" id="rh-go" disabled onclick="rhSubmit()">Find me a home</button>'
    + '</div></div>';

  document.body.appendChild(veil);
  document.body.style.overflow = 'hidden';
  REHOME_STATE = { bookingId, reason: null, veil };

  veil.addEventListener('click', e => { if (e.target === veil) rhClose(); });
  document.addEventListener('keydown', function onEsc(e) {
    if (e.key === 'Escape') { rhClose(); document.removeEventListener('keydown', onEsc); }
  });

  requestAnimationFrame(() => requestAnimationFrame(() => veil.classList.add('on')));
}

/* Why a booking cannot be moved, said in a way that tells the guest
   what to do instead. "not_eligible" tells them nothing. */
const RH_BLOCKED = {
  cancelled:            'This booking is already cancelled. If money is still owed to you, it is on its way.',
  already_rehomed:      'You have already been moved on this booking. Check your bookings list for the new one.',
  already_checked_in:   'You are already checked in here. If something is wrong, use "There\'s an issue" and we\'ll act now.',
  nothing_paid:         'There is no payment on this booking yet, so there is nothing to move. Book somewhere else freely.',
  offer_already_open:   'You already have a shortlist open on this booking. Scroll up — it is on this page.',
  request_limit_reached:'You have asked to move this booking twice already. Message us and a person will sort it properly.',
  too_close_to_checkin: 'Check-in is under 24 hours away, so this is an arrival problem rather than a change of plan. Use "There\'s an issue" and we will deal with it now.',
};

async function rhSubmit() {
  const { bookingId, reason } = REHOME_STATE;
  if (!bookingId || !reason) return;

  const note = (document.getElementById('rh-note')?.value || '').trim().slice(0, 500);
  const sheet = REHOME_STATE.veil?.querySelector('.rh-sheet');
  if (sheet) {
    sheet.innerHTML =
      '<div class="rh-grip"></div>'
      + '<div class="rh-t">Sweeping every home for your dates</div>'
      + '<div class="rh-s">Matching on price, area, size and how the place has actually been '
      +   'reviewed. This takes a few seconds.</div>'
      + '<div class="rh-searching"><span class="rh-spin"></span>'
      +   '<span>Checking availability and telling the hosts you\'re looking…</span></div>';
  }

  try {
    const res = await authFetch('/api/match-guest', {
      action: 'guest-request', booking_id: bookingId,
      reason: reason + (note ? ' · ' + note : ''),
    });
    const j = await res.json().catch(() => ({}));

    if (!res.ok) {
      rhClose();
      return showToast(RH_BLOCKED[j.error] || j.message
        || 'That did not go through. Nothing has changed — try again in a moment.', 6000);
    }

    if (!j.found) {
      rhClose();
      return showToast(j.message
        || 'Nothing comparable is free for your dates. Your booking is unchanged.', 7000);
    }

    rhClose();
    showToast('Found ' + j.found + ' ' + (j.found === 1 ? 'home' : 'homes')
      + (j.hosts_notified ? ' · ' + j.hosts_notified + ' host'
          + (j.hosts_notified === 1 ? '' : 's') + ' notified' : '')
      + '. Take a look below.', 5500);
    await refresh();

    /* Put it where they are looking. */
    setTimeout(() => {
      const el = document.getElementById('match-' + bookingId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 420);
  } catch (e) {
    rhClose();
    showToast('We could not reach the matching service. Your booking is untouched — try again.', 6000);
  }
}

/* ═══════════════════════════════════════════════════════════════
   ISSUE
   ═══════════════════════════════════════════════════════════════ */
async function openIssue(bookingId) {
  const b = allBookings.find(x => x.id === bookingId);
  if (!b) return;
  if (!window.ApaTrust) return showToast('Support tools are still loading. One moment.');
  await ApaTrust.issue.open(b, async (result) => {
    if (result && result.redirect && result.refuge) {
      setTimeout(() => showToast('Moved to ' + result.refuge.title + '. Your ride is booked.'), 900);
    }
    await refresh();
  });
}

/* ═══════════════════════════════════════════════════════════════
   PRIVATE REVIEW
   Never published. The host sees it only once they've written theirs,
   so neither is writing a reply. It still moves the listing's rank.
   ═══════════════════════════════════════════════════════════════ */
function buildReviewPanel(b) {
  return '<div class="rev-prompt" id="rev-' + b.id + '">'
    + '<div class="rev-t">How was ' + esc(CB.title(b)) + '?</div>'
    + '<div class="rev-s">This stays between you, your host and us. It is never shown publicly, '
    +   'but it does decide where this listing ranks.</div>'
    + '<div class="rev-stars" id="stars-' + b.id + '">'
    + [1,2,3,4,5].map(n => '<span class="rev-star" data-n="' + n + '" onclick="setStars(\''
        + b.id + '\',' + n + ')">★</span>').join('')
    + '</div>'
    + '<textarea class="rev-body" id="revbody-' + b.id + '" rows="3" '
    +   'placeholder="What should the next guest know? What should the host know?"></textarea>'
    + '<button class="rev-send" id="revsend-' + b.id + '" disabled '
    +   'onclick="sendReview(\'' + b.id + '\')">Submit privately</button>'
    + '<div class="rev-priv">Private · revealed to each other only once you have both submitted</div>'
    + '</div>';
}

let REV_RATING = {};
function setStars(id, n) {
  REV_RATING[id] = n;
  document.querySelectorAll('#stars-' + id + ' .rev-star').forEach(s => {
    s.classList.toggle('on', Number(s.dataset.n) <= n);
  });
  const btn = $('revsend-' + id);
  if (btn) btn.disabled = false;
}

async function sendReview(bookingId) {
  const b   = allBookings.find(x => x.id === bookingId);
  const btn = $('revsend-' + bookingId);
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  try {
    await ApaTrust.review.submit(b, 'guest_to_host', {
      rating: REV_RATING[bookingId],
      body:   $('revbody-' + bookingId).value.trim(),
    });
    $('rev-' + bookingId).innerHTML =
      '<div class="rev-t">Thank you</div>'
      + '<div class="rev-s">Your host will see it once they\'ve written theirs.</div>';
    REVIEWED.add(bookingId);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Submit privately'; }
    showToast('Could not send. Try again.');
  }
}

/* ═══════════════════════════════════════════════════════════════
   CHECK-IN
   Every write carries the caller's token. The body is a claim; the
   header is the identity.
   ═══════════════════════════════════════════════════════════════ */
async function authFetch(url, body) {
  const { data } = await sb.auth.getSession();
  return fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: 'Bearer ' + (data.session?.access_token || ''),
    },
    body: JSON.stringify(body),
  });
}

async function verifyHostCode(table, reference, bookingId) {
  const input = $('host-code-' + bookingId);
  const btn   = document.querySelector('#card-' + bookingId + ' .ci-submit');
  const code  = input?.value?.trim().toUpperCase();

  if (!code || !code.startsWith('HOST')) {
    return showToast('Enter the HOST-XXXXXX code your host gives you');
  }
  if (btn) { btn.classList.add('loading'); btn.textContent = 'Verifying…'; }
  const done = () => { if (btn) { btn.classList.remove('loading'); btn.textContent = 'Confirm check-in'; } };

  try {
    const res  = await authFetch('/api/verify-checkin', { table, reference, role: 'guest', code });
    const data = await res.json().catch(() => ({}));
    done();

    /* 402: the code was right, the money wasn't. Say so plainly. A
       guest standing at a door should not have to guess. */
    if (res.status === 402 && data.error === 'balance_due') {
      showToast('Correct code, but ' + CB.money(data.balance_amount) + ' is still outstanding.', 5500);
      await refresh();
      setTimeout(() => payRest(bookingId), 800);
      return;
    }
    if (res.status === 409 && data.error === 'stay_ended') {
      showToast('These dates have already passed.', 5000);
      await refresh();
      return;
    }
    if (res.status === 401 && data.error === 'code_mismatch') {
      return showToast('That code doesn\'t match. Check with your host.', 4000);
    }
    if (!res.ok) {
      return showToast(data.message || data.error || 'Could not verify. Try again', 4000);
    }

    showToast(data.already ? 'Already checked in.' : 'Check-in confirmed. Enjoy your stay.', 5000);
    await refresh();
  } catch (err) {
    done();
    showToast('Network error. Please try again');
  }
}

function showToast(msg, dur = 3200) {
  const t = $('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), dur);
}
