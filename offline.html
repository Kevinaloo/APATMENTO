<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="apple-touch-icon" href="/cabana-apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-title" content="Cabana"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're offline: Cabana</title>
<meta name="description" content="You are currently offline. Reconnect to continue booking stays, flights, tours and more on Cabana: Kenya&#x27;s travel super-app."/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--violet:#7B2FF7;--lilac:#B8A4F4;--mint:#5EEAD4;--ink:#0A0A14;--ink-soft:#4A4C66;}
body{font-family:var(--font-body);background:#05060F;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;}
.ab{position:absolute;border-radius:50%;filter:blur(90px);opacity:.4;animation:drift 20s ease-in-out infinite;}
.ab-1{width:480px;height:480px;background:radial-gradient(circle,var(--violet),transparent 70%);top:-10%;left:-8%;}
.ab-2{width:400px;height:400px;background:radial-gradient(circle,var(--mint),transparent 72%);bottom:-8%;right:-6%;animation-delay:-10s;opacity:.25;}
@keyframes drift{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,-30px);}}
.card{position:relative;z-index:2;text-align:center;max-width:420px;}
.ico{width:96px;height:96px;margin:0 auto 28px;border-radius:28px;background:linear-gradient(135deg,#B8A4F4,#7B2FF7);display:flex;align-items:center;justify-content:center;animation:pulse 3s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(123,47,247,.4);}50%{box-shadow:0 0 0 20px rgba(123,47,247,0);}}
.ico svg{width:48px;height:48px;color:#fff;}
h1{font-family:var(--font-display);font-weight:300;font-size:36px;color:#fff;margin-bottom:10px;letter-spacing:-.02em;}
h1 em{font-style:italic;font-weight:500;background:linear-gradient(120deg,#B8A4F4,#5EEAD4);-webkit-background-clip:text;background-clip:text;color:transparent;}
p{font-size:15px;color:rgba(255,255,255,.5);margin-bottom:32px;line-height:1.6;}
.cached-links{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;}
.cached-link{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.8);text-decoration:none;font-size:14px;font-weight:500;transition:background .2s;}
.cached-link:hover{background:rgba(255,255,255,.1);}
.cached-link svg{width:18px;height:18px;flex-shrink:0;opacity:.7;}
.retry-btn{padding:14px 32px;border-radius:100px;background:linear-gradient(135deg,#B8A4F4,#7B2FF7);color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer;transition:transform .2s;box-shadow:0 8px 24px rgba(123,47,247,.35);}
.retry-btn:hover{transform:translateY(-2px);}
</style>
<link rel="stylesheet" href="/brand.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/cabana-ds.css"/>

  <link rel="canonical" href="https://cabana.africa/offline"/>

  <meta name="robots" content="noindex, nofollow"/>
</head>
<body>
<div class="aurora"><div class="ab ab-1"></div><div class="ab ab-2"></div></div>
<div class="card">
  <div class="ico">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
    </svg>
  </div>
  <h1>You're <em>offline</em></h1>
  <p>No internet connection right now. Here are the pages you've visited before. They work offline.</p>
  <div class="cached-links">
    <a href="/apartments" class="cached-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5M5 9.5V20h14V9.5M9 20v-5a3 3 0 0 1 6 0v5"/></svg>
      Browse Stays
    </a>
    <a href="/tours" class="cached-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5.5-6-2-6 2.5v13l6-2.5 6 2 6-2.5v-13zM9 3.5v13M15 7.5v13"/></svg>
      Browse Tours
    </a>
    <a href="/my-bookings" class="cached-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      My Bookings
    </a>
  </div>
  <button class="retry-btn" onclick="window.location.reload()">Try again</button>
</div>
<script src="/brand.js" defer></script>
<script src="/cabana-rebrand.js" defer></script>
<script src="/apa-contact.js" defer></script>
</body>
</html>
