name: Android app bundle

# Builds the signed Play Store bundle from android/twa-manifest.json.
# Manual only: a bundle is built when someone decides to ship one.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64      base64 of signing.keystore (the PWABuilder upload key)
#   ANDROID_KEYSTORE_PASSWORD    its store password
#   ANDROID_KEY_PASSWORD         its key password (PWABuilder uses the same one)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cabana-android-sdk
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: cabana-android-${{ hashFiles('android/build-aab.sh', 'android/modernize-project.mjs') }}
      - name: Restore the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 secret first (see android/README.md)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
      - name: Build, sign and check the bundle
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/upload.keystore
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: android/build-aab.sh "$RUNNER_TEMP/dist"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: cabana-android-bundle
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 30
