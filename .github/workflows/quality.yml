name: Quality and security gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:syntax
      - run: npm test
      - name: Verify SEO build and index integrity
        run: |
          python3 seo/run_all.py
          git diff --exit-code
      - name: Reject committed private keys and service-role assignments
        shell: bash
        run: |
          if git grep -nE -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*[^[:space:]#]+' -- . ':!package-lock.json'; then
            echo 'Potential secret committed to the repository.' >&2
            exit 1
          fi
