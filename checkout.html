body{padding-bottom:110px;}
@media(min-width:960px){body{padding-bottom:40px;}}

.head{padding-top:clamp(26px,4vw,50px);padding-bottom:clamp(18px,2.4vw,28px);}
.head-k{display:flex;align-items:center;gap:10px;color:var(--brass);margin-bottom:14px;}
.head-k svg{width:16px;height:16px;}
.head-rule{width:clamp(24px,4vw,56px);height:1px;background:var(--rule-brass);}
.order-title{font-family:var(--fd);font-weight:400;font-size:clamp(30px,4.6vw,54px);line-height:1.02;
  letter-spacing:-.038em;margin-bottom:14px;max-width:18ch;text-wrap:balance;}
.order-title em{font-style:italic;font-weight:500;color:var(--ember-lit);}
.head-say{font-size:clamp(14.5px,1.2vw,16px);line-height:1.7;color:var(--bone-72);max-width:60ch;}
.head-say b{color:var(--bone);font-weight:600;}
.head .journey{margin-top:clamp(20px,2.6vw,30px);}

.deck{display:grid;grid-template-columns:1fr;gap:clamp(20px,3vw,32px);padding-bottom:clamp(50px,7vw,90px);align-items:start;}
@media(min-width:960px){.deck{grid-template-columns:minmax(0,1fr) minmax(320px,.52fr);gap:clamp(26px,3.2vw,46px);}
  .rail-col{position:sticky;top:78px;}}

/* one kitchen */
.tick{border:1px solid var(--rule-2);border-radius:var(--r2);overflow:hidden;background:rgba(244,234,220,.022);
  transition:border-color .35s,opacity .35s;}
.tick+.tick{margin-top:clamp(14px,2vw,20px);}
.tick.fail{border-color:rgba(210,85,79,.5);}
.tick.done{border-color:rgba(127,162,105,.45);}
.tick-head{display:flex;align-items:center;gap:13px;padding:15px 18px;border-bottom:1px solid var(--rule);}
.tick-ph{width:52px;height:52px;border-radius:11px;flex-shrink:0;object-fit:cover;background:var(--ink-3);border:1px solid var(--rule);}
.tick-ph.ph{display:grid;place-items:center;color:var(--bone-16);}
.tick-ph.ph svg{width:24px;height:24px;}
.tick-id{flex:1;min-width:0;}
.tick-n{font-family:var(--fd);font-weight:500;font-size:20px;letter-spacing:-.03em;line-height:1.15;color:var(--bone);text-decoration:none;display:block;}
a.tick-n:hover{color:var(--brass-lit);}
.tick-w{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--bone-48);margin-top:5px;}
.tick-w svg{width:12px;height:12px;flex-shrink:0;}
.tick-w .o{color:var(--bay);} .tick-w .c{color:var(--rust);}
.tick-drop{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;cursor:pointer;
  border:1px solid transparent;background:transparent;color:var(--bone-30);transition:.2s;}
.tick-drop:hover{color:var(--red);border-color:rgba(210,85,79,.35);background:rgba(210,85,79,.08);}
.tick-drop svg{width:14px;height:14px;}
.lines{padding:4px 0;}
.ln-x{border:none;background:none;color:var(--red);cursor:pointer;font-size:11.5px;font-family:var(--fm);
  letter-spacing:.1em;text-transform:uppercase;padding:6px 0;}
.tick .seg{padding:14px 18px 0;}
.tick-note{padding:14px 18px 0;}
.tick-note textarea{min-height:44px;font-size:13.5px;}
.tick .sums{padding:14px 18px 16px;}
.tick .flag{margin:0 18px 14px;}
@media(max-width:520px){
  .ln{flex-wrap:wrap;gap:10px;}
  .ln-b{flex:1 1 calc(100% - 60px);}
  .step{margin-left:58px;}
  .ln-p{margin-left:auto;width:auto;}
}

.locate{display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:8px 12px;border-radius:9px;
  border:1px solid var(--rule-2);background:transparent;color:var(--bone-72);cursor:pointer;font-size:12.5px;transition:.2s;}
.locate:hover{border-color:var(--rule-brass);color:var(--brass-lit);}
.locate svg{width:14px;height:14px;}
.locate.on{color:var(--bay);border-color:rgba(127,162,105,.4);}

.when-pick{margin-top:12px;}

/* the docket */
.docket{border:1px solid var(--rule-2);border-bottom:none;border-radius:var(--r2) var(--r2) 0 0;
  background:linear-gradient(180deg,rgba(244,234,220,.045),rgba(244,234,220,.012));box-shadow:var(--sink);overflow:hidden;}
.docket-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 18px;border-bottom:1px solid var(--rule);}
.docket-head .mono{color:var(--bone-48);}
.docket-clock{font-family:var(--fm);font-size:11px;font-weight:500;letter-spacing:.14em;color:var(--brass);font-variant-numeric:tabular-nums;}
.led{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:13px 18px;border-bottom:1px solid var(--rule);}
.led-k{font-size:13px;line-height:1.4;color:var(--bone-72);}
.led-k small{display:block;font-size:11.5px;color:var(--bone-30);margin-top:3px;}
.led-v{font-family:var(--fm);font-weight:500;font-size:15px;color:var(--bone);font-variant-numeric:tabular-nums;flex-shrink:0;}
.led.grand{background:rgba(222,82,25,.07);padding-block:17px;}
.led.grand .led-k{color:var(--bone);font-weight:600;}
.led.grand .led-v{font-family:var(--fd);font-size:27px;font-weight:600;letter-spacing:-.035em;color:var(--ember-lit);}
.led.keep .led-k{color:var(--bone);} .led.keep .led-v{color:var(--bay);}
.docket-foot{padding:16px 18px 20px;}
#sendBtn{white-space:normal;text-align:center;line-height:1.45;}
.docket-note{font-size:12px;line-height:1.6;color:var(--bone-30);margin-top:12px;}
.docket-perf{height:11px;background-color:var(--ink-2);border-inline:1px solid var(--rule-2);
  background-image:radial-gradient(circle at 7px 11px,var(--ink) 6.4px,transparent 6.9px);
  background-size:14px 11px;background-repeat:repeat-x;}
.trust{margin-top:18px;padding:16px 18px;border-radius:var(--r2);border:1px solid var(--rule);background:rgba(244,234,220,.016);}
.trust-r{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;line-height:1.6;color:var(--bone-48);}
.trust-r+.trust-r{margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);}
.trust-r svg{width:14px;height:14px;flex-shrink:0;margin-top:2px;color:var(--bay);}
.trust-r b{color:var(--bone-72);font-weight:600;}

/* the bar, on a phone */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:130;padding:12px var(--gut) calc(12px + env(safe-area-inset-bottom));
  background:rgba(13,7,4,.94);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-top:1px solid var(--rule-2);display:flex;align-items:center;gap:14px;transform:translateY(120%);transition:transform .42s var(--ease);}
.bar.up{transform:none;}
@media(min-width:960px){.bar{display:none;}}
.bar-s{flex:1;min-width:0;}
.bar-l{font-family:var(--fm);font-size:9px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-30);margin-bottom:3px;}
.bar-v{font-family:var(--fd);font-weight:600;font-size:21px;letter-spacing:-.03em;color:var(--bone);}

/* sending */
.sending{position:fixed;inset:0;z-index:950;display:grid;place-items:center;padding:24px;
  background:rgba(8,4,2,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.sending-in{width:min(420px,100%);text-align:center;}
.sending h3{font-family:var(--fd);font-weight:400;font-size:28px;letter-spacing:-.03em;margin:22px 0 8px;}
.sending p{color:var(--bone-48);font-size:14px;line-height:1.6;}
.sending ul{margin-top:22px;text-align:left;border:1px solid var(--rule);border-radius:var(--r2);overflow:hidden;}
.sending li{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:13.5px;}
.sending li+li{border-top:1px solid var(--rule);}
.sending li .s{margin-left:auto;font-family:var(--fm);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-30);}
.sending li.ok .s{color:var(--bay);} .sending li.bad .s{color:var(--red);}
.pulse{width:84px;height:84px;margin:0 auto;border-radius:50%;display:grid;place-items:center;color:var(--ember-lit);
  background:radial-gradient(circle,rgba(222,82,25,.24),transparent 70%);animation:breathe 1.8s ease-in-out infinite;}
.pulse svg{width:38px;height:38px;}
@keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
</style>

/* ═══════════════════════════════════════════════════════════════
   CABANA · CHECKOUT
   This page turns a basket into orders a kitchen can answer.

   Each kitchen in the basket becomes one order request, sent to
   that kitchen on Cabana. The kitchen accepts it with a time, or
   declines it with a reason, and the diner watches that happen on
   the live order page this checkout hands them to. Nothing is paid
   here: Cabana takes no commission and holds no money, so the diner
   pays the kitchen directly, by M-Pesa or cash, when the food is in
   their hands.

   Prices are re-read from the kitchen's live menu before anything is
   sent, and the server prices every line again from that same menu,
   so the total on this page is the total the kitchen sees.
   ═══════════════════════════════════════════════════════════════ */

function toast(m,bad){

  t.textContent=m; t.className='toast up'+(bad?' bad':'');
  clearTimeout(t._x); t._x=setTimeout(function(){t.className='toast'+(bad?' bad':'');},4200);
}

/* ═══════ LIVE MENU ═══════
   A basket can be twelve hours old. Before anything is sent, read
   what the kitchen is charging and serving right now. */
function refreshLive(){
  if(!SB) return Promise.resolve();
  var groups=Cart.groups(); if(!groups.length) return Promise.resolve();
  var kids=groups.map(function(g){return g.id;});
  var iids=[]; groups.forEach(function(g){ g.items.forEach(function(i){ iids.push(i.id); }); });
  return Promise.all([
    SB.from('restaurant_profiles').select('*').in('listing_id',kids),
    SB.from('menu_items').select('id,listing_id,name,price,promo_price,promo_until,is_available,sold_out_until,photo').in('id',iids),
    SB.from('listings').select('id,title,is_active,deleted_at,area,city,photos').in('id',kids)
  ]).then(function(r){
    kids.forEach(function(id){ LIVE[id]={p:null,items:{},listing:null,loaded:true}; });
    (r[0].data||[]).forEach(function(p){ if(LIVE[p.listing_id]) LIVE[p.listing_id].p=p; });
    (r[1].data||[]).forEach(function(m){ if(LIVE[m.listing_id]) LIVE[m.listing_id].items[m.id]=m; });
    (r[2].data||[]).forEach(function(l){ if(LIVE[l.id]) LIVE[l.id].listing=l; });
    /* keep the basket's copy honest too, so the drawer on other pages agrees */
    groups.forEach(function(g){
      var raw=Cart.raw().kitchens[g.id]; if(!raw) return;
      var L=LIVE[g.id], p=L.p;
      if(p){
        ['delivery_fee','min_order','delivery_mins','prep_mins','opens_at','closes_at','open_days',
         'serves_delivery','serves_pickup','serves_dine_in'].forEach(function(k){ if(p[k]!==undefined) raw[k]=p[k]; });
        if(p.hero_photo&&!raw.photo) raw.photo=p.hero_photo;
      }
      Object.keys(raw.items||{}).forEach(function(iid){
        var m=L.items[iid]; if(!m) return;
        raw.items[iid].name=m.name||raw.items[iid].name;
        raw.items[iid].price=Number(m.price)||0;
        var promo=m.promo_price!=null&&(!m.promo_until||new Date(m.promo_until)>new Date());
        raw.items[iid].promo_price=promo?Number(m.promo_price):null;
        if(m.photo) raw.items[iid].photo=m.photo;
        raw.items[iid].thin=false;
      });
      /* a mode the kitchen no longer offers cannot stay chosen */
      var mode=Cart.mode(g.id);
      var map={delivery:'serves_delivery',pickup:'serves_pickup',dine_in:'serves_dine_in'};
      if(raw[map[mode]]===false){ delete raw.mode; }
    });
    try{ localStorage.setItem('cabana-cart',JSON.stringify(Cart.raw())); }catch(e){}
  }).catch(function(e){ console.warn('[checkout] live read',e); });
}

/* is a dish still orderable right now */
function gone(gid,iid){
  var L=LIVE[gid]; if(!L||!L.loaded) return false;
  var m=L.items[iid];
  if(!m) return 'Off the menu';
  if(m.is_available===false) return 'Unavailable';
  if(m.sold_out_until&&new Date(m.sold_out_until)>new Date()) return 'Sold out today';
  return false;
}
function kitchenBlock(gid){
  var L=LIVE[gid]; if(!L||!L.loaded) return null;
  var l=L.listing, p=L.p||{};
  if(!l||l.deleted_at||l.is_active===false) return 'This kitchen is not taking orders on Cabana right now.';
  if(p.accepts_orders===false) return 'This kitchen has switched online ordering off for now.';
  if(p.orders_paused_until&&new Date(p.orders_paused_until)>new Date())
    return 'This kitchen is full and paused new orders until '+Orders.clock(p.orders_paused_until)+'.';
  return null;
}
/* the numbers, from the live menu when we have it */
function cost(g){
  var items=g.items.map(function(i){
    var off=gone(g.id,i.id);
    return { id:i.id, name:i.name, qty:i.qty, price:i.price, promo_price:i.promo_price,
             unit:i.unit, line:off?0:i.line, photo:i.photo, off:off };
  });
  var sub=items.reduce(function(a,i){return a+i.line;},0);
  var fee=g.mode==='delivery'&&g.delivery_fee!=null?Number(g.delivery_fee):0;
  var short=g.mode==='delivery'&&g.min_order!=null&&sub<Number(g.min_order)?Number(g.min_order)-sub:0;
  return { items:items, sub:sub, fee:fee, total:sub+fee, short:short,
    live:items.filter(function(i){return !i.off;}), count:items.reduce(function(a,i){return a+(i.off?0:i.qty);},0) };
}

function shortName(s){ s=String(s||'the kitchen'); return s.length>22?s.slice(0,20)+'…':s; }
function respondMins(){
  var m=12; Cart.groups().forEach(function(g){ var p=LIVE[g.id]&&LIVE[g.id].p; if(p&&p.respond_mins) m=Math.max(3,Math.min(m,p.respond_mins)); });

/* hours, read from the live profile */
var DAYS=['sun','mon','tue','wed','thu','fri','sat'];
function mins(t){ var m=/^(\d{1,2}):(\d{2})/.exec(t||''); return m?(+m[1])*60+(+m[2]):null; }
function prof(gid){ var L=LIVE[gid]; return (L&&L.p)||Cart.raw().kitchens[gid]||{}; }
function isOpen(gid){
  var p=prof(gid), o=mins(p.opens_at), c=mins(p.closes_at);
  var now=new Date(), day=DAYS[now.getDay()], nm=now.getHours()*60+now.getMinutes();
  var days=p.open_days&&p.open_days.length?p.open_days:DAYS;
  if(days.indexOf(day)===-1) return false;
  if(o==null||c==null) return null;
  return c>o?(nm>=o&&nm<c):(nm>=o||nm<c);
}
function nextOpen(gid){
  var p=prof(gid), o=mins(p.opens_at); if(o==null) return null;
  var days=p.open_days&&p.open_days.length?p.open_days:DAYS;
  for(var add=0;add<8;add++){
    var d=new Date(); d.setDate(d.getDate()+add); d.setHours(Math.floor(o/60),o%60+15,0,0);
    if(d<=new Date(Date.now()+15*60e3)) continue;
    if(days.indexOf(DAYS[d.getDay()])>-1) return d;
  }
  return null;
}
function pretty(iso){
  var d=new Date(iso), now=new Date();
  var t=d.getHours()%12||12; var mm=d.getMinutes();
  var s=t+(mm?':'+String(mm).padStart(2,'0'):'')+(d.getHours()>=12?'pm':'am');
  var tom=new Date(); tom.setDate(tom.getDate()+1);
  if(d.toDateString()===now.toDateString()) return 'today '+s;
  if(d.toDateString()===tom.toDateString()) return 'tomorrow '+s;
  return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+' '+s;
}
function localIso(d){
  var z=function(n){return String(n).padStart(2,'0');};
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes());
}

/* ═══════ WIRE ═══════ */
function wire(){
  document.querySelectorAll('[data-b]').forEach(function(b){
    b.addEventListener('click',function(){ delete FAIL[b.dataset.k]; Cart.bump(b.dataset.k,b.dataset.i,Number(b.dataset.b)); });
  });
  document.querySelectorAll('[data-mode]').forEach(function(b){
    b.addEventListener('click',function(){ delete FAIL[b.dataset.k]; Cart.setMode(b.dataset.k,b.dataset.mode); });
  });
  document.querySelectorAll('[data-drop]').forEach(function(b){
    b.addEventListener('click',function(){ delete FAIL[b.dataset.drop]; Cart.clearKitchen(b.dataset.drop); });
  });
  document.querySelectorAll('[data-prune]').forEach(function(b){
    b.addEventListener('click',function(){
      var gid=b.dataset.prune, g=Cart.group(gid); if(!g) return;
      g.items.forEach(function(i){ if(gone(gid,i.id)) Cart.remove(gid,i.id); });
    });
  });
  document.querySelectorAll('[data-schedule]').forEach(function(b){
    b.addEventListener('click',function(){ setExtra({when:b.dataset.schedule}); render(); toast('Scheduled for '+pretty(b.dataset.schedule)+'.'); });
  });
  document.querySelectorAll('[data-note]').forEach(function(ta){
    grow(ta);
    ta.addEventListener('input',function(){ grow(ta); clearTimeout(ta._t);
      ta._t=setTimeout(function(){ quiet(function(){Cart.setNote(ta.dataset.note,ta.value);}); },300); });
    ta.addEventListener('blur',function(){ quiet(function(){Cart.setNote(ta.dataset.note,ta.value);}); });
  });
  [['dName','name'],['dPhone','phone'],['dAddr','address']].forEach(function(pair){
    var el=document.getElementById(pair[0]); if(!el) return;
    var save=function(){ var d={}; d[pair[1]]=el.value; quiet(function(){Cart.setDiner(d);}); };
    el.addEventListener('input',function(){ el.classList.remove('bad'); clearTimeout(el._t); el._t=setTimeout(save,260); });
    el.addEventListener('blur',save);
  });
  [['dNote','address_note'],['dTable','table']].forEach(function(pair){
    var el=document.getElementById(pair[0]); if(!el) return;
    el.addEventListener('input',function(){ var o={}; o[pair[1]]=el.value; setExtra(o); });
  });
  var loc=document.getElementById('locBtn');
  if(loc) loc.addEventListener('click',locate);

  document.querySelectorAll('[data-when]').forEach(function(b){
    b.addEventListener('click',function(){
      if(b.dataset.when==='now'){ setExtra({when:null}); render(); return; }
      document.querySelectorAll('[data-when]').forEach(function(x){x.classList.toggle('on',x===b);});
      var pick=document.getElementById('whenPick'); pick.hidden=false;
      var inp=document.getElementById('dWhen');
      if(!inp.value) inp.value=localIso(new Date(Date.now()+60*60e3));
      setExtra({when:new Date(inp.value).toISOString()});
      inp.focus();
    });
  });
  var dw=document.getElementById('dWhen');
  if(dw) dw.addEventListener('change',function(){ if(dw.value){ setExtra({when:new Date(dw.value).toISOString()}); render(); } });
  document.querySelectorAll('[data-pay]').forEach(function(b){
    b.addEventListener('click',function(){ setExtra({pay:b.dataset.pay}); render(); });
  });
  var send=document.getElementById('sendBtn');
  if(send) send.addEventListener('click',sendAll);
}
function grow(ta){ ta.style.height='auto'; ta.style.height=Math.min(200,ta.scrollHeight)+'px'; }
var MUTED=false;
function quiet(fn){ MUTED=true; try{fn();}finally{MUTED=false;} }

function locate(){
  var b=document.getElementById('locBtn');
  if(!navigator.geolocation){ toast('Location is not available on this device. Type the address instead.',true); return; }
  b.innerHTML=mk('locate',1.6)+'Finding you…';
  navigator.geolocation.getCurrentPosition(function(p){
    setExtra({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)});
    b.classList.add('on'); b.innerHTML=mk('check',1.8)+'Pin dropped for the rider';
    toast('Pin dropped. The rider gets a map to your door.');
  },function(){
    b.innerHTML=mk('locate',1.6)+'Drop a pin at my location';
    toast('We could not read your location. Type the address and directions instead.',true);
  },{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}

/* ── is everything a kitchen needs here ── */
function detailsOk(){
  var name=document.getElementById('dName'), phone=document.getElementById('dPhone'), addr=document.getElementById('dAddr');
  var bad=null, why='';
  if(!name.value.trim()||name.value.trim().length<2){ name.classList.add('bad'); bad=bad||name; why=why||'Add the name the kitchen should call out.'; }
  var digits=phone.value.replace(/\D/g,'');
  if(digits.length<9||digits.length>15){ phone.classList.add('bad'); bad=bad||phone; why=why||'Add a phone number the kitchen and rider can reach.'; }
  if(addr&&addr.value.trim().length<6){ addr.classList.add('bad'); bad=bad||addr; why=why||'Add where the rider should bring it.'; }
  if(bad){
    bad.scrollIntoView({behavior:'smooth',block:'center'});
    setTimeout(function(){bad.focus();},420);
    toast(why,true);
    return false;
  }
  Cart.setDiner({name:name.value.trim(),phone:phone.value.trim(),address:addr?addr.value.trim():Cart.diner().address});
  return true;
}

/* ═══════ SEND ═══════ */
function sendAll(){
  if(SENDING) return;
  if(!detailsOk()) return;
  var groups=Cart.groups();
  var ready=groups.filter(function(g){
    var c=cost(g);
    return !kitchenBlock(g.id)&&c.live.length&&!c.short;
  });
  var skipped=groups.length-ready.length;
  if(!ready.length){
    var first=groups[0];
    document.getElementById('k-'+first.id).scrollIntoView({behavior:'smooth',block:'center'});
    toast('Fix the kitchen marked in red before sending.',true);
    return;
  }
  var x=extra(), basket=Orders.uuid(), who=Cart.diner();
  var when=x.when&&new Date(x.when)>new Date(Date.now()+10*60e3)?x.when:null;
  SENDING=true;

  var ov=document.createElement('div');
  ov.className='sending'; ov.setAttribute('role','alertdialog'); ov.setAttribute('aria-live','polite');
  ov.innerHTML='<div class="sending-in"><div class="pulse">'+mk('cloche',1.3)+'</div>'
    +'<h3>Sending your order</h3><p>Handing '+(ready.length===1?'it':'each ticket')+' to the kitchen.</p>'
    +'<ul>'+ready.map(function(g){return '<li data-s="'+attr(g.id)+'">'+esc(g.name)+'<span class="s">Sending</span></li>';}).join('')+'</ul></div>';
  document.body.appendChild(ov);

  var placed=[];
  var chain=Promise.resolve();
  ready.forEach(function(g){
    chain=chain.then(function(){
      var c=cost(g);
      var payload={
        listing_id:g.id, mode:g.mode, basket:basket,
        items:c.live.map(function(i){return {id:i.id,qty:i.qty};}),
        name:who.name, phone:who.phone,
        address:g.mode==='delivery'?who.address:null,
        address_note:g.mode==='delivery'?(x.address_note||null):null,
        lat:g.mode==='delivery'?(x.lat||null):null, lng:g.mode==='delivery'?(x.lng||null):null,
        table_label:g.mode==='dine_in'?(x.table||null):null,
        note:g.note||null, scheduled_for:when, pay_method:x.pay||'mpesa'
      };
      var li=ov.querySelector('[data-s="'+g.id+'"]');
      return Orders.place(payload).then(function(r){
        placed.push(r); delete FAIL[g.id];
        li.classList.add('ok'); li.querySelector('.s').textContent='Sent · '+r.ref;
        quiet(function(){ Cart.clearKitchen(g.id); });
        try{ gtag('event','food_order_sent',{value:r.total,currency:r.currency,kitchen:g.name}); }catch(e){}
      }).catch(function(e){
        FAIL[g.id]=Orders.explain(e);
        li.classList.add('bad'); li.querySelector('.s').textContent='Not sent';
      });
    });
  });

  chain.then(function(){
    SENDING=false;
    var failed=Object.keys(FAIL).length;
    if(placed.length&&!failed&&!skipped){
      var dest=placed.length===1
        ? '/order?ref='+encodeURIComponent(placed[0].ref)+'&t='+encodeURIComponent(placed[0].token)+'&new=1'
        : '/order?basket='+encodeURIComponent(basket)+'&new=1';
      setTimeout(function(){ location.href=dest; },650);
      return;
    }
    setTimeout(function(){
      ov.remove(); render();
      if(placed.length){
        toast(placed.length+(placed.length===1?' order sent':' orders sent')+'. Fix the rest and send again.');
      } else {
        toast('Nothing was sent. See the note on the order.',true);
      }
    },900);
  });
}

/* ═══════ BAR / MINE / CLOCK ═══════ */
function paintBar(){
  var t=totals(), bar=document.getElementById('bar');
  bar.classList.toggle('up',t.count>0);
  document.getElementById('barL').textContent=t.count+(t.count===1?' item':' items')+' · '+t.kitchens+(t.kitchens===1?' kitchen':' kitchens');
  document.getElementById('barV').textContent=money(t.total,t.currency);
}
function paintMine(){
  var live=Orders.local().filter(function(o){ return Date.now()-o.at<6*3600e3; });
  var a=document.getElementById('myOrders');
  if(!live.length){ a.hidden=true; return; }
  a.hidden=false;
  a.href='/order?ref='+encodeURIComponent(live[0].ref)+'&t='+encodeURIComponent(live[0].token);
  document.getElementById('myOrdersN').textContent=live.length===1?'Your order':live.length+' orders';
}
function tick(){
  var el=document.getElementById('clock'); if(!el) return;
  var d=new Date(); el.textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}

document.getElementById('barGo').addEventListener('click',function(){
  var s=document.getElementById('sendBtn'); if(s) sendAll();
});

Cart.onChange(function(){ if(!MUTED&&!SENDING) render(); });

var from=new URLSearchParams(location.search).get('from');
if(from) document.getElementById('backBtn').href='/restaurant?id='+encodeURIComponent(from);

render();
refreshLive().then(function(){ if(!SENDING) render(); });
tick(); setInterval(tick,20000);
setInterval(function(){ if(!MUTED&&!SENDING&&document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='INPUT') refreshLive().then(render); },180000);
</script>
