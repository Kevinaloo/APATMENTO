.ab-3{width:360px;height:360px;background:radial-gradient(circle,#6BCB77,transparent 70%);top:40%;left:50%;animation-delay:-7s;opacity:.12;}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(28px,-18px) scale(1.05);}}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:200;height:64px;background:rgba(252,252,253,.88);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;}

.shell{display:flex;flex:1;position:relative;z-index:2;}

.sb-link{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:13px;font-size:13px;font-weight:500;color:var(--ink-soft);text-decoration:none;cursor:pointer;transition:all .2s;position:relative;}
.sb-link svg{width:17px;height:17px;flex-shrink:0;opacity:.7;}
.sb-link:hover{background:rgba(45,212,191,.07);color:var(--ink);}
.sb-link.active{background:linear-gradient(135deg,rgba(199,125,255,.15),rgba(77,150,255,.08));color:#7B2FF7;font-weight:700;}

.sb-link.active::before{content:'';position:absolute;left:0;top:25%;bottom:25%;width:3px;border-radius:2px;background:linear-gradient(180deg,#C77DFF,#4D96FF);}
.sb-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);}
.sb-link.danger{color:var(--err);}

/* MAIN */
.main{flex:1;padding:32px 28px 60px;max-width:900px;}

.page-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mint-dark);display:block;margin-bottom:8px;}
