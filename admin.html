<!DOCTYPE html>
<html lang="en" data-surface="console">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#07080C"/>
<meta name="color-scheme" content="dark light"/>
<meta name="description" content="Cabana operations console"/>
<title>Cabana Console</title>
<link rel="canonical" href="https://cabana.africa/admin"/>
<link rel="icon" type="image/png" href="/cabana-icon-96-v2.png"/>
<link rel="apple-touch-icon" href="/cabana-apple-touch-icon.png"/>
<script>
  /* Paint in the operator's chosen theme from the first frame. */
  try { if (JSON.parse(localStorage.getItem('cx-theme')) === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preconnect" href="https://gfwgbgdvxtocwhilrtdw.supabase.co" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/admin-console.css"/>
<link rel="stylesheet" href="/cabana-rides-admin.css?v=3"/>
<link rel="stylesheet" href="/cabana-offers.css"/>
<link rel="stylesheet" href="/admin-ads.css?v=1"/>
</head>
<body class="cx">

<!-- Opening splash: shown until the session is known -->
<div class="boot" id="boot" aria-hidden="true"><div class="boot-in"><div class="boot-mark"><img src="/cabana-emblem.png" alt=""/></div><div class="boot-bar"></div></div></div>

<!-- ─── SIGN-IN GATE ─────────────────────────────────────────────── -->
<div class="gate hide" id="gate">
  <div class="gate-card">
    <div class="gate-mark"><img src="/cabana-emblem.png" alt="Cabana"/></div>
    <h1>Cabana Console</h1>
    <p class="gate-sub">The operations office for Cabana. Sign in with your operator account.</p>
    <form id="gate-form" autocomplete="on" novalidate>
      <div class="fld"><label class="sr" for="g-email">Email</label><input class="inp" id="g-email" name="email" type="email" placeholder="you@cabana.africa" autocomplete="username" required/></div>
      <div class="fld" style="position:relative"><label class="sr" for="g-pass">Password</label><input class="inp" id="g-pass" name="password" type="password" placeholder="Password" autocomplete="current-password" required style="padding-right:64px"/>
        <button type="button" id="g-show" class="btn btn-q btn-sm" style="position:absolute;right:6px;top:8px;width:auto;height:28px">Show</button></div>
      <button class="btn btn-p" id="g-btn" type="submit">Sign in</button>
      <div class="gate-or">or</div>
      <button class="btn btn-g" id="g-google" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="M21.35 11.1H12v2.9h5.35c-.23 1.4-1.66 4.1-5.35 4.1a6.1 6.1 0 1 1 0-12.2c1.9 0 3.2.8 3.9 1.5l2.66-2.56A9.3 9.3 0 0 0 12 2.3a9.7 9.7 0 1 0 0 19.4c5.6 0 9.3-3.94 9.3-9.48 0-.64-.07-1.12-.15-1.62z"/></svg>Continue with Google</button>
    </form>
    <div id="gate-who" class="hide"></div>
    <div class="gate-err" id="gate-err" role="alert" aria-live="polite"></div>
    <div class="gate-foot"><span>Access is checked against the operator roster on every request.</span><a href="/">cabana.africa</a></div>
  </div>
</div>

<!-- ─── CONSOLE ──────────────────────────────────────────────────── -->
<div class="app hide" id="app">
  <aside class="side" aria-label="Console navigation">
    <div class="side-brand">
      <span class="brand-mark"><img src="/cabana-emblem.png" alt=""/></span>
      <div><div class="brand-t">Cabana</div><div class="brand-s">Operations</div></div>
    </div>
    <nav class="side-nav" id="nav"></nav>
    <div class="side-foot"><div class="me" id="me" role="button" tabindex="0" aria-label="Account menu"></div></div>
  </aside>
  <div class="side-scrim" id="side-scrim"></div>

  <main class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button class="icon-btn collapse-btn" id="collapse-btn" aria-label="Collapse sidebar" title="Collapse sidebar ( [ )"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M9 3v18"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <button class="top-search" id="search-btn" type="button" aria-label="Search and commands">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="full">Search members, listings, bookings…</span><kbd>⌘K</kbd>
      </button>
      <div class="top-act">
        <span class="live stale" id="live" title="Connecting"><i></i><span>Connecting</span></span>
        <button class="icon-btn top-hide-m" id="preview-btn" aria-label="Preview the live site" title="Preview the live site"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="icon-btn" id="theme-btn" aria-label="Toggle theme" title="Toggle theme (t)"></button>
        <button class="icon-btn top-hide-m" id="refresh-btn" aria-label="Refresh" title="Refresh (r)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
        <button class="icon-btn" id="bell-btn" aria-label="Inbox" title="Inbox"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="dot hide" id="bell-dot"></span></button>
      </div>
    </header>

    <div class="stage">
      <div class="view" id="view"></div>

      <!-- Desk modules keep their own renderers; the console hosts them. -->
      <div class="view hide" id="desks">
        <section class="desk-host hide" id="s-flights"></section>
        <section class="desk-host hide" id="s-tours"></section>
        <section class="desk-host hide" id="s-events"></section>
        <section class="desk-host hide" id="s-transport"><div id="rides-admin-root"></div></section>
        <section class="desk-host hide" id="s-offers">
          <div class="page-hd"><div><div class="eyebrow">Operations</div><h1>Offers</h1><p class="lede">Campaigns and invitations hosts can join — discounts, getaways and seasonal deals.</p></div></div>
          <div id="admin-offers"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/vendor-supabase-2.112.3.js"></script>
<script src="/apa-session.js"></script>
<script src="/apa-admin-core.js"></script>
<script src="/apa-audience.js"></script>
<script src="/apa-geo.js" defer></script>
<script src="/cabana-media-upload.js"></script>
<script src="/admin-console.js"></script>
<script src="/admin-views-ops.js"></script>
<script src="/admin-views-more.js"></script>
<script src="/cabana-avatars.js?v=1"></script>
<script src="/cabana-people.js?v=2"></script>
<script src="/admin-views-people.js?v=1"></script>
<!-- Advertising room: the placement registry, the site's own ad engine
     (preview only here), secret ads and the welcome poster (preview only). -->
<script src="/apa-ad-registry.js?v=2026.09.26"></script>
<script src="/showcase.js?v=4"></script>
<script src="/apa-shadow.js?v=3"></script>
<script src="/apa-interstitial.js?v=4"></script>
<script src="/admin-views-ads.js?v=1"></script>
</body>
</html>
