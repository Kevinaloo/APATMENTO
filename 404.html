<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Cabana</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #f6f0e8; background: #101a17; }
    main { width: min(560px, 100%); padding: 48px 36px; border: 1px solid rgba(214, 176, 105, .35); border-radius: 24px; text-align: center; background: #16231f; }
    .mark { color: #d6b069; font-size: .78rem; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 16px 0 12px; font-family: Georgia, serif; font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1; }
    p { margin: 0 auto 28px; max-width: 40ch; color: #c8d0cc; line-height: 1.6; }
    a { display: inline-block; padding: 13px 22px; border-radius: 999px; color: #101a17; background: #d6b069; font-weight: 800; text-decoration: none; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">Cabana Africa</div>
    <h1>Page not found</h1>
    <p>The page may have moved or the address may be incomplete.</p>
    <a href="/">Return home</a>
  </main>
  <script src="/cabana-support.js" defer></script>
</body>
</html>
