<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --glass:#FCFCFD;--glass-2:#F4F5FB;--glass-3:#EBEDF7;--ink:#0A0A14;--ink-2:#1A1B2E;--ink-soft:#4A4C66;--ink-faint:#8E90AD;
  --lilac:#B8A4F4;--lilac-deep:#8B6FE8;--mint:#5EEAD4;--mint-deep:#2DD4BF;--peach:#FFB59E;
  --electric:#4361FF;--violet:#7B2FF7;--ember:#FF6B2C;
  --line:rgba(10,10,20,0.07);--line-2:rgba(10,10,20,0.13);
  /* STAYS theme = lilac → violet lead */
  --theme:var(--lilac-deep);--theme-2:var(--violet);--theme-grad:linear-gradient(135deg,#B8A4F4,#7B2FF7);
  --font-display:'Geist','Inter',sans-serif;--font-body:'Inter',system-ui,sans-serif;
  --shadow-glass:0 8px 40px rgba(123,47,247,0.07),0 2px 12px rgba(10,10,20,0.04);
  --shadow-lift:0 24px 70px rgba(123,47,247,0.16),0 8px 24px rgba(10,10,20,0.06);
  --radius:22px;
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
html{scroll-behavior:smooth;}
body{font-family:var(--font-body);background:var(--glass);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;}

/* aurora — lilac-led */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.ab{position:absolute;border-radius:50%;filter:blur(85px);opacity:.42;mix-blend-mode:multiply;animation:drift 26s ease-in-out infinite;}
.ab-1{width:580px;height:580px;background:radial-gradient(circle,var(--lilac),transparent 70%);top:-14%;left:-8%;}
.ab-2{width:480px;height:480px;background:radial-gradient(circle,var(--violet),transparent 72%);top:6%;right:-10%;animation-delay:-8s;opacity:.3;}
.ab-3{width:440px;height:440px;background:radial-gradient(circle,var(--mint),transparent 72%);bottom:-12%;left:30%;animation-delay:-15s;opacity:.28;}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(50px,-36px) scale(1.1);}66%{transform:translate(-36px,46px) scale(.94);}}

/* ── SERVICE ENTRY TRANSITION (house rises) ── */
#enter-tx{position:fixed;inset:0;z-index:9999;background:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;
  animation:txLift .8s cubic-bezier(.7,0,.2,1) 2.2s forwards;}
#enter-tx.done{animation:txLift .4s cubic-bezier(.7,0,.2,1) 0s forwards!important;}
@keyframes txLift{to{opacity:0;transform:scale(1.1);}}
.tx-aurora{position:absolute;inset:0;}
.tx-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:0;animation:txIgnite 1s forwards;}
.txb-1{width:420px;height:420px;background:radial-gradient(circle,var(--lilac),transparent 68%);top:30%;left:30%;}
.txb-2{width:360px;height:360px;background:radial-gradient(circle,var(--violet),transparent 70%);bottom:26%;right:28%;animation-delay:.15s;}
@keyframes txIgnite{to{opacity:.5;}}
.tx-house{position:relative;z-index:2;text-align:center;}
.tx-house-ico{width:88px;height:88px;margin:0 auto 20px;color:#fff;opacity:0;transform:translateY(60px) scale(.6);animation:houseRise .9s .2s cubic-bezier(.34,1.56,.64,1) forwards;filter:drop-shadow(0 8px 30px rgba(184,164,244,.6));}
@keyframes houseRise{to{opacity:1;transform:translateY(0) scale(1);}}
.tx-label{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:38px;color:#fff;opacity:0;animation:fadeUp .7s .5s forwards;}
.tx-sub{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:8px;opacity:0;animation:fadeUp .7s .65s forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

/* ── TOP BAR ── */
.topbar{position:sticky;top:0;z-index:100;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(252,252,253,.72);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--line);}
.tb-left{display:flex;align-items:center;gap:13px;}
.tb-back{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);transition:all .25s;text-decoration:none;}
.tb-back:hover{border-color:var(--theme);color:var(--theme);transform:translateX(-2px);}
.tb-logo{height:34px;}
.tb-cab-wm{height:26px;width:auto;display:block;}
.tb-icon-sm{height:28px;width:28px;object-fit:contain;flex-shrink:0;border-radius:7px;}
.tb-title{font-family:var(--font-display);font-weight:500;font-size:19px;color:var(--ink);}
.tb-title em{font-style:italic;color:var(--theme);}
.tb-right{display:flex;align-items:center;gap:10px;}
.tb-chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--mint-deep);padding:8px 14px;border-radius:100px;background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.18);}
.tb-chip svg{width:13px;height:13px;}

/* ── HERO SEARCH ── */
.hero{position:relative;z-index:2;padding:40px 28px 8px;max-width:1180px;margin:0 auto;}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--theme);margin-bottom:14px;padding:6px 14px;border-radius:100px;background:rgba(139,111,232,.1);border:1px solid rgba(139,111,232,.2);}
.hero-title{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,4.6vw,48px);line-height:1.04;letter-spacing:-.02em;color:var(--ink);margin-bottom:10px;}
.hero-title em{font-style:italic;font-weight:500;background:var(--theme-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-sub{font-size:15px;color:var(--ink-soft);margin-bottom:28px;max-width:480px;line-height:1.6;}

/* search bar */
.search-bar{display:flex;align-items:stretch;gap:0;background:rgba(255,255,255,.7);backdrop-filter:blur(14px);border:1px solid var(--line-2);border-radius:18px;padding:6px;box-shadow:var(--shadow-glass);max-width:760px;margin-bottom:22px;}
.search-field{flex:1;padding:12px 18px;cursor:pointer;border-radius:13px;transition:background .2s;}
.search-field:hover{background:var(--glass-2);}
.search-field-label{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:3px;}
.search-field-val{font-size:14px;font-weight:500;color:var(--ink);}
.search-field-val.placeholder{color:var(--ink-faint);font-weight:400;}
.search-divider{width:1px;background:var(--line);margin:8px 0;}
.search-btn{width:52px;border-radius:14px;background:var(--theme-grad);border:none;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;margin-left:4px;transition:filter .2s,transform .2s;}
.search-btn:hover{filter:brightness(1.08);transform:scale(1.04);}

/* filter chips */
/* filter-bar CSS now in new premium block above */

/* ── LAYOUT ── */
.content{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:18px 28px 70px;}
.content-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.results-count{font-size:14px;color:var(--ink-soft);}
.results-count strong{color:var(--ink);font-weight:600;}
.sort-wrap{display:flex;align-items:center;gap:10px;}


/* ── CARD GRID ── */
/* ══ STAY CARDS — compact horizontal rows ═══════════════════════════
   Was: a 290px min grid of tall 200px-image cards. Two per screen on a
   phone, so finding a stay meant endless scrolling.
   Now: one vertical column of short rows — photo left, details right.
   Roughly 4–5 stays per screen instead of 1½, and the eye scans a
   single column rather than zig-zagging. Widens to two columns only
   when there is genuinely room. */
.grid{display:grid;grid-template-columns:1fr;gap:12px;}
@media(min-width:900px){.grid{grid-template-columns:repeat(2,1fr);gap:14px;}}
@media(min-width:1400px){.grid{grid-template-columns:repeat(3,1fr);}}

.card{
  position:relative;display:flex;align-items:stretch;gap:0;
  border-radius:16px;overflow:hidden;
  background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid var(--line);cursor:pointer;
  transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s,border-color .3s,opacity .4s;
  opacity:0;transform:translateY(14px);
  min-height:118px;
}
.card.in{opacity:1;transform:none;}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:rgba(67,97,255,.28);}
.card.is-native{border-color:rgba(45,212,191,.34);box-shadow:0 0 0 1px rgba(45,212,191,.12);}

/* Image: fixed square-ish rail on the left. Never grows. */
.card-img{
  position:relative;flex:0 0 118px;width:118px;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
}
@media(min-width:560px){.card-img{flex-basis:150px;width:150px;}}
.card-img img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .6s cubic-bezier(.22,1,.36,1);}
.card:hover .card-img img{transform:scale(1.06);}
.card-img svg{width:38px;height:38px;color:rgba(255,255,255,.9);}

/* Tag sits on the photo, small enough not to swallow it. */
.card-tag{position:absolute;top:8px;left:8px;z-index:2;
  padding:4px 8px;border-radius:100px;font-size:9px;font-weight:700;
  letter-spacing:.03em;white-space:nowrap;}
.card-tag-native{background:linear-gradient(135deg,#2DD4BF,#4361FF);color:#fff;}
.card-tag-hot{background:rgba(255,107,44,.14);color:var(--ember);
  border:1px solid rgba(255,107,44,.25);}

/* Body: everything stacked tight on the right. */
.card-body{
  flex:1;min-width:0;display:flex;flex-direction:column;
  padding:11px 13px 11px 14px;gap:2px;
}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.card-loc{display:flex;align-items:center;gap:4px;min-width:0;
  font-size:11px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-loc svg{width:11px;height:11px;flex-shrink:0;}

.card-heart{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:none;
  background:rgba(10,10,20,.05);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:12px;line-height:1;transition:transform .2s,background .2s;padding:0;}
.card-heart:hover{transform:scale(1.14);background:rgba(255,59,92,.12);}

.card-name{
  font-family:var(--font-display);font-weight:500;font-size:15px;
  color:var(--ink);line-height:1.25;margin:1px 0 5px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;
  overflow:hidden;
}
@media(min-width:560px){.card-name{font-size:16.5px;}}

.card-meta{display:flex;flex-wrap:wrap;gap:9px;font-size:11px;color:var(--ink-soft);
  margin-bottom:auto;}
.card-meta span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.card-meta svg{width:12px;height:12px;color:var(--theme);opacity:.7;flex-shrink:0;}

.card-foot{display:flex;align-items:flex-end;justify-content:space-between;
  gap:8px;margin-top:8px;}
.card-price{font-family:var(--font-display);font-weight:500;line-height:1;min-width:0;}
.card-price .val{font-size:15.5px;color:var(--ink);}
.card-price .per{font-size:10.5px;color:var(--ink-faint);font-family:var(--font-body);}
@media(min-width:560px){.card-price .val{font-size:17px;}}

.card-go{flex-shrink:0;width:28px;height:28px;border-radius:50%;
  background:var(--glass-2,rgba(67,97,255,.08));display:flex;align-items:center;
  justify-content:center;color:var(--lilac-deep,#7B2FF7);transition:all .3s;}
.card:hover .card-go{background:var(--lilac-deep,#7B2FF7);color:#fff;transform:rotate(-45deg);}
/* ══ LISTING MODAL — full-screen detail view ══════════════════════ */
.drawer-overlay{position:fixed;inset:0;z-index:200;background:rgba(10,10,20,.6);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s;}
.drawer-overlay.open{opacity:1;visibility:visible;}

/* The modal itself: full-screen on mobile, centred card on desktop */
.drawer{
  position:fixed;inset:0;z-index:201;
  background:var(--glass);
  overflow-y:auto;overflow-x:hidden;
  transform:translateY(100%);
  transition:transform .46s cubic-bezier(.22,1,.36,1);
  -webkit-overflow-scrolling:touch;
}
.drawer.open{transform:none;}
@media(min-width:760px){
  .drawer{
    top:5vh;bottom:5vh;left:50%;
    width:min(700px,94vw);
    transform:translateX(-50%) translateY(40px) scale(.97);
    border-radius:28px;
    box-shadow:0 40px 120px rgba(10,10,20,.28),0 8px 30px rgba(10,10,20,.1);
    opacity:0;
    transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .3s;
  }
  .drawer.open{
    transform:translateX(-50%) translateY(0) scale(1);
    opacity:1;
  }
}

/* ── Photo gallery ── */
.dl-gallery{position:relative;height:300px;background:linear-gradient(135deg,#B8A4F4,#7B2FF7);overflow:hidden;flex-shrink:0;}
@media(min-width:760px){.dl-gallery{height:340px;border-radius:28px 28px 0 0;}}
.dl-gallery-track{display:flex;height:100%;transition:transform .38s cubic-bezier(.22,1,.36,1);}
.dl-gallery-slide{flex:0 0 100%;height:100%;object-fit:cover;display:flex;align-items:center;justify-content:center;}
.dl-gallery-slide img{width:100%;height:100%;object-fit:cover;display:block;}
.dl-gallery-placeholder{width:64px;height:64px;color:rgba(255,255,255,.7);}
/* nav arrows */
.dl-gal-arr{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(252,252,253,.92);backdrop-filter:blur(8px);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);z-index:4;transition:transform .2s,box-shadow .2s;box-shadow:0 2px 12px rgba(10,10,20,.12);}
.dl-gal-arr:hover{transform:translateY(-50%) scale(1.08);box-shadow:0 4px 20px rgba(10,10,20,.18);}
.dl-gal-prev{left:14px;}.dl-gal-next{right:14px;}
.dl-gal-arr.hidden{opacity:0;pointer-events:none;}
/* dots */
.dl-gal-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:4;}
.dl-gal-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);transition:all .25s;border:none;cursor:pointer;padding:0;}
.dl-gal-dot.active{width:18px;border-radius:3px;background:#fff;}
/* photo count badge */
.dl-gal-count{position:absolute;bottom:14px;right:14px;background:rgba(10,10,20,.6);color:#fff;font-size:11px;font-weight:600;padding:5px 10px;border-radius:100px;backdrop-filter:blur(6px);z-index:4;}
/* close btn */
.drawer-close{position:absolute;top:16px;left:16px;width:40px;height:40px;border-radius:50%;background:rgba(252,252,253,.92);backdrop-filter:blur(8px);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);z-index:10;transition:transform .2s,box-shadow .2s;box-shadow:0 2px 10px rgba(10,10,20,.1);}
.drawer-close:hover{transform:scale(1.08);}

/* ── Scrollable body ── */
.dl-body{padding:24px 22px 120px;}
@media(min-width:760px){.dl-body{padding:28px 32px 120px;}}

/* native badge */
.dl-native-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:100px;background:linear-gradient(135deg,#2DD4BF,#4361FF);color:#fff;font-size:11px;font-weight:700;margin-bottom:14px;letter-spacing:.02em;}

/* location line */
.dl-loc{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-faint);margin-bottom:8px;}
.dl-loc svg{width:13px;height:13px;flex-shrink:0;}

/* title */
.dl-title{font-family:var(--font-display);font-weight:500;font-size:clamp(22px,4vw,30px);color:var(--ink);line-height:1.12;margin-bottom:16px;}

/* quick stats row */
.dl-stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.dl-stat{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--ink-soft);padding:8px 14px;border-radius:100px;background:var(--glass-2);border:1px solid var(--line);}
.dl-stat-ico{font-size:15px;}

/* divider */
.dl-divider{height:1px;background:var(--line);margin:22px 0;}

/* host card */
.dl-host{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--glass-2);border:1px solid var(--line);margin-bottom:22px;}
.dl-host-ava{width:50px;height:50px;border-radius:50%;background:var(--theme-grad);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:18px;color:#fff;flex-shrink:0;}
.dl-host-info{flex:1;min-width:0;}
.dl-host-name{font-size:15px;font-weight:600;color:var(--ink);}
.dl-host-tag{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.dl-host-100{font-size:11px;font-weight:700;color:var(--mint-deep);background:rgba(45,212,191,.1);padding:5px 11px;border-radius:100px;white-space:nowrap;flex-shrink:0;}
/* message host button */
.dl-msg-btn{width:100%;margin-top:12px;padding:13px 16px;border-radius:13px;border:1.5px solid var(--theme);background:transparent;color:var(--theme);font-family:var(--font-body);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .25s;}
.dl-msg-btn:hover{background:rgba(139,111,232,.06);border-color:var(--violet);}
.dl-msg-btn svg{width:16px;height:16px;}

/* description */
.dl-section-title{font-family:var(--font-display);font-weight:500;font-size:17px;color:var(--ink);margin-bottom:12px;}
.dl-desc{font-size:14px;line-height:1.75;color:var(--ink-soft);white-space:pre-line;}
.dl-desc-toggle{background:none;border:none;color:var(--theme);font-size:13px;font-weight:600;cursor:pointer;padding:8px 0 0;display:block;}

/* amenities */
.dl-amenities{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
@media(min-width:480px){.dl-amenities{grid-template-columns:repeat(3,1fr);}}
.amen{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-soft);padding:10px 12px;border-radius:12px;background:var(--glass-2);border:1px solid var(--line);}
.amen-ico{font-size:16px;flex-shrink:0;}

/* what to know */
.dl-know{display:flex;flex-direction:column;gap:12px;}
.dl-know-item{display:flex;align-items:flex-start;gap:12px;font-size:13px;color:var(--ink-soft);line-height:1.5;}
.dl-know-ico{width:34px;height:34px;border-radius:10px;background:var(--glass-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.dl-know-label{font-weight:600;color:var(--ink);font-size:13px;}

/* ── Sticky bottom CTA ── */
.dl-cta{
  position:sticky;bottom:0;left:0;right:0;
  background:rgba(252,252,253,.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding:14px 22px max(14px,env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:14px;
  z-index:10;
}
@media(min-width:760px){.dl-cta{padding:16px 32px;border-radius:0 0 28px 28px;}}
.dl-cta-price{flex:1;min-width:0;}
.dl-cta-val{font-family:var(--font-display);font-weight:600;font-size:24px;color:var(--ink);line-height:1;}
.dl-cta-per{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.dl-cta-note{font-size:11px;color:var(--mint-deep);font-weight:600;margin-top:3px;}
.dl-book-btn{flex-shrink:0;padding:14px 28px;border-radius:14px;background:var(--theme-grad);color:#fff;border:none;font-family:var(--font-body);font-weight:700;font-size:15px;cursor:pointer;transition:all .3s;box-shadow:0 8px 24px rgba(123,47,247,.3);white-space:nowrap;}
.dl-book-btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(123,47,247,.42);}

/* legacy class kept so nothing else breaks */
.drawer-img-ico{width:64px;height:64px;color:rgba(255,255,255,.7);}
.lc-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-soft);}
.lc-meta span{display:inline-flex;align-items:center;gap:6px;}
.drawer-amenities-title{font-family:var(--font-display);font-weight:500;font-size:17px;margin-bottom:14px;color:var(--ink);}
.amenities-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}

/* empty state */
.empty{text-align:center;padding:70px 20px;}
.empty-ico{width:64px;height:64px;margin:0 auto 20px;color:var(--ink-faint);opacity:.4;}
.empty-title{font-family:var(--font-display);font-size:22px;margin-bottom:8px;}
.empty-sub{font-size:14px;color:var(--ink-soft);}

@media(max-width:600px){.search-bar{flex-wrap:wrap;}.drawer{width:100%;}.hero,.content{padding-left:18px;padding-right:18px;}}

/* ════ MOBILE PERFORMANCE PATCH ════
   Removes GPU-killing backdrop-filter on small screens.
   Cards use solid semi-transparent bg instead. Much smoother. */
@media(max-width:700px){
  .card,.drawer,.topbar,.search-bar,.fchip,.card-fav,.card-badge,
  .dr-close,.dr-cta-box,.toast,.tb-back,.sb-btn,
  .sc-sticky,.sc-interstitial,.sc-window{
    backdrop-filter:none!important;
    -webkit-backdrop-filter:none!important;
  }
  .card{background:rgba(255,255,255,.95)!important;}
  .topbar{background:rgba(252,252,253,.97)!important;}
  .drawer{background:#FCFCFD!important;}
  /* Reduce aurora blur - expensive */
  .ab{filter:blur(40px)!important;}
  /* Disable card entrance animations on mobile - causes jank */
  .card{opacity:1!important;transform:none!important;transition:box-shadow .2s,transform .2s!important;}
  .card.in{opacity:1!important;transform:none!important;}
}

@media(max-width:700px){
  .card,.topbar,.search-bar,.drawer,.fchip{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
  .card{background:rgba(255,255,255,.96)!important;opacity:1!important;transform:none!important;animation:none!important;}
  .topbar{background:rgba(252,252,253,.98)!important;}
  .ab{filter:blur(40px)!important;opacity:.15!important;}
}

/* ══ APARTMENTS MOBILE: instant card visibility ══ */
@media(max-width:700px){
  .card{opacity:1!important;transform:none!important;animation:none!important;}
  .card.in{opacity:1!important;transform:none!important;}
  .card-img{background:#E8E6F0;}
}

html.via-dash #enter-tx{display:none!important;animation:none!important;}

/* ══════════════════════════════════════════════════════════════
   FILTER & SORT MODAL — complete styles
   ══════════════════════════════════════════════════════════════ */
.filter-modal-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(10,10,20,.5);backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;
}
.filter-modal-overlay.open{opacity:1;visibility:visible;}

.filter-modal{
  position:fixed;bottom:0;left:0;right:0;z-index:301;
  background:#FCFCFD;border-radius:24px 24px 0 0;
  padding:0 0 max(24px,env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;
  transform:translateY(100%);
  transition:transform .38s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -8px 40px rgba(10,10,20,.14);
}
.filter-modal.open{transform:translateY(0);}

.fm-handle{
  width:40px;height:4px;border-radius:2px;
  background:rgba(10,10,20,.12);
  margin:14px auto 0;
}
.fm-title{
  font-family:var(--font-display);font-weight:600;font-size:18px;
  color:var(--ink);padding:16px 24px 0;
  border-bottom:1px solid var(--line);padding-bottom:16px;
  margin-bottom:4px;
}

.fm-section{padding:16px 24px 0;}
.fm-section-label{
  font-size:11px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-faint);margin-bottom:12px;
}
.fm-chips{display:flex;flex-wrap:wrap;gap:8px;}
.fm-chip{
  padding:8px 16px;border-radius:100px;
  font-size:13px;font-weight:500;color:var(--ink-soft);
  background:rgba(255,255,255,.8);border:1.5px solid rgba(10,10,20,.1);
  cursor:pointer;transition:all .18s;user-select:none;
}
.fm-chip:hover{border-color:rgba(139,111,232,.4);color:var(--violet);}
.fm-chip.on{
  background:var(--theme-grad);color:#fff;
  border-color:transparent;font-weight:600;
}

/* Price range slider */
.price-range-row{
  display:flex;align-items:center;gap:10px;
  padding:4px 0 8px;flex-wrap:wrap;
}
.price-range-input{
  flex:1;min-width:80px;accent-color:var(--violet);
  height:4px;cursor:pointer;
}
.price-range-val{
  font-size:13px;font-weight:600;color:var(--ink);
  min-width:44px;text-align:right;
}

.fm-footer{
  display:flex;gap:12px;align-items:center;
  padding:20px 24px 4px;
  border-top:1px solid var(--line);margin-top:20px;
  position:sticky;bottom:0;background:#FCFCFD;
}
.fm-reset{
  flex:1;padding:13px;border-radius:14px;
  border:1.5px solid rgba(10,10,20,.15);
  background:transparent;color:var(--ink-soft);
  font-family:var(--font-body);font-size:14px;font-weight:600;
  cursor:pointer;transition:all .2s;
}
.fm-reset:hover{border-color:var(--violet);color:var(--violet);}
.fm-apply{
  flex:2;padding:13px;border-radius:14px;
  border:none;background:var(--theme-grad);color:#fff;
  font-family:var(--font-body);font-size:14px;font-weight:700;
  cursor:pointer;transition:all .2s;
  box-shadow:0 6px 20px rgba(123,47,247,.3);
}
.fm-apply:hover{filter:brightness(1.08);transform:translateY(-1px);}

/* ── Search wrap with glowing ring ── */
.search-wrap{position:relative;max-width:780px;margin-bottom:24px;}

/* The glowing ring around the search bar */
.search-ring{
  position:relative;
  border-radius:22px;
  padding:3px;
  background:linear-gradient(135deg,rgba(184,164,244,.6),rgba(123,47,247,.8),rgba(184,164,244,.4));
  box-shadow:
    0 0 0 1px rgba(123,47,247,.15),
    0 0 20px rgba(123,47,247,.2),
    0 0 40px rgba(123,47,247,.12),
    0 0 80px rgba(123,47,247,.06);
  animation:ringPulse 3s ease-in-out infinite;
}
@keyframes ringPulse{
  0%,100%{box-shadow:0 0 0 1px rgba(123,47,247,.15),0 0 20px rgba(123,47,247,.2),0 0 40px rgba(123,47,247,.12),0 0 80px rgba(123,47,247,.06);}
  50%{box-shadow:0 0 0 1px rgba(123,47,247,.3),0 0 30px rgba(123,47,247,.35),0 0 60px rgba(123,47,247,.2),0 0 100px rgba(123,47,247,.1);}
}

/* ── Main search bar (inside the ring) ── */
.search-main{
  display:flex;align-items:stretch;gap:0;
  background:#fff;
  border-radius:20px;
  overflow:visible;
  position:relative;
}

.sf{
  flex:1;min-width:0;padding:14px 18px;cursor:pointer;
  border-radius:16px;transition:background .18s;
  position:relative;
}
.sf:hover{background:rgba(139,111,232,.06);}
.sf-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px;}
.sf-val{font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sf-val.ph{color:var(--ink-faint);font-weight:400;}
.sf-divider{width:1px;background:rgba(10,10,20,.08);margin:12px 0;flex-shrink:0;}

/* Search button inside ring */
.search-go{
  flex-shrink:0;margin:6px 6px 6px 0;
  padding:0 20px;border-radius:15px;
  background:var(--theme-grad);color:#fff;
  border:none;cursor:pointer;
  font-family:var(--font-body);font-weight:700;font-size:14px;
  display:flex;align-items:center;gap:8px;
  transition:all .25s;white-space:nowrap;
}
.search-go svg{width:16px;height:16px;}
.search-go:hover{filter:brightness(1.1);transform:translateY(-1px);}

/* Dropdown panels */
.sf-panel{
  display:none;position:absolute;top:calc(100% + 10px);left:0;
  background:#fff;border-radius:18px;
  border:1px solid rgba(123,47,247,.15);
  box-shadow:0 20px 60px rgba(10,10,20,.12),0 4px 20px rgba(123,47,247,.1);
  z-index:200;min-width:220px;padding:16px;
  animation:panelIn .2s cubic-bezier(.34,1.56,.64,1);
}
.sf-panel.open{display:block;}
@keyframes panelIn{from{opacity:0;transform:translateY(-8px) scale(.97);}to{opacity:1;transform:none;}}
.sf-panel-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:12px;}

/* Location options */
.loc-options{display:flex;flex-direction:column;gap:2px;}
.loc-opt{
  padding:10px 12px;border-radius:12px;cursor:pointer;
  font-size:14px;color:var(--ink-soft);transition:all .15s;
}
.loc-opt:hover{background:rgba(139,111,232,.08);color:var(--ink);}
.loc-opt.picked{background:rgba(139,111,232,.12);color:var(--violet);font-weight:600;}

/* Date grid */
.date-grid{display:flex;flex-direction:column;gap:12px;min-width:260px;}
.date-input-wrap label{font-size:11px;font-weight:600;color:var(--ink-faint);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.date-input-wrap input[type=date]{
  width:100%;padding:10px 14px;border-radius:12px;
  border:1.5px solid var(--line-2);
  font-family:var(--font-body);font-size:14px;color:var(--ink);
  background:#fff;outline:none;transition:border-color .2s;
}
.date-input-wrap input[type=date]:focus{border-color:var(--violet);}

/* Guest rows */
.guest-rows{display:flex;flex-direction:column;gap:14px;min-width:240px;}
.guest-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.guest-row-label{font-size:14px;font-weight:500;color:var(--ink);}
.guest-row-sub{font-size:12px;color:var(--ink-faint);margin-top:1px;}
.guest-counter{display:flex;align-items:center;gap:12px;}
.g-btn{
  width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line-2);
  background:#fff;color:var(--ink);font-size:18px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .2s;font-family:var(--font-body);
}
.g-btn:hover:not(:disabled){border-color:var(--violet);color:var(--violet);background:rgba(123,47,247,.06);}
.g-btn:disabled{opacity:.3;cursor:default;}
.g-val{font-size:15px;font-weight:600;color:var(--ink);min-width:20px;text-align:center;}

/* ── Special Search pill (AI natural language) ── */
.special-search-bar{
  display:flex;align-items:center;gap:10px;
  background:rgba(123,47,247,.05);
  border:1.5px solid rgba(123,47,247,.2);
  border-radius:14px;
  padding:11px 14px;
  margin-top:12px;
  cursor:text;
  transition:border-color .2s,box-shadow .2s;
}
.special-search-bar:focus-within{
  border-color:rgba(123,47,247,.45);
  box-shadow:0 0 0 3px rgba(123,47,247,.08);
}
.special-badge{
  display:flex;align-items:center;gap:5px;
  font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:#fff;background:var(--theme-grad);
  padding:4px 9px;border-radius:100px;flex-shrink:0;
  white-space:nowrap;
}
.special-badge svg{width:11px;height:11px;}
.special-search-bar input{
  flex:1;border:none;background:transparent;
  font-family:var(--font-body);font-size:13.5px;color:var(--ink);outline:none;
}
.special-search-bar input::placeholder{color:var(--ink-faint);}
.special-search-btn{
  flex-shrink:0;width:30px;height:30px;border-radius:10px;
  background:var(--theme-grad);border:none;color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .2s;
}
.special-search-btn:hover{filter:brightness(1.1);transform:scale(1.05);}
.special-search-btn svg{width:13px;height:13px;}

/* AI response box */
.ai-response{
  display:none;margin-top:12px;padding:16px 18px;
  border-radius:16px;background:rgba(255,255,255,.8);
  border:1px solid rgba(123,47,247,.15);
  backdrop-filter:blur(10px);
}
.ai-response.show,.ai-response.visible{display:block;}
.ai-response-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.ai-response-ico{font-size:16px;color:var(--violet);}
.ai-response-name{font-size:12px;font-weight:700;color:var(--violet);letter-spacing:.02em;}
.ai-response-text{font-size:14px;line-height:1.65;color:var(--ink-soft);}
.ai-typing{display:flex;gap:4px;align-items:center;}
.ai-typing span{width:6px;height:6px;border-radius:50%;background:var(--lilac);animation:typingDot 1.2s ease-in-out infinite;}
.ai-typing span:nth-child(2){animation-delay:.2s;}
.ai-typing span:nth-child(3){animation-delay:.4s;}
@keyframes typingDot{0%,80%,100%{transform:scale(.7);opacity:.4;}40%{transform:scale(1);opacity:1;}}

/* ── Filter bar — clean, scrollable, minimal ── */
.filter-bar{
  display:flex;align-items:center;gap:8px;
  overflow-x:auto;padding:4px 0 8px;
  scrollbar-width:none;-ms-overflow-style:none;
  margin-bottom:4px;
}
.filter-bar::-webkit-scrollbar{display:none;}

.fchip{
  display:inline-flex;align-items:center;gap:6px;
  white-space:nowrap;flex-shrink:0;
  padding:8px 16px;border-radius:100px;
  font-size:13px;font-weight:500;color:var(--ink-soft);
  background:rgba(255,255,255,.7);
  border:1.5px solid rgba(10,10,20,.1);
  cursor:pointer;transition:all .2s;
  user-select:none;
}
.fchip:hover{border-color:rgba(139,111,232,.4);color:var(--violet);background:rgba(139,111,232,.05);}
.fchip.active{
  background:var(--theme-grad);color:#fff;
  border-color:transparent;
  font-weight:600;
  box-shadow:0 4px 16px rgba(123,47,247,.28);
}
/* Special chips with distinct visual */
.fchip.chip-ai{
  background:linear-gradient(135deg,rgba(123,47,247,.08),rgba(184,164,244,.12));
  border-color:rgba(123,47,247,.25);color:var(--violet);
}
.fchip.chip-ai:hover{background:linear-gradient(135deg,rgba(123,47,247,.14),rgba(184,164,244,.2));}
.fchip.chip-ai.active{background:var(--theme-grad);color:#fff;border-color:transparent;}
.fchip-icon{font-size:14px;line-height:1;}

/* Filter & Sort button (separate, on the right) */
.filter-sort-btn{
  flex-shrink:0;display:inline-flex;align-items:center;gap:7px;
  padding:8px 16px;border-radius:100px;
  font-size:13px;font-weight:600;color:var(--ink-soft);
  background:rgba(255,255,255,.7);
  border:1.5px solid rgba(10,10,20,.1);
  cursor:pointer;transition:all .2s;
  margin-left:4px;
}
.filter-sort-btn:hover{border-color:rgba(139,111,232,.4);color:var(--violet);}
.filter-sort-btn svg{width:14px;height:14px;}

/* ── Fix: APA FAB doesn't cover Reserve button ── */
/* On mobile, move the fab left so it doesn't overlap sticky CTA */
@media(max-width:700px){
  #apa-fab{bottom:calc(80px + env(safe-area-inset-bottom,0px)) !important;right:14px !important;}
  #apa-avatar-popup{bottom:calc(148px + env(safe-area-inset-bottom,0px)) !important;right:6px !important;}
}

/* ── Mobile search bar: stack vertically ── */
@media(max-width:640px){
  .search-ring{border-radius:18px;}
  .search-main{flex-wrap:wrap;border-radius:16px;}
  .sf{flex:1 1 45%;padding:12px 14px;}
  .sf-divider{display:none;}
  .search-go{width:100%;margin:0 6px 6px;padding:13px;justify-content:center;}
}

    if ('serviceWorker' in navigator) {
      // Unregister all old SWs, then register fresh
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(r => {
          if (r.active && !r.active.scriptURL.includes('sw.js')) r.unregister();

      // Force the new SW to activate immediately

          const w = reg.installing;

            if (w.state === 'installed' && navigator.serviceWorker.controller) {

              window.location.reload();
            }
          };
        };

<script>
// Real listings only — loaded from Supabase (demo array removed)

/* ════════════════════════════════════════════════════════════════
   APATMENTO STAYS — unified data layer
   Priority: native (Supabase partner listings) > sample listings
   Photos: Unsplash API (free, no approval needed)
════════════════════════════════════════════════════════════════ */

const SUPABASE_URL = 'https://gfwgbgdvxtocwhilrtdw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdmd2diZ2R2eHRvY3doaWxydGR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MTE2NjMsImV4cCI6MjA5NzA4NzY2M30.U8JClv06YsNAwq9qsPb3lQ4SIPeRPjKMzsYxVfcmujw';
const UNSPLASH_KEY = 'YoImDCLHHDFQbvp_VJaFkC0oPMDuDiDp7zB0q8JQHXE'; // demo key — replace with your own at unsplash.com/developers

let sb = null;
try { const { createClient } = supabase; sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY); window.sb = sb; } catch(e) {}

// Expose sb globally so chat.js can pick it up immediately
window.sb = sb;
// ApaSession will populate CURRENT_USER when ready — chat.js also resolves this itself
document.addEventListener("DOMContentLoaded", () => {
  window.sb = window.sb || sb;
  if (window.ApaSession) {
    ApaSession.ready(function(state) {
      if (state && state.user) {
        window.CURRENT_USER = state.user;
        window.sb = window.sb || sb || ApaSession.client();
      }
    });

});

let currentListings = [];
let activeFilters = new Set(['all']);
let photoCache = {};       // query -> url cache so we don't re-fetch same photos
let nativeCount = 0;       // how many native partner listings loaded

/* ── calcScore: invisible ranking formula ── */
function calcScore(item) {
  const isNative = item.source === 'native';
  const rating = item.rating || 0, reviews = item.reviews || 0;
  const bookings = item.bookings || 0, daysListed = item.daysListed || 365;
  const ratingScore   = (rating / 5) * 50 * (1 - Math.exp(-reviews / 20));
  const reviewScore   = Math.log10(reviews + 1) * 10;
  const recencyScore  = bookings > 0 ? Math.max(0, 20 - (daysListed / 30)) : 0;
  const momentumScore = Math.min(10, bookings * 1.5);
  const base = ratingScore + reviewScore + recencyScore + momentumScore;
  // Native listings get a significant boost — they appear first
  return isNative ? base + 200 : base;
}

function smartSort(list, mode) {
  const scored = list.map(item => ({ ...item, _score: calcScore(item) }));
  if (mode === 'price-asc' || mode === 'price-desc') {
    const BAND = 0.15;
    return scored.sort((a, b) => {
      // Native listings still surface above same-price-band samples
      if (a.source === 'native' && b.source !== 'native') return -1;
      if (b.source === 'native' && a.source !== 'native') return  1;
      const pd = mode === 'price-asc' ? a.price - b.price : b.price - a.price;
      if (Math.abs(a.price - b.price) <= Math.min(a.price, b.price) * BAND)
        return b._score - a._score;
      return pd;
    });
  }
  return scored.sort((a, b) => b._score - a._score);
}

/* ── Unsplash photo fetcher ── */
async function getPhoto(query, id) {
  const cacheKey = `${id}`;
  if (photoCache[cacheKey]) return photoCache[cacheKey];
  try {
    const res = await fetch(
      `https://api.unsplash.com/photos/random?query=${encodeURIComponent(query)}&orientation=landscape&client_id=${UNSPLASH_KEY}`
      , { signal: AbortSignal.timeout(4000) }
    );
    if (!res.ok) return null;
    const data = await res.json();
    const url = data?.urls?.regular || data?.urls?.small || null;
    if (url) photoCache[cacheKey] = url;
    return url;
  } catch(e) { return null; }
}

/* ── Photo backfill ────────────────────────────────────────────────
   Cards now render their real Supabase photo up front. This only fills
   in listings that genuinely have none, and it is strictly best-effort:
   a failed or rate-limited fetch simply leaves the placeholder.        */
async function loadPhotos(listings) {
  const missing = listings.filter(l => !(l.photos && l.photos.length));
  if (!missing.length) return;

  for (const l of missing.slice(0, 6)) {
    const url = await getPhoto(l.query || 'apartment interior', l.id);
    if (url) injectPhoto(l.id, url);
  }
  setTimeout(async () => {
    for (const l of missing.slice(6)) {
      const url = await getPhoto(l.query || 'apartment interior', l.id);
      if (url) injectPhoto(l.id, url);
    }
  }, 800);
}

function injectPhoto(id, url) {
  const thumb = document.querySelector(`[data-card-id="${id}"] .card-img`);
  if (!thumb || thumb.querySelector('img')) return;   // never clobber a real photo
  const img = new Image();
  img.onload = () => {
    const svg = thumb.querySelector('svg');
    if (svg) svg.remove();
    thumb.style.background = 'none';
    thumb.insertAdjacentHTML('afterbegin',
      `<img src="${url}" alt="" style="width:100%;height:100%;object-fit:cover;">`);
  };
  img.src = url;
}

/* ── Load native partner listings from Supabase ── */
async function loadNativeListings() {
  if (!sb) return [];
  try {
    const { data } = await sb.from('listings')
      .select('id,title,location,city,price_night,beds,baths,max_guests,amenities,description,avg_rating,review_count,booking_count,days_listed,internal_score,status,photos,type,property_type,area,partner_id')
      .eq('status', 'active')
      .order('internal_score', { ascending: false })
      .limit(50);
    if (!data?.length) return [];
    return data.map(l => ({
      id: `n_${l.id}`,
      _dbId: l.id,
      name: l.title || 'Untitled',
      location: l.location || 'Nairobi',
      city: l.city || 'Nairobi',
      neighbourhood: l.area || l.location || '',
      type: l.property_type || l.type || 'Apartment',
      beds: parseInt(l.beds)||1, baths: parseInt(l.baths)||1,
      sqm: l.sqm || 60, floor: 0,
      maxGuests: l.max_guests || 2,
      price: l.price_night || 0,
      rating: l.avg_rating || 0, reviews: l.review_count || 0,
      bookings: l.booking_count || 0, daysListed: l.days_listed || 1,
      hot: (l.internal_score || 0) > 60,
      amenities: l.amenities || [],
      desc: l.description || '',
      host: 'Apatmento Partner', hostInit: 'V',
      hostId: l.partner_id || null,
      query: 'luxury apartment interior nairobi',
      grad: 'linear-gradient(135deg,#B8A4F4,#7B2FF7)',
      source: 'native',   // ← priority flag
      photos: l.photos || [],
    }));
  } catch(e) { return []; }
}

/* ── Main init ── */
/* ── Sample listings — shown while Supabase loads or if no active listings yet ── */

];

async function loadListings() {
  updateBanner('loading');

  // Show samples immediately — page is never blank
  currentListings = [...SAMPLE_LISTINGS];
  applyAndRender();

  // Fetch real listings from Supabase
  const native = await loadNativeListings();
  nativeCount = native.length;

  if (native.length > 0) {
    // Real listings replace samples
    currentListings = [...native];
  }
  // If Supabase returns nothing, samples remain — page stays alive
  applyAndRender();
  updateBanner('ready');
}

/* ── Banner: show native count when >0 ── */
function updateBanner(state) {
  const el = document.getElementById('native-banner');
  if (!el) return;
  if (state === 'loading') {
    el.style.display = 'none';
  } else if (state === 'ready' && nativeCount > 0) {
    el.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> ${nativeCount} verified Apatmento listing${nativeCount!==1?'s':''} shown first`;
    el.style.display = 'flex';
  }
}

/* ── Render cards ── */
const HOUSE_SVG = `<svg class="card-img-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9 20v-5a3 3 0 0 1 6 0v5"/></svg>`;

function renderCards(list) {
  document.getElementById('result-num').textContent = list.length;
  const grid = document.getElementById('grid');

  if (!list.length) {
    grid.innerHTML = `<div class="empty">
      <div style="font-size:48px;margin-bottom:16px;">🏠</div>

/* ══ LISTING MODAL ══════════════════════════════════════════════════
   Full-screen detail view: photo gallery, all info, host card +
   message button, amenities, house rules — sticky Book CTA at bottom.
   No public reviews (not in platform yet).
   ================================================================ */

let _galPhotos = [];   // current modal photo array
let _galIdx   = 0;    // current slide index
let _galTouchX = null; // touch-start X for swipe

function openDrawer(id) {
  const apt = currentListings.find(a => a.id === id);

  _galPhotos = apt.photos?.length ? [...apt.photos] : [];
  _galIdx    = 0;

  const galleryHTML = _buildGallery(_galPhotos, apt.grad);

  /* ── amenities ── */

    const parts = a.split(' ');

  const descShort = descFull.length > 280 ? descFull.slice(0,280).trimEnd() + '…' : descFull;
  const descHTML  = descFull.length > 280
    ? `<div class="dl-desc" id="dl-desc-text">${descShort}</div>
       <button class="dl-desc-toggle" onclick="toggleDesc('${apt.id}','${encodeURIComponent(descFull)}')">Show more ↓</button>`
    : `<div class="dl-desc">${descFull}</div>`;

  /* ── house rules / what to know ── */

    { ico:'🕐', label:'Check-in',   val:'From 2:00 PM'   },
    { ico:'🚪', label:'Check-out',  val:'By 11:00 AM'    },
    { ico:'🚭', label:'Smoking',    val:'Not allowed'    },
    { ico:'🐾', label:'Pets',       val:'Ask the host'   },

    `<div class="dl-know-item">
      <div class="dl-know-ico">${k.ico}</div>

    </div>`

  /* ── build modal ── */
  document.getElementById('drawer').innerHTML = `
    <!-- Gallery -->
    ${galleryHTML}

    <!-- Scrollable body -->
    <div class="dl-body">
      ${isNative ? `<div class="dl-native-badge"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M9 12l2 2 4-4M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>Listed on Apatmento</div>` : ''}

      <div class="dl-loc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        ${apt.location}
      </div>
      <div class="dl-title">${apt.name}</div>

      <!-- Quick stats pills -->
      <div class="dl-stats">
        <div class="dl-stat"><span class="dl-stat-ico">🛏</span>${bedsLabel}</div>
        <div class="dl-stat"><span class="dl-stat-ico">🛁</span>${apt.baths} Bath${apt.baths!==1?'s':''}</div>
        <div class="dl-stat"><span class="dl-stat-ico">👥</span>Up to ${apt.maxGuests} guest${apt.maxGuests!==1?'s':''}</div>
        ${apt.sqm  ? `<div class="dl-stat"><span class="dl-stat-ico">📐</span>${apt.sqm} m²</div>` : ''}
        ${apt.floor ? `<div class="dl-stat"><span class="dl-stat-ico">🏢</span>Floor ${apt.floor}</div>` : ''}
        ${apt.type  ? `<div class="dl-stat"><span class="dl-stat-ico">🏠</span>${apt.type}</div>` : ''}
      </div>

      <div class="dl-divider"></div>

      <!-- Host card -->
      <div class="dl-host">
        <div class="dl-host-ava">${apt.hostInit || 'H'}</div>
        <div class="dl-host-info">
          <div class="dl-host-name">Hosted by ${apt.host || 'Apatmento Partner'}</div>
          <div class="dl-host-tag">${isNative ? 'Apatmento partner' : 'Partner host'}</div>
        </div>
        <div class="dl-host-100">Keeps 100%</div>
      </div>
      <button class="dl-msg-btn" onclick="messageHost('${apt.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Message the host
      </button>

      <div class="dl-divider"></div>

      <!-- Description -->
      ${descFull ? `<div class="dl-section-title">About this place</div>${descHTML}<div class="dl-divider"></div>` : ''}

      <!-- Amenities -->
      ${amenHTML ? `
        <div class="dl-section-title">What's included</div>
        <div class="dl-amenities">${amenHTML}</div>
        <div class="dl-divider"></div>

      <!-- House rules / what to know -->

  if (!_galPhotos.length) {

/* ── gallery builder ── */
function _buildGallery(photos, grad) {
  const bg = grad || 'linear-gradient(135deg,#B8A4F4,#7B2FF7)';
  const slidesHTML = photos.length
    ? photos.map((p,i) =>
        `<div class="dl-gallery-slide"><img src="${p}" alt="Photo ${i+1}" loading="${i===0?'eager':'lazy'}"/></div>`
      ).join('')
    : `<div class="dl-gallery-slide" style="background:${bg}">
         <svg class="dl-gallery-placeholder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
           <path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9 20v-5a3 3 0 0 1 6 0v5"/>
         </svg>
       </div>`;

  const showNav   = photos.length > 1;
  const countBadge = photos.length > 1
    ? `<div class="dl-gal-count" id="dl-gal-count">1 / ${photos.length}</div>` : '';
  const dotsHTML = photos.length > 1
    ? `<div class="dl-gal-dots" id="dl-gal-dots">${photos.map((_,i) =>
        `<button class="dl-gal-dot${i===0?' active':''}" onclick="galGoTo(${i})" aria-label="Photo ${i+1}"></button>`
      ).join('')}</div>` : '';

  return `
    <div class="dl-gallery" style="background:${bg}">
      <button class="drawer-close" onclick="closeDrawer()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="dl-gallery-track" id="dl-gal-track">${slidesHTML}</div>
      ${showNav ? `
        <button class="dl-gal-arr dl-gal-prev${photos.length<=1?' hidden':''}" id="dl-gal-prev" onclick="galStep(-1)" aria-label="Previous photo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="dl-gal-arr dl-gal-next" id="dl-gal-next" onclick="galStep(1)" aria-label="Next photo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      ` : ''}
      ${dotsHTML}
      ${countBadge}
    </div>`;
}

/* ── gallery controls ── */
function galStep(dir) {
  if (!_galPhotos.length) return;
  _galIdx = (_galIdx + dir + _galPhotos.length) % _galPhotos.length;
  _updateGalleryUI();
}
function galGoTo(i) {
  _galIdx = i;
  _updateGalleryUI();
}
function _updateGalleryUI() {
  const track = document.getElementById('dl-gal-track');
  if (track) track.style.transform = `translateX(-${_galIdx * 100}%)`;

  const dots = document.querySelectorAll('.dl-gal-dot');
  dots.forEach((d,i) => d.classList.toggle('active', i === _galIdx));

  const count = document.getElementById('dl-gal-count');
  if (count) count.textContent = `${_galIdx+1} / ${_galPhotos.length}`;

  const prev = document.getElementById('dl-gal-prev');
  const next = document.getElementById('dl-gal-next');
  if (prev) prev.classList.toggle('hidden', _galIdx === 0);
  if (next) next.classList.toggle('hidden', _galIdx === _galPhotos.length - 1);
}

/* ── touch/swipe on gallery ── */
let _galAutoTimer = null;

function _clearAutoScroll() {
  if (_galAutoTimer) { clearInterval(_galAutoTimer); _galAutoTimer = null; }
}

function _startAutoScroll() {
  _clearAutoScroll();
  if (_galPhotos.length < 2) return;
  _galAutoTimer = setInterval(() => {
    // Loop back to 0 after last photo
    _galIdx = (_galIdx + 1) % _galPhotos.length;
    _updateGalleryUI();
  }, 3800);
}

function _attachGallerySwipe() {
  const gal = document.querySelector('.dl-gallery');
  if (!gal) return;
  // Touch swipe
  gal.addEventListener('touchstart', e => { _galTouchX = e.touches[0].clientX; _clearAutoScroll(); }, { passive:true });
  gal.addEventListener('touchend', e => {
    if (_galTouchX === null) return;
    const dx = e.changedTouches[0].clientX - _galTouchX;
    if (Math.abs(dx) > 40) galStep(dx < 0 ? 1 : -1);
    _galTouchX = null;
    _startAutoScroll();
  }, { passive:true });
  // Pause on hover (desktop)
  gal.addEventListener('mouseenter', _clearAutoScroll);
  gal.addEventListener('mouseleave', _startAutoScroll);
  // Start
  _startAutoScroll();
}

/* ── description expand ── */
function toggleDesc(id, encodedFull) {
  const el  = document.getElementById('dl-desc-text');
  const btn = el?.nextElementSibling;
  if (!el) return;
  const full = decodeURIComponent(encodedFull);
  el.textContent = full;
  if (btn) btn.remove();
}

/* ── topbar inbox button ── */
function openInboxFromTopbar() {
  if (window.ApatmentoChat) ApatmentoChat.openInbox();
}

/* ── Message host — calls ApatmentoChat directly; auth handled inside chat.js ── */
function messageHost(id) {
  const apt = currentListings.find(a => a.id === id);
  if (!apt) return;
  if (!window.ApatmentoChat) return;
  ApatmentoChat.open({
    listingId: apt._dbId || apt.id,
    listingType: 'apartment',
    listingTitle: apt.name,
    hostId: apt.hostId || undefined,
  });
}

function closeDrawer() {
  _clearAutoScroll();
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function bookNow(id) {
  const apt = currentListings.find(a => a.id === id);
  if (!apt) return;
  const dbId = apt._dbId || apt.id;
  const params = new URLSearchParams({ id: dbId, name: apt.name, location: apt.location, price: apt.price, maxGuests: apt.maxGuests });
  window.location.href = `booking-confirm.html?${params.toString()}`;
}

/* ═══════════════════════════════════════════════════════════════
   SEARCH + FILTER + SORT + AI — world-class stays discovery
   ═══════════════════════════════════════════════════════════════ */

/* State */
let _searchState = {
  loc: '',           // city/location filter
  dateIn: '',
  dateOut: '',
  adults: 1,
  children: 0,
  infants: 0,
  sortMode: 'recommended',
  minPrice: 0,
  maxPrice: 999999,
  minBeds: 0,
  amenities: new Set(),
  typeFilter: 'all', // all | hotel | apartment | home
  smartMode: null,   // null | 'nearest' | 'affordable' | 'bestvalue'
  aiQuery: '',
  userLat: null,
  userLng: null,
};

/* Deep-link ?q= support */
(function(){
  const q = new URLSearchParams(location.search).get('q');
  if (!q) return;
  _searchState.loc = q.trim().toLowerCase();
  const f = document.getElementById('field-where');
  if (f) { f.textContent = q.trim() + ', Kenya'; f.classList.remove('ph'); }
})();

/* ── Search field dropdowns ── */
let _activeSF = null;
function openSF(name) {
  const panelId = 'sfp-' + name;
  const panel = document.getElementById(panelId);
  if (!panel) return;
  if (_activeSF && _activeSF !== panelId) {
    document.getElementById(_activeSF)?.classList.remove('open');
  }
  panel.classList.toggle('open');
  _activeSF = panel.classList.contains('open') ? panelId : null;
}
document.addEventListener('click', e => {
  if (_activeSF && !e.target.closest('.sf')) {
    document.getElementById(_activeSF)?.classList.remove('open');
    _activeSF = null;
  }
});

/* ── Location picker ── */
function pickLoc(city) {
  _searchState.loc = city.toLowerCase();
  const f = document.getElementById('field-where');
  f.textContent = city + ', Kenya';
  f.classList.remove('ph');
  document.getElementById('sfp-where')?.classList.remove('open');
  _activeSF = null;
  // Mark active
  document.querySelectorAll('.loc-opt').forEach(o => o.classList.toggle('picked', o.textContent.includes(city)));
  applyAndRender();
}

/* ── Date pickers ── */
function pickDate(which, val) {
  if (which === 'in') {
    _searchState.dateIn = val;
    const f = document.getElementById('field-checkin');
    f.textContent = val ? new Date(val).toLocaleDateString('en-KE',{month:'short',day:'numeric'}) : 'Add date';
    f.classList.toggle('ph', !val);
    // set min for checkout
    const out = document.getElementById('date-out');
    if (out) out.min = val;
  } else {
    _searchState.dateOut = val;
    const f = document.getElementById('field-checkout');
    if (f) { f.textContent = val ? new Date(val).toLocaleDateString('en-KE',{month:'short',day:'numeric'}) : 'Add date'; f.classList.toggle('ph',!val); }
  }
  updateResultLabel();
}

/* ── Guest counter ── */
function adjustGuests(type, dir) {
  const key = type; // 'adults'|'children'|'infants'
  const min = type === 'adults' ? 1 : 0;

/* ── Core filter + sort engine ── */
function applyAndRender() {
  let list = [...currentListings];
  const s = _searchState;

  // Location filter
  if (s.loc) {
    list = list.filter(a =>
      ((a.location||'') + ' ' + (a.city||'') + ' ' + (a.name||'')).toLowerCase().includes(s.loc)
    );
  }

  // Type filter
  if (s.typeFilter && s.typeFilter !== 'all') {
    list = list.filter(a => {
      const t = (a.type||'').toLowerCase();
      if (s.typeFilter === 'hotel') return t.includes('hotel');
      if (s.typeFilter === 'apartment') return t.includes('apartment') || t.includes('studio') || t.includes('flat') || t.includes('home') || t.includes('house') || t.includes('villa') || t.includes('cottage') || t.includes('cabin');
      if (s.typeFilter === 'home') return t.includes('home') || t.includes('house') || t.includes('villa') || t.includes('cottage');
      return true;
    });
  }

  // Guest filter — only show places that can fit the party
  const totalGuests = (s.adults || 1) + (s.children || 0);
  if (totalGuests > 1) {
    list = list.filter(a => (a.maxGuests || 1) >= totalGuests);
  }

  // Price filter
  if (s.minPrice > 0) list = list.filter(a => a.price >= s.minPrice);
  if (s.maxPrice < 999999) list = list.filter(a => a.price <= s.maxPrice);

  // Bedrooms
  if (s.minBeds > 0) {
    if (s.minBeds >= 3) list = list.filter(a => a.beds >= 3);
    else list = list.filter(a => a.beds >= s.minBeds);
  }

  // Amenities
  if (s.amenities.size) {
    list = list.filter(a =>
      [...s.amenities].every(req =>
        (a.amenities||[]).some(am => am.toLowerCase().includes(req.toLowerCase()))
      )
    );
  }

  // Smart modes
  if (s.smartMode === 'affordable') {
    list = [...list].sort((a, b) => a.price - b.price);
    updateResultLabel('affordable');
  } else if (s.smartMode === 'bestvalue') {
    // Best value = score combining: rating, reviews, proximity (if we have coords), price efficiency, capacity per price
    list = [...list].sort((a, b) => {
      const scoreA = _bestValueScore(a, s);
      const scoreB = _bestValueScore(b, s);
      return scoreB - scoreA;
    });
    updateResultLabel('bestvalue');
  } else if (s.smartMode === 'nearest' && s.userLat && s.userLng) {
    list = [...list].sort((a, b) => {
      const dA = _distKm(s.userLat, s.userLng, a.lat || -1.286, a.lng || 36.817);
      const dB = _distKm(s.userLat, s.userLng, b.lat || -1.286, b.lng || 36.817);
      return dA - dB;
    });
    updateResultLabel('nearest');
  } else {
    // Standard smart sort
    list = smartSort(list, s.sortMode || 'recommended');
    updateResultLabel();
  }

  renderCards(list);
}

function _bestValueScore(apt, s) {
  const totalGuests = (s.adults || 1) + (s.children || 0);
  const pricePerGuest = apt.price / Math.max(apt.maxGuests || 1, totalGuests);
  const ratingWeight = (apt.rating || 3.5) * 15;
  const reviewWeight = Math.log10((apt.reviews || 1) + 1) * 8;
  const capacityFit = apt.maxGuests >= totalGuests ? 10 : -20; // penalty for too-small
  const priceScore = Math.max(0, 50 - (pricePerGuest / 100)); // cheaper = higher
  const hasKids = s.children > 0;
  const kidFriendly = hasKids && (apt.amenities||[]).some(a => /kitchen|wash|safe|child|family/i.test(a)) ? 8 : 0;
  return ratingWeight + reviewWeight + capacityFit + priceScore + kidFriendly + (apt.source === 'native' ? 15 : 0);
}

function _distKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function updateResultLabel(mode) {
  const num = document.getElementById('result-num');
  const label = document.getElementById('result-label');
  if (!label) return;
  const loc = _searchState.loc ? (' in ' + _searchState.loc.charAt(0).toUpperCase() + _searchState.loc.slice(1)) : '';
  if (mode === 'affordable') label.textContent = `most affordable stays${loc}`;
  else if (mode === 'bestvalue') label.textContent = `best value stays${loc}`;
  else if (mode === 'nearest') label.textContent = `stays nearest to you${loc}`;
  else label.textContent = `stays available${loc}`;
}
