<!-- ══ INTERSTITIAL · instant decision (must be first, runs before paint) ══
     Paints a curtain ONLY on a fresh dashboard visit — never when the
     user is navigating back from a service page (identified by ?back=1).
     The engine (apa-interstitial.js) fills the curtain with the video/image.
     If back=1 is present, or no active campaign exists, nothing paints. ══ -->
<style id="apa-splash-css">.apa-splash-lock{overflow:hidden !important;}</style>
<script>
(function(){
  try{
    /* Skip entirely when returning from a service page inside the app */
    if(location.search.indexOf('back=1') !== -1) return;

    var raw = localStorage.getItem('apa-splash-config');
    if(!raw) return;
    var c = JSON.parse(raw);
    if(!c || c.active !== true) return;
    if(c.type !== 'video' && c.type !== 'image') return;
    if(typeof c.url !== 'string' || c.url.length < 8) return;

    /* frequency cap — mirror of the engine's logic, kept tiny */
    if(c.frequency !== 'always'){
      var s = localStorage.getItem('apa-splash-seen');
      if(s){ s = JSON.parse(s);
        if(s && s.campaign === c.campaign){
          if(c.frequency === 'daily'){ if(Date.now()-(s.ts||0) < 864e5) return; }
          else return; /* once */
        }
      }
    }

    /* Paint the curtain now, before anything else renders. */
    document.documentElement.classList.add('apa-splash-lock');
    var d = document.createElement('div');
    d.id = 'apa-splash-curtain';
    d.style.cssText = 'position:fixed;inset:0;z-index:2147483000;background:#0A0A14;display:block;';
    d.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">'
      + '<div style="width:34px;height:34px;border-radius:50%;border:2.5px solid rgba(255,255,255,.18);'
      + 'border-top-color:rgba(255,255,255,.75);animation:apaSplashSpin .8s linear infinite;"></div></div>'
      + '<style>@keyframes apaSplashSpin{to{transform:rotate(360deg)}}</style>';
    (document.body || document.documentElement).appendChild(d);

    /* WATCHDOG: if the engine hasn't taken over within 8s, tear down. */
    window.__apaSplashWatch = setTimeout(function(){
      var el = document.getElementById('apa-splash-curtain');
      if(el && el.parentNode){ el.parentNode.removeChild(el); }
      document.documentElement.classList.remove('apa-splash-lock');
    }, 8000);
  }catch(e){ /* any failure ⇒ no curtain ⇒ site loads normally */ }
})();
</script>

<script>
/* ── Guaranteed loader failsafe — runs before anything else ── */
window.addEventListener('load', function() {
  // If loader hasn't been dismissed after 4s, force it
  setTimeout(function() {
    var l = document.getElementById('loader');
    if(l && !l.classList.contains('done')) {
      l.classList.add('done');
      // Also ensure guest screen is showing
      var screens = document.querySelectorAll('.screen');
      var anyActive = false;
      screens.forEach(function(s){ if(s.classList.contains('active')) anyActive=true; });
      if(!anyActive){
        var guest = document.getElementById('screen-guest');
        if(guest) guest.classList.add('active');
      }
    }
  }, 4000);
});
// Hard failsafe — if EVERYTHING hangs, force dismiss at 6s
setTimeout(function(){
  var l = document.getElementById('loader');
  if(l && !l.classList.contains('done')){
    l.classList.add('done');
    var guest = document.getElementById('screen-guest');
    if(guest && !document.querySelector('.screen.active')) guest.classList.add('active');
  }
}, 6000);
</script>

/* ══ GLOWING CABANA — layered technique for a REAL glow ══

.drb-i-cab{

  content:attr(data-text);
  position:absolute;inset:0;z-index:-1;
  background:linear-gradient(120deg,#FF6A3C,#FF3D8B,#FFB347,#4EE0C8);

}

}

.drawer{position:fixed;top:0;left:0;bottom:0;width:300px;z-index:201;background:rgba(252,252,253,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .5s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;padding:24px;overflow-y:auto;overscroll-behavior:contain;}
.drawer.open{transform:none;}
.drawer-head{display:flex;align-items:center;gap:12px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--line);}
.drawer-logo{height:36px;}
.drawer-logo-cab{height:28px;width:auto;display:block;}
.drawer-icon{height:32px;width:32px;object-fit:contain;flex-shrink:0;}
.drawer-head{display:flex;align-items:center;gap:10px;}
.tb-icon-sm{height:30px;width:30px;object-fit:contain;flex-shrink:0;border-radius:8px;}
.drawer-link{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:14px;font-size:14px;font-weight:500;color:var(--ink-soft);text-decoration:none;cursor:pointer;transition:all .25s;margin-bottom:3px;}
.drawer-link:hover{background:rgba(184,164,244,.12);color:var(--ink);}
.drawer-link svg{width:20px;height:20px;color:var(--lilac-deep);}
.drawer-foot{margin-top:auto;padding-top:20px;border-top:1px solid var(--line);}

/* ══════════ SERVICE TRANSITION OVERLAY ══════════ */
#svc-transition{position:fixed;inset:0;z-index:9998;pointer-events:none;opacity:0;visibility:hidden;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#svc-transition.active{opacity:1;visibility:visible;pointer-events:all;}
.svct-bg{position:absolute;inset:0;opacity:0;transition:opacity .35s;}
#svc-transition.active .svct-bg{opacity:1;}
.svct-scene{position:absolute;inset:0;overflow:hidden;z-index:3;}
.svct-label{position:relative;z-index:6;text-align:center;transform:translateY(24px);opacity:0;transition:all .5s cubic-bezier(.22,1,.36,1) .2s;}
#svc-transition.active .svct-label{transform:none;opacity:1;}
.svct-label-name{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:clamp(36px,6vw,64px);color:#fff;letter-spacing:-.02em;text-shadow:0 4px 30px rgba(0,0,0,.35);}
.svct-label-sub{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-top:8px;}

/* ══ CINEMATIC SCENES — pure CSS, instant, GPU-friendly ══ */
/* FLIGHTS: jet + vapor + parallax clouds */
.scn-cloud{position:absolute;background:rgba(255,255,255,.85);border-radius:100px;filter:blur(1px);}
.scn-cloud::before,.scn-cloud::after{content:'';position:absolute;background:inherit;border-radius:50%;}
.scn-cloud::before{width:60%;height:160%;top:-70%;left:15%;}
.scn-cloud::after{width:45%;height:120%;top:-45%;right:12%;}
#svc-transition.active .scn-cloud-1{animation:cloudDrift 1.4s linear forwards;}
#svc-transition.active .scn-cloud-2{animation:cloudDrift 1.4s .05s linear forwards;}
#svc-transition.active .scn-cloud-3{animation:cloudDrift 1.4s .1s linear forwards;}
@keyframes cloudDrift{from{transform:translateX(0);}to{transform:translateX(-140px);}}
.scn-jet{position:absolute;left:-160px;top:60%;z-index:4;}
.scn-jet svg{width:110px;height:110px;color:#fff;filter:drop-shadow(0 8px 24px rgba(0,0,0,.35));}
#svc-transition.active .scn-jet{animation:jetFly 1.25s cubic-bezier(.45,.05,.55,.95) forwards;}
@keyframes jetFly{0%{left:-160px;top:62%;transform:rotate(-14deg) scale(.75);}55%{transform:rotate(-4deg) scale(1);}100%{left:112%;top:24%;transform:rotate(6deg) scale(1.12);}}
.scn-vapor{position:absolute;height:2.5px;top:47%;left:-10%;width:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8));border-radius:3px;z-index:3;}
#svc-transition.active .scn-vapor{animation:vaporGrow 1.25s cubic-bezier(.45,.05,.55,.95) forwards;}
@keyframes vaporGrow{0%{width:0;opacity:0;}35%{opacity:1;}100%{width:125%;opacity:0;}}

/* TOURS: sunset savanna + jeep */
.scn-sun{position:absolute;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#FFE9A8,#FFB84D 65%,transparent 72%);right:14%;top:16%;opacity:0;}
#svc-transition.active .scn-sun{animation:sunGlow 1.3s ease forwards;}
@keyframes sunGlow{0%{opacity:0;transform:translateY(20px) scale(.9);}100%{opacity:1;transform:none;}}
.scn-ground{position:absolute;bottom:0;left:0;right:0;height:24%;background:rgba(20,10,5,.5);}
.scn-acacia{position:absolute;bottom:22%;right:20%;opacity:0;}
.scn-acacia svg{width:120px;height:100px;color:rgba(25,12,5,.8);}
#svc-transition.active .scn-acacia{animation:fadeUp .7s .2s ease forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.scn-jeep{position:absolute;bottom:21%;left:-200px;z-index:4;}
.scn-jeep svg{width:130px;height:80px;color:rgba(20,10,5,.92);filter:drop-shadow(0 6px 16px rgba(0,0,0,.3));}
#svc-transition.active .scn-jeep{animation:jeepDrive 1.3s cubic-bezier(.5,.05,.6,.95) forwards;}
@keyframes jeepDrive{0%{left:-200px;transform:translateY(0);}25%{transform:translateY(-3px);}50%{transform:translateY(1px);}75%{transform:translateY(-2px);}100%{left:112%;transform:translateY(0);}}

/* STAYS: skyline rising + window lights */
.scn-bldg{position:absolute;bottom:0;background:rgba(15,8,35,.75);border-radius:6px 6px 0 0;transform:translateY(101%);}
#svc-transition.active .scn-bldg{animation:bldgRise .8s cubic-bezier(.22,1,.36,1) forwards;}
#svc-transition.active .scn-bldg-2{animation-delay:.08s;}
#svc-transition.active .scn-bldg-3{animation-delay:.16s;}
#svc-transition.active .scn-bldg-4{animation-delay:.24s;}
@keyframes bldgRise{to{transform:translateY(0);}}
.scn-win{position:absolute;width:7px;height:9px;background:#FCD34D;border-radius:1px;opacity:0;}
#svc-transition.active .scn-win{animation:winOn .3s ease forwards;}
@keyframes winOn{to{opacity:.95;}}

/* EVENTS: spotlights + confetti */
.scn-beam{position:absolute;bottom:-10%;width:130px;height:130%;background:linear-gradient(to top,rgba(255,255,255,.32),transparent 80%);clip-path:polygon(42% 100%,58% 100%,100% 0,0 0);transform-origin:bottom center;opacity:0;}
#svc-transition.active .scn-beam-1{left:22%;animation:beamSweep 1.3s ease-in-out forwards;}
#svc-transition.active .scn-beam-2{right:22%;animation:beamSweep2 1.3s ease-in-out forwards;}
@keyframes beamSweep{0%{opacity:0;transform:rotate(-24deg);}25%{opacity:1;}100%{opacity:.9;transform:rotate(16deg);}}
@keyframes beamSweep2{0%{opacity:0;transform:rotate(24deg);}25%{opacity:1;}100%{opacity:.9;transform:rotate(-16deg);}}
.scn-conf{position:absolute;width:8px;height:12px;border-radius:2px;top:-20px;opacity:0;}
#svc-transition.active .scn-conf{animation:confFall 1.2s ease-in forwards;}
@keyframes confFall{0%{opacity:0;transform:translateY(0) rotate(0);}15%{opacity:1;}100%{opacity:.9;transform:translateY(105vh) rotate(340deg);}}

/* RIDES: road + car + speed lines */
.scn-road{position:absolute;bottom:0;left:0;right:0;height:26%;background:rgba(10,8,20,.55);}
.scn-dash{position:absolute;bottom:12.5%;height:5px;width:70px;background:rgba(255,255,255,.75);border-radius:3px;}
#svc-transition.active .scn-dash{animation:dashMove .5s linear infinite;}
@keyframes dashMove{from{transform:translateX(0);}to{transform:translateX(-190px);}}
.scn-car{position:absolute;bottom:17%;left:-180px;z-index:4;}
.scn-car svg{width:130px;height:70px;color:#fff;filter:drop-shadow(0 8px 22px rgba(0,0,0,.35));}
#svc-transition.active .scn-car{animation:carDrive 1.25s cubic-bezier(.5,.05,.55,.95) forwards;}
@keyframes carDrive{0%{left:-180px;transform:translateY(0);}30%{transform:translateY(-2px);}60%{transform:translateY(1px);}100%{left:112%;transform:translateY(0);}}
.scn-speed{position:absolute;height:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55));border-radius:3px;width:0;}
#svc-transition.active .scn-speed{animation:speedLine .9s ease-out forwards;}
@keyframes speedLine{0%{width:0;opacity:0;}30%{opacity:1;}100%{width:44%;opacity:0;}}

/* FOOD: plate + steam */
.scn-plate{position:absolute;left:50%;bottom:26%;transform:translateX(-50%) translateY(60px);opacity:0;z-index:4;}
.scn-plate svg{width:150px;height:110px;color:#fff;filter:drop-shadow(0 10px 30px rgba(0,0,0,.3));}
#svc-transition.active .scn-plate{animation:plateUp .7s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes plateUp{to{transform:translateX(-50%) translateY(0);opacity:1;}}
.scn-steam{position:absolute;bottom:52%;width:4px;height:44px;border-radius:4px;background:linear-gradient(to top,rgba(255,255,255,.7),transparent);opacity:0;}
#svc-transition.active .scn-steam{animation:steamRise 1.1s ease-in-out .35s infinite;}
@keyframes steamRise{0%{opacity:0;transform:translateY(8px) scaleY(.6);}40%{opacity:.85;}100%{opacity:0;transform:translateY(-26px) scaleY(1.15);}}

/* SHOPPING: bag pop + sparkles */
.scn-bag{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(0) rotate(-8deg);z-index:4;}
.scn-bag svg{width:120px;height:120px;color:#fff;filter:drop-shadow(0 10px 30px rgba(0,0,0,.3));}
#svc-transition.active .scn-bag{animation:bagPop .75s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes bagPop{60%{transform:translate(-50%,-50%) scale(1.06) rotate(3deg);}100%{transform:translate(-50%,-50%) scale(1) rotate(0);}}
.scn-spark{position:absolute;width:9px;height:9px;background:#FCD34D;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;}
#svc-transition.active .scn-spark{animation:sparkPop .55s ease-out forwards;}
@keyframes sparkPop{0%{opacity:0;transform:scale(0);}55%{opacity:1;transform:scale(1.25);}100%{opacity:0;transform:scale(.6);}}

/* CARHIRE: car + key-fob unlock arcs */
.scn-hire{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.85);opacity:0;z-index:4;}
.scn-hire svg{width:160px;height:90px;color:#fff;filter:drop-shadow(0 10px 26px rgba(0,0,0,.3));}
#svc-transition.active .scn-hire{animation:hireIn .6s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes hireIn{to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
.scn-arc{position:absolute;border:3px solid rgba(255,255,255,.85);border-radius:50%;border-left-color:transparent;border-bottom-color:transparent;border-right-color:transparent;opacity:0;}
#svc-transition.active .scn-arc-1{animation:arcPing .5s .35s ease-out forwards;}
#svc-transition.active .scn-arc-2{animation:arcPing .5s .5s ease-out forwards;}
#svc-transition.active .scn-arc-3{animation:arcPing .5s .65s ease-out forwards;}
@keyframes arcPing{0%{opacity:0;transform:scale(.6);}45%{opacity:1;}100%{opacity:0;transform:scale(1.15);}}

/* ROOMMATES: avatars meeting */
.scn-av{position:absolute;top:38%;width:86px;height:86px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;z-index:4;box-shadow:0 12px 32px rgba(0,0,0,.25);}
.scn-av svg{width:44px;height:44px;}
.scn-av-1{left:-110px;background:linear-gradient(135deg,#2DD4BF,#0D9488);}
.scn-av-2{right:-110px;background:linear-gradient(135deg,#5EEAD4,#14B8A6);}
#svc-transition.active .scn-av-1{animation:avMeetL .8s cubic-bezier(.22,1,.36,1) forwards;}
#svc-transition.active .scn-av-2{animation:avMeetR .8s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes avMeetL{to{left:calc(50% - 96px);}}
@keyframes avMeetR{to{right:calc(50% - 96px);}}
.scn-plus{position:absolute;left:50%;top:41.5%;transform:translate(-50%,0) scale(0);font-size:30px;font-weight:700;color:#fff;z-index:5;text-shadow:0 4px 16px rgba(0,0,0,.3);}
#svc-transition.active .scn-plus{animation:plusPop .45s .55s cubic-bezier(.34,1.56,.64,1) forwards;}
@keyframes plusPop{to{transform:translate(-50%,0) scale(1);}}

/* ══════════ PARTNER STATES (reuse classes) ══════════ */
#p-state-loading{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;}
.p-spin{width:48px;height:48px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--lilac-deep);animation:spin 1s linear infinite;}

/* toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);z-index:9999;padding:14px 24px;border-radius:100px;background:var(--ink);color:#fff;font-size:13px;font-weight:500;box-shadow:0 16px 50px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:transform .2s ease,box-shadow .2s ease;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* responsive */
@media(max-width:900px){.content{padding:24px 18px 60px;}.topbar{padding:0 18px;}}
@media(max-width:560px){.hero-body{padding:28px;}.greeting-title{font-size:32px;}}

/* ══ GLOBAL SEARCH ══ */

@keyframes spin{to{transform:rotate(360deg);}}


@keyframes pill-pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.55;transform:scale(.78);}}


/* ══════════════════════════════════════════════════════════════════════
   VIBE ENGINE v7 — BIG, LOUD, UNMISSABLE
   Dancers are 80×110px — the size of actual background art
   Full opacity, strong glow, extreme amplitude moves
   Spread across full greeting width on the right side
   Text has backdrop so it reads cleanly above the action
   ══════════════════════════════════════════════════════════════════════ */

/* ── GREETING — relative so stage positions inside it ── */
.greeting { position: relative !important; overflow: visible !important; }

/* ── STAGE: true ghost — zero layout footprint ── */
#dancer-stage {
  position: absolute;
  top: 50%;
  right: -12px;
  transform: translateY(-50%);
  pointer-events: none;
  z-index: 0;
  user-select: none;
  overflow: visible;
  height: 0;           /* zero height — no layout contribution */
  width: 0;            /* zero width — no layout contribution  */
  display: block;
}
/* The troupe floats out of the zero-size anchor */
.ds-troupe {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  gap: 0;
  overflow: visible;
}


/* ── DANCER CELL ── */
.ds-dancer {
  display: flex;
  align-items: flex-end;
}
.ds-body-wrap { display: flex; align-items: flex-end; will-change: transform; line-height: 0; }

/* ── SVG — big, vivid, GPU-composited ── */
.ds-svg {
  overflow: visible;
  display: block;
  opacity: 0.82;
}

/* ── JOINT CLASSES ── */
.ds-head, .ds-hip, .ds-torso,
.ds-arm-l, .ds-arm-r, .ds-fore-l, .ds-fore-r,
.ds-leg-l, .ds-leg-r, .ds-shin-l, .ds-shin-r,
.ds-digit-body { will-change: transform; }

/* ── COLON ── */
.ds-colon {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
  justify-content: center;
  padding-bottom: 30px;
  width: 14px;
}
.ds-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
}
.ds-dot:nth-child(1) {
  background: rgba(155,95,255,0.85);
  box-shadow: 0 0 10px rgba(155,95,255,0.7);
  animation: ds-dot-pulse 1s ease-in-out infinite;
}
.ds-dot:nth-child(2) {
  background: rgba(255,92,138,0.85);
  box-shadow: 0 0 10px rgba(255,92,138,0.7);
  animation: ds-dot-pulse 1s ease-in-out 0.5s infinite;
}
@keyframes ds-dot-pulse {
  0%,100% { transform: scale(1);   opacity: 1;    }
  50%     { transform: scale(0.3); opacity: 0.1;  }
}

/* ── GLOW per dancer ── */
@keyframes h1-glow {
  0%,100% { filter: drop-shadow(0 0 8px rgba(155,95,255,0.6)); }
  35%     { filter: drop-shadow(0 0 20px rgba(192,38,211,1.0)) drop-shadow(0 0 40px rgba(155,95,255,0.5)); }
  70%     { filter: drop-shadow(0 0 14px rgba(155,95,255,0.8)); }
}
@keyframes h2-glow {
  0%,100% { filter: drop-shadow(0 0 8px rgba(67,97,255,0.6)); }
  25%,75% { filter: drop-shadow(0 0 18px rgba(0,180,216,0.95)) drop-shadow(0 0 36px rgba(67,97,255,0.4)); }
}
@keyframes m1-glow {
  0%,100% { filter: drop-shadow(0 0 8px rgba(45,212,191,0.6)); }
  50%     { filter: drop-shadow(0 0 22px rgba(5,150,105,1.0)) drop-shadow(0 0 44px rgba(45,212,191,0.4)); }
}
@keyframes m2-glow {
  0%,6%,13%,100% { filter: drop-shadow(0 0 8px rgba(255,92,138,0.6)); }
  7%,14% { filter: drop-shadow(0 0 24px rgba(255,92,138,1.0)) drop-shadow(0 0 48px rgba(255,154,92,0.5)); }
}
#ds-h1 .ds-svg { animation: h1-glow 1.4s cubic-bezier(.4,0,.2,1) infinite; }
#ds-h2 .ds-svg { animation: h2-glow 2.4s steps(1) infinite; }
#ds-m1 .ds-svg { animation: m1-glow 3.6s cubic-bezier(.45,.05,.55,.95) infinite; }
#ds-m2 .ds-svg { animation: m2-glow 2.2s cubic-bezier(.55,.06,.68,.19) infinite; }

/* ── GREETING TEXT floats above dancers ── */
.greeting-title { position: relative; z-index: 2; }
.greeting-sub   { position: relative; z-index: 2; }

/* ══════════════════════════════════════════════════════════════════════
   D1 — TWERK QUEEN (violet/magenta) — low squat hip pop
   AMPLITUDE CRANKED: hip swings ±40deg, body permanently 20px low
   ══════════════════════════════════════════════════════════════════════ */
@keyframes tw-body {
  0%   { transform: translateY(18px) translateX(0)    scaleY(0.84) rotate(0);     }
  12%  { transform: translateY(20px) translateX(-7px)  scaleY(0.82) rotate(-5deg); }
  24%  { transform: translateY(12px) translateX(-5px)  scaleY(0.90) rotate(-3deg); }
  36%  { transform: translateY(22px) translateX(0)    scaleY(0.80) rotate(0);     }
  48%  { transform: translateY(20px) translateX(7px)   scaleY(0.82) rotate(5deg);  }
  60%  { transform: translateY(12px) translateX(5px)   scaleY(0.90) rotate(3deg);  }
  72%  { transform: translateY(22px) translateX(0)    scaleY(0.80) rotate(0);     }
  84%  { transform: translateY(16px) translateX(-4px)  scaleY(0.86) rotate(-2deg); }
  100% { transform: translateY(18px) translateX(0)    scaleY(0.84) rotate(0);     }
}
@keyframes tw-hip {
  0%   { transform: rotate(0)     translateX(0)    translateY(0);    }
  8%   { transform: rotate(-38deg) translateX(-9px)  translateY(-6px); }
  18%  { transform: rotate(-45deg) translateX(-11px) translateY(6px);  }
  30%  { transform: rotate(-22deg) translateX(-5px)  translateY(-3px); }
  42%  { transform: rotate(0)     translateX(0)    translateY(-7px);  }
  54%  { transform: rotate(40deg)  translateX(10px)  translateY(6px);  }
  66%  { transform: rotate(46deg)  translateX(12px)  translateY(-4px); }
  78%  { transform: rotate(24deg)  translateX(6px)   translateY(3px);  }
  100% { transform: rotate(0)     translateX(0)    translateY(0);    }
}
@keyframes tw-torso {
  0%,100% { transform: rotate(0)    skewX(0);     }
  14%  { transform: rotate(14deg)  skewX(7deg);  }
  30%  { transform: rotate(18deg)  skewX(10deg); }
  44%  { transform: rotate(6deg)   skewX(3deg);  }
  58%  { transform: rotate(-16deg) skewX(-8deg); }
  72%  { transform: rotate(-20deg) skewX(-11deg);}
  86%  { transform: rotate(-7deg)  skewX(-4deg); }
}
@keyframes tw-head {
  0%,100% { transform: rotate(0)    translateY(0);   }
  16%  { transform: rotate(12deg)  translateY(-4px); }
  32%  { transform: rotate(16deg)  translateY(-6px); }
  48%  { transform: rotate(3deg)   translateY(-2px); }
  62%  { transform: rotate(-14deg) translateY(-5px); }
  78%  { transform: rotate(-18deg) translateY(-7px); }
  92%  { transform: rotate(-5deg)  translateY(-3px); }
}
@keyframes tw-arm-l {
  0%,100% { transform: rotate(-80deg); }
  20%  { transform: rotate(-95deg);  }
  40%  { transform: rotate(-70deg);  }
  60%  { transform: rotate(-105deg); }
  80%  { transform: rotate(-75deg);  }
}
@keyframes tw-fore-l {
  0%,100% { transform: rotate(55deg); }
  25%  { transform: rotate(75deg);  }
  50%  { transform: rotate(50deg);  }
  75%  { transform: rotate(70deg);  }
}
@keyframes tw-arm-r {
  0%,100% { transform: rotate(80deg); }
  20%  { transform: rotate(70deg);   }
  40%  { transform: rotate(95deg);   }
  60%  { transform: rotate(75deg);   }
  80%  { transform: rotate(105deg);  }
}
@keyframes tw-fore-r {
  0%,100% { transform: rotate(-55deg); }
  25%  { transform: rotate(-50deg);  }
  50%  { transform: rotate(-75deg);  }
  75%  { transform: rotate(-52deg);  }
}
@keyframes tw-leg-l {
  0%,100% { transform: rotate(-35deg); }

      navigator.serviceWorker.getRegistrations().then(regs => {

      navigator.serviceWorker.register('/sw.js').then(reg => {

          const w = reg.installing;
