<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --glass:#FCFCFD;--glass-2:#F4F5FB;--glass-3:#EBEDF7;
  --ink:#0A0A14;--ink-soft:#4A4C66;--ink-faint:#8E90AD;
  --lilac:#B8A4F4;--lilac-deep:#8B6FE8;--mint:#5EEAD4;--mint-deep:#2DD4BF;
  --peach:#FFB59E;--electric:#4361FF;--violet:#7B2FF7;--ember:#FF6B2C;
  --line:rgba(10,10,20,0.07);--line-2:rgba(10,10,20,0.13);
  --font-display:'Fraunces',serif;--font-body:'General Sans',system-ui,sans-serif;
  --font-data:'Geist',monospace;
  --shadow-glass:0 8px 32px rgba(0,0,0,0.06);
  --shadow-lift:0 24px 64px rgba(0,0,0,0.12);
  --radius:20px;
}
html,body{min-height:100%;font-family:var(--font-body);background:var(--glass);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;}

/* aurora */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.ab{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;mix-blend-mode:multiply;animation:drift 26s ease-in-out infinite;}
.ab-1{width:560px;height:560px;top:-12%;left:-8%;background:radial-gradient(circle,var(--t1),transparent 68%);}
.ab-2{width:460px;height:460px;bottom:-10%;right:-6%;animation-delay:-10s;opacity:.26;background:radial-gradient(circle,var(--t2),transparent 70%);}
.ab-3{width:380px;height:380px;top:40%;left:40%;animation-delay:-18s;opacity:.2;background:radial-gradient(circle,var(--t3),transparent 72%);}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(50px,-36px) scale(1.1);}66%{transform:translate(-36px,46px) scale(.94);}}

/* ── ENTRY TRANSITION ── */
#tx{position:fixed;inset:0;z-index:9999;background:#05060F;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#tx.done{animation:txOut .9s cubic-bezier(.7,0,.2,1) forwards;}
@keyframes txOut{to{opacity:0;transform:scale(1.1);visibility:hidden;pointer-events:none;}}
.tx-aurora{position:absolute;inset:0;}
.tx-ab{position:absolute;border-radius:50%;filter:blur(80px);opacity:0;animation:txBloom 1.1s cubic-bezier(.4,0,.2,1) forwards;}
.tx-ab-1{width:420px;height:420px;top:30%;left:28%;background:radial-gradient(circle,var(--t1),transparent 68%);}
.tx-ab-2{width:360px;height:360px;bottom:26%;right:24%;animation-delay:.12s;background:radial-gradient(circle,var(--t2),transparent 70%);}
@keyframes txBloom{to{opacity:.55;}}
.tx-craft{position:relative;z-index:2;text-align:center;}
.tx-ico{margin:0 auto 18px;opacity:0;animation:txRise 1s .15s cubic-bezier(.34,1.56,.64,1) forwards;filter:drop-shadow(0 8px 30px var(--t1));}
@keyframes txRise{0%{opacity:0;transform:var(--rise-from);}100%{opacity:1;transform:none;}}
.tx-label{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:38px;color:#fff;opacity:0;animation:fadeUp .7s .5s forwards;background:linear-gradient(120deg,var(--t1-light),#fff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.tx-sub{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-top:8px;opacity:0;animation:fadeUp .6s .65s forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:100;height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:rgba(252,252,253,.74);backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid var(--line);}
.tb-left{display:flex;align-items:center;gap:12px;}
.tb-back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);transition:all .25s;text-decoration:none;}
.tb-back:hover{border-color:var(--t1);color:var(--t1);}
.tb-logo{height:48px;width:auto;}
.tb-brand{font-family:var(--font-display);font-weight:500;font-size:18px;}
.tb-brand em{font-style:italic;background:var(--theme-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.tb-right{display:flex;align-items:center;gap:10px;}
.tb-chip{font-size:11px;font-weight:600;padding:6px 13px;border-radius:100px;color:var(--t1);background:rgba(var(--t1-rgb),.08);border:1px solid rgba(var(--t1-rgb),.2);}

/* ── HERO STRIP ── */
.hero{position:relative;z-index:2;padding:36px 26px 0;max-width:1180px;margin:0 auto;}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--t1);margin-bottom:12px;padding:6px 14px;border-radius:100px;background:rgba(var(--t1-rgb),.09);border:1px solid rgba(var(--t1-rgb),.2);}
.hero-title{font-family:var(--font-display);font-weight:400;font-size:clamp(28px,4.4vw,46px);letter-spacing:-.02em;line-height:1.06;margin-bottom:10px;}
.hero-title em{font-style:italic;font-weight:500;background:var(--theme-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-sub{font-size:15px;color:var(--ink-soft);margin-bottom:28px;max-width:500px;line-height:1.6;}

/* live exchange-rate banner */
.kes-rate-banner{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink-soft);padding:7px 14px;border-radius:100px;background:rgba(255,255,255,.6);border:1px solid var(--line);margin-bottom:14px;}
.kes-rate-banner strong{color:var(--violet);font-weight:600;}
.kes-rate-banner.stale{color:var(--ink-faint);}

/* search / filter bar */
.search-bar{display:flex;align-items:stretch;gap:0;background:rgba(255,255,255,.68);backdrop-filter:blur(14px);border:1px solid var(--line-2);border-radius:16px;padding:5px;box-shadow:var(--shadow-glass);max-width:720px;margin-bottom:18px;}
.sb-field{flex:1;padding:10px 16px;cursor:pointer;border-radius:12px;transition:background .2s;min-width:0;}
.sb-field:hover{background:var(--glass-2);}
.sb-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:2px;}
.sb-val{font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-val.ph{color:var(--ink-faint);font-weight:400;}
.sb-sep{width:1px;background:var(--line);margin:8px 0;}
.sb-btn{width:48px;border-radius:12px;background:var(--theme-grad);border:none;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;margin-left:4px;flex-shrink:0;transition:filter .2s;}
.sb-btn:hover{filter:brightness(1.1);}

/* filter chips */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink-soft);padding:8px 14px;border-radius:100px;background:rgba(255,255,255,.6);border:1px solid var(--line);cursor:pointer;transition:all .22s;white-space:nowrap;}
.fchip:hover{border-color:var(--t1);}
.fchip.active{background:var(--theme-grad);color:#fff;border-color:transparent;}

/* content area */
.content{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:16px 26px 70px;}
.content-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.result-count{font-size:14px;color:var(--ink-soft);}
.result-count strong{color:var(--ink);}

/* CARD GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
.card{border-radius:var(--radius);overflow:hidden;background:rgba(255,255,255,.64);backdrop-filter:blur(10px);border:1px solid var(--line);cursor:pointer;transition:all .4s cubic-bezier(.22,1,.36,1);opacity:0;transform:translateY(20px);}
.card.in{opacity:1;transform:none;}
.card:hover{transform:translateY(-7px);box-shadow:var(--shadow-lift);border-color:transparent;}
.card-img{height:190px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.22,1,.36,1);}
.card:hover .card-img img{transform:scale(1.06);}
.card-img-ico{width:52px;height:52px;color:rgba(255,255,255,.9);}
.card-badge{position:absolute;top:12px;left:12px;padding:5px 11px;border-radius:100px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(252,252,253,.9);backdrop-filter:blur(8px);color:var(--t1);}
.card-fav{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(252,252,253,.85);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;font-size:14px;transition:transform .2s;}
.card-fav:hover{transform:scale(1.12);}
.card-body{padding:16px 18px 18px;}
.card-meta-top{font-size:11px;color:var(--ink-faint);margin-bottom:5px;display:flex;align-items:center;gap:4px;}
.card-meta-top svg{width:11px;height:11px;}
.card-name{font-family:var(--font-display);font-weight:500;font-size:17px;color:var(--ink);margin-bottom:10px;line-height:1.25;}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px;}
.card-tag{font-size:11px;color:var(--ink-soft);padding:4px 9px;border-radius:100px;background:var(--glass-2);border:1px solid var(--line);}
.card-foot{display:flex;align-items:flex-end;justify-content:space-between;}
.card-price .val{font-family:var(--font-display);font-weight:500;font-size:20px;color:var(--ink);}
.card-price .per{font-size:12px;color:var(--ink-faint);}
.card-go{width:36px;height:36px;border-radius:50%;background:var(--glass-2);display:flex;align-items:center;justify-content:center;color:var(--t1);transition:all .3s;}
.card:hover .card-go{background:var(--theme-grad);color:#fff;transform:rotate(-45deg);}

/* DRAWER */
.drawer-overlay{position:fixed;inset:0;z-index:200;background:rgba(10,10,20,.45);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:all .38s;}
.drawer-overlay.open{opacity:1;visibility:visible;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:94vw;z-index:201;background:var(--glass);box-shadow:-16px 0 50px rgba(10,10,20,.12);transform:translateX(105%);transition:transform .5s cubic-bezier(.22,1,.36,1);overflow-y:auto;}
.drawer.open{transform:none;}
.dr-img{height:240px;position:relative;display:flex;align-items:center;justify-content:center;}
.dr-img-ico{width:60px;height:60px;color:rgba(255,255,255,.9);}
.dr-close{position:absolute;top:16px;left:16px;width:38px;height:38px;border-radius:50%;background:rgba(252,252,253,.88);backdrop-filter:blur(8px);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);z-index:2;}
.dr-body{padding:24px 26px 36px;}
.dr-tag{font-size:12px;color:var(--ink-faint);margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.dr-title{font-family:var(--font-display);font-weight:500;font-size:24px;margin-bottom:14px;line-height:1.2;}
.dr-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
.dr-desc{font-size:14px;color:var(--ink-soft);line-height:1.7;margin-bottom:20px;}
.dr-includes{margin-bottom:22px;}
.dr-includes-title{font-family:var(--font-display);font-weight:500;font-size:15px;margin-bottom:10px;}
.dr-includes-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.dr-include{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
.dr-cta-box{position:sticky;bottom:0;background:var(--glass);border-top:1px solid var(--line);padding:16px 0 0;}
.dr-price .val{font-family:var(--font-display);font-weight:600;font-size:26px;color:var(--ink);}
.dr-price .per{font-size:14px;color:var(--ink-faint);}
.dr-price .note{font-size:12px;color:var(--t1);font-weight:500;margin-top:3px;}
.dr-cta{width:100%;padding:15px;border-radius:14px;background:var(--theme-grad);color:#fff;font-family:var(--font-body);font-weight:600;font-size:15px;border:none;cursor:pointer;transition:all .28s;margin-top:12px;box-shadow:0 10px 28px rgba(0,0,0,.15);}
.dr-cta:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(0,0,0,.2);}

/* empty */
.empty{text-align:center;padding:60px 20px;grid-column:1/-1;}
.empty svg{width:52px;height:52px;color:var(--ink-faint);opacity:.3;margin:0 auto 16px;display:block;}
.empty-title{font-family:var(--font-display);font-size:20px;margin-bottom:8px;}
.empty-sub{font-size:13px;color:var(--ink-soft);}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(16px);z-index:9999;padding:12px 20px;border-radius:100px;background:var(--ink);color:#fff;font-size:13px;font-weight:500;box-shadow:var(--shadow-lift);opacity:0;transition:all .35s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:600px){.grid{grid-template-columns:1fr;}.hero,.content{padding-left:16px;padding-right:16px;}.drawer{width:100%;}}


/* Flight card specifics */
.flight-card{background:rgba(255,255,255,.68);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;align-items:center;gap:20px;cursor:pointer;transition:all .35s cubic-bezier(.22,1,.36,1);opacity:0;transform:translateY(16px);}
.flight-card.in{opacity:1;transform:none;}
.flight-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:transparent;}
.flight-airline{width:50px;height:50px;border-radius:14px;background:var(--theme-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:600;font-size:13px;flex-shrink:0;letter-spacing:.02em;}
.flight-route{flex:1;}
.flight-times{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
.flight-time{font-family:var(--font-data);font-weight:600;font-size:20px;color:var(--ink);}
.flight-arrow{flex:1;display:flex;align-items:center;gap:6px;color:var(--ink-faint);}
.flight-arrow-line{flex:1;height:1px;background:var(--line-2);position:relative;}
.flight-arrow-plane{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);color:var(--t1);}
.flight-meta{font-size:12px;color:var(--ink-faint);display:flex;gap:12px;}
.flight-stops{color:var(--t1);font-weight:600;}
.flight-price-block{text-align:right;flex-shrink:0;}
.flight-price{font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--ink);}
.flight-price-sub{font-size:11px;color:var(--ink-faint);}
.flight-book-btn{display:block;margin-top:6px;padding:8px 16px;border-radius:10px;background:var(--theme-grad);color:#fff;font-size:12px;font-weight:600;border:none;cursor:pointer;transition:filter .2s;}
.flight-book-btn:hover{filter:brightness(1.08);}

:root{
  --t1:#4361FF;--t2:#B8A4F4;--t3:#5EEAD4;
  --t1-rgb:67,97,255;
  --theme-grad:linear-gradient(135deg,#4361FF,#B8A4F4);
  --t1-light:#a5b4fc;
  --rise-from:translateX(-120px) translateY(20px) rotate(-12deg) scale(.7);
}

/* ══ MOBILE PERF: no backdrop-filter (GPU killer on mobile) ══ */
@media(max-width:700px){
  .card,.topbar,.search-bar,.drawer,.fchip,.card-badge,.card-fav,
  .tb-back,.sb-btn,.dr-close,.dr-cta-box,.toast{
    backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
  }
  .card{background:rgba(255,255,255,.96)!important;}
  .topbar{background:rgba(252,252,253,.98)!important;}
  .search-bar{background:rgba(255,255,255,.96)!important;}
  .drawer{background:#FCFCFD!important;}
  /* Reduce aurora opacity - expensive blur */
  .ab{filter:blur(40px)!important;opacity:.15!important;}
  /* Skip stagger animations - causes jank on mobile */
  .card{opacity:1!important;transform:none!important;animation:none!important;}
  .card.in{opacity:1!important;transform:none!important;}
}

@media(max-width:700px){
  .card,.topbar,.search-bar,.drawer,.fchip{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
  .card{background:rgba(255,255,255,.96)!important;opacity:1!important;transform:none!important;}
  .topbar{background:rgba(252,252,253,.98)!important;}
  .content{padding-left:12px!important;padding-right:12px!important;}
  .hero{padding-left:14px!important;padding-right:14px!important;}
  /* Flight card specific - prevent overflow */
  .card-body{overflow:hidden;}
  .card-price .val{font-size:16px!important;}
  .card-foot{flex-wrap:wrap!important;gap:6px!important;}
  .ab{filter:blur(40px)!important;opacity:.15!important;}
}

html.via-dash #tx{display:none!important;animation:none!important;}

/* ── Live USD → KES rate banner ──
   Independent of the Kiwi/Aviasales widget — fetches its own rate from a
   public, no-key exchange-rate API and shows it as a reference next to the
   widget (which only quotes in USD). Cached for 6 hours to limit requests.
   If the fetch fails for any reason, falls back to a fixed approximate
   rate so the banner never breaks or shows an error to visitors. */
(function(){
  const FALLBACK_RATE = 129.5; // approx USD→KES, update occasionally
  const CACHE_KEY = 'apatmento_usd_kes_rate';
  const CACHE_MS = 6 * 60 * 60 * 1000; // 6 hours
  const el = document.getElementById('kes-rate-text');
  const banner = document.getElementById('kes-rate-banner');
  if(!el) return;

  function render(rate, isLive){
    el.innerHTML = `💱 1 USD ≈ <strong>KES ${Math.round(rate).toLocaleString()}</strong> ${isLive?'· live rate':'· approx. rate'}`;
    if(!isLive) banner?.classList.add('stale');
  }

  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); }catch(e){}
  if(cached && cached.rate && (Date.now() - cached.time) < CACHE_MS){
    render(cached.rate, true);
    return;
  }

  fetch('https://open.er-api.com/v6/latest/USD')
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      const rate = data?.rates?.KES;
      if(!rate) throw new Error('no rate');
      render(rate, true);
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({rate, time: Date.now()})); }catch(e){}
    })
    .catch(() => render(FALLBACK_RATE, false));
})();
